/** 1st, 2nd, 3rd, 4th, and the teens which all take th */
function ordinal(n) {
  if (n % 100 >= 11 && n % 100 <= 13) return n + "th";
  return n + (["th", "st", "nd", "rd"][n % 10] ?? "th");
}

/**
 * What you could still take with a given pick.
 *
 * Best available falls as the rounds pass, so a player is worth
 * keeping for round R only while he beats whoever is left at that
 * pick. Reading the market's own draft order is the closest thing to
 * knowing who will be there.
 */
/**
 * What you could still take with a given pick, worth what he would be
 * worth to you.
 *
 * Value over replacement asks what a man is worth to a team that needs
 * one at his position. You start one quarterback, so the best
 * quarterback left is worth his full number to somebody who has none
 * and almost nothing to you if you are keeping two. Counting what you
 * already have stops a third quarterback being the reason to let a
 * back go.
 */
/**
 * The man you would draft at this pick instead, at the same position.
 *
 * Keeping a receiver for a seventh round pick means you do not spend
 * that seventh on a receiver, so what the keeper is worth is the gap to
 * the best receiver still on the board there. Compare him to the best
 * player at any position and the answer comes back a quarterback, because value over replacement is measured from a
 * different baseline for every position and the numbers do not mean the
 * same thing across them.
 */
/**
 * Who else could be there at that pick.
 *
 * Not one reference man but the few worth weighing him against:
 * anyone the room takes near this pick and might last to it, best
 * first by what we think they are worth. The window opens a little
 * before the pick, since draft position is an average and the men
 * who go a touch earlier are sometimes still sitting there.
 */
/**
 * How often he is still on the board at a pick, from his own draft
 * position and how far it swings either way.
 */
function stillThereAt(o, pick) {
  const early = o.adpHigh ?? o.adp;
  const late = o.adpLow ?? o.adp;

  if (!o.adp) {
    return 0;
  }

  if (pick <= early) {
    return 1;
  }

  /**
   * Past the latest anyone has taken him, one draft in ten still lets
   * him slide. Rooms differ and the range comes from other people's
   * drafts, so nobody is ever truly certain to be gone.
   */
  if (pick >= late) {
    return 0.1;
  }

  return 1 - (pick - early) / Math.max(1, late - early);
}

function optionsAt(pick, taken, exclude, position, howMany = 4) {
  if (!board || !board.players) {
    return [];
  }

  const from = pick - 6;
  const to = pick + 24;
  const near = (p) =>
    p.key !== exclude && !taken.has(p.key) && p.adp &&
    p.adp >= from && p.adp <= to && (!position || p.position === position);
  const found = board.players.filter(near);

  /**
   * The window widens rather than coming back empty, since late in a
   * draft a position can have nobody at all inside twenty picks.
   */
  const wider = found.length >= 2
    ? found
    : board.players.filter((p) =>
        p.key !== exclude && !taken.has(p.key) && p.adp && p.adp >= pick - 12 &&
        (!position || p.position === position));

  return wider
    .sort((a, b) => (b.perGameVor ?? 0) - (a.perGameVor ?? 0))
    .slice(0, howMany);
}

function bestLeftAt(pick, taken, exclude, position, byRanking) {
  const free = board.players.filter((p) =>
    p.key !== exclude && !taken.has(p.key) && (!position || p.position === position));

  if (byRanking) {
    // Our own order instead of the market's: sort everyone by what the
    // model says they are worth, and whoever lands on this pick is who
    // we think is there. Where the two disagree the room is the one
    // setting the price, so this is the second opinion, not the answer.
    const ours = board.players.filter((p) => !taken.has(p.key))
      .sort((a, b) => b.vor - a.vor);
    const reachable = new Set(ours.slice(pick - 1).map((p) => p.key));
    const left = free.filter((p) => reachable.has(p.key));
    return left.length
      ? left.reduce((best, p) => (p.vor > best.vor ? p : best))
      : null;
  }

  // Anyone the market expects to last this long. Ordered by the blend
  // on the board, which mixes the room's view with the model's;
  // on its own the model had J.K. Dobbins as the best man at pick 30
  // on a draft position of 96, disagreeing with the room about sixty
  // five players.
  const left = free
    .filter((p) => p.adp && p.adp >= pick)
    .sort((a, b) => (a.blend ?? a.adp) - (b.blend ?? b.adp))
    .slice(0, 12);

  return left.length
    ? left.reduce((best, p) => (p.vor > best.vor ? p : best))
    : null;
}

/**
 * What a keeper costs you, as an overall pick.
 *
 * Most men cost the round the league wrote down. A second straight year
 * costs market price instead, which is wherever he is going in drafts,
 * so keeping him for a third round pick when the room takes him in the
 * third is worth nothing at all.
 */
function costOf(entry, player, teams = 12) {
  // what you typed beats the sheet, which is often out of date
  const yours = keeperCosts()[entry.key];

  if (yours) {
    return yours;
  }

  if (!entry.marketPriced) {
    return entry.cost;
  }

  const goesAt = adpOverrides()[entry.key] ?? (player ? player.adp : null);

  return goesAt ? Math.max(1, Math.ceil(goesAt / teams)) : entry.cost;
}

/**
 * Where you have seen a man going, when that beats our board.
 *
 * Our draft positions come from public mock drafts and the league
 * drafts on Sleeper, whose own number is a little different and is the
 * one the room will follow. It only changes anything for a man kept a
 * second year running, since his price is wherever he goes, so it is
 * worth typing in for those few rather than chasing the whole board.
 */
function adpOverrides() {
  return store_get("adpAt." + (active ? active.leagueId : "none"), {});
}

function saveAdpAt(key, pick) {
  const all = adpOverrides();
  if (pick) all[key] = pick;
  else delete all[key];
  store_set("adpAt." + (active ? active.leagueId : "none"), all);
}

/**
 * How much better or worse he is than what the pick would buy.
 *
 * A verdict on half a point a game is false precision from a model
 * whose typical weekly miss is nearly four, so anything inside a point
 * is called level rather than decided. The pool also thins to guesswork
 * past the tenth round, where only a couple of hundred players carry a
 * draft position at all, so a late alternative is a flier.
 */
/** how many the shortlist shows before the full rankings take over */
const MOST_SHOWN = 24;
const CLOSE_ENOUGH = 1;
/**
 * Near enough to level over a season, in points. Half a point a game
 * across the sixteen a fantasy season runs, which is inside what any
 * projection can tell apart.
 */
const CLOSE_SEASON = 8;

/**
 * The overall pick a round costs you.
 *
 * A snake turns the order around every other round, so the third seat
 * picks third in the first round and tenth in the second. Using the
 * middle of the round instead was off by up to half a round, which
 * matters most at the top where the board moves fastest.
 */
/**
 * Where you sit in the order.
 *
 * Sleeper only fills in the draft order once the commissioner sets
 * it, so before that the league object has nothing and the pick grid
 * is the only thing that knows. Without this a keeper was priced
 * against the middle of the round instead of your own seat.
 */
function mySlot() {
  const saved = store_get("draftState", null);

  return (active && active.draftSlot) ||
    (draftState && draftState.grid && draftState.grid.mySlot) ||
    (saved && saved.grid && saved.grid.mySlot) ||
    null;
}

function pickForRound(round, teams, slot, snake) {
  if (!slot) {
    return (round - 1) * teams + Math.ceil(teams / 2);
  }

  const inRound = snake && round % 2 === 0 ? teams - slot + 1 : slot;

  return (round - 1) * teams + inRound;
}

/**
 * What a pick normally buys, from the board's own value by adp.
 *
 * A three point surplus in the tenth round, where a pick buys almost
 * nothing, is a far better trade than three points in the second. The
 * curve is a rolling middle of vor over the men adp has priced, so
 * return on a keep can be read as his value over the going rate at
 * his cost.
 */
/** whether a man belongs under the filter that is on */
function matchesFilter(p) {
  if (posFilter === "ALL") {
    return true;
  }

  if (posFilter === "FLEX") {
    return ["RB", "WR", "TE"].includes(p.position);
  }

  if (posFilter === "ROOKIES") {
    return Boolean(p.rookie);
  }

  return p.position === posFilter;
}

function worthAtPick(pick) {
  const men = board && board.players ? board.players : [];
  const priced = men.filter((p) => p.adp).sort((a, b) => a.adp - b.adp);

  if (!priced.length) {
    return 0;
  }

  const around = priced.filter((p) => Math.abs(p.adp - pick) <= 12)
    .map((p) => p.vor);

  if (!around.length) {
    return Math.max(0, priced[priced.length - 1].vor);
  }

  /**
   * The mean, because it is compared against a man's own expected
   * value. Taking the middle of this pool and calling it the going
   * rate flattered every keeper: the pool runs long to the right, so
   * its middle is well under its average, and the gap to it was
   * counted as profit.
   */
  return around.reduce((sum, v) => sum + v, 0) / around.length;
}

/**
 * The waiting branch: what letting him go is worth, which is the
 * chance he is still there at your first realistic pick times his
 * surplus over that pick's going rate. His adp spread says the
 * chance: certainly there before his early end, certainly gone past
 * his late end, sliding in between.
 */
function redraftWorth(player, teams, taken) {
  if (!player.adp) {
    return { chance: 0, gain: 0, atPick: null };
  }

  const early = player.adpHigh || player.adp;
  const late = player.adpLow || player.adp;
  const slot = mySlot();
  const snake = !active || active.snake;

  for (let round = 1; round <= 16; round++) {
    // only the picks still yours: a traded round cannot draft anybody
    if (active && active.myPicks && !active.myPicks.includes(round)) {
      continue;
    }

    const pick = pickForRound(round, teams, slot, snake);

    if (pick < early - 2) {
      continue;
    }

    const chance = pick <= early ? 1
      : pick >= late ? 0.05
      : 1 - (pick - early) / Math.max(1, late - early);
    // measured against the same thing the rest of the card measures
    // against: the best man our board says is still there
    const best = taken
      ? bestLeftAt(pick, taken, player.key, null, false)
      : null;
    const rate = taken
      ? expectedBestAt(pick, taken, player.key, null, player.position)
      : worthAtPick(pick);
    const gain = Math.max(0, player.vor - rate);

    return { chance, gain: chance * gain, atPick: pick, round };
  }

  return { chance: 0, gain: 0, atPick: null };
}

function marginAt(player, round, teams, taken) {
  const pick = pickForRound(
    round, teams, mySlot(), !active || active.snake,
  );
  /**
   * The best man there, whatever he plays.
   *
   * Spending a second round pick on a quarterback costs you a running
   * back, not another quarterback, so comparing him with the next
   * quarterback said every one was worth a second. Value over the last
   * starter at each position is what makes the two comparable.
   */
  const instead = bestLeftAt(pick, taken, player.key, null, false);
  /**
   * His good week measured against the man who would start at his
   * position anyway, the same baseline the expectation uses. Comparing
   * raw ceilings across positions had a quarterback beating a tight end
   * by nine, which says nothing except that quarterbacks score more.
   */
  const overReplacement = (p) => {
    const high = (p.game ? p.game.high : p.ppg) ?? p.ppg;
    // a game, so the replacement's own per game number is the baseline
    return high - (p.ppg - (p.perGameVor ?? 0));
  };

  const ourInstead = bestLeftAt(pick, taken, player.key, null, true);

  return {
    instead,
    // a game, which is what the card shows and what the words say
    margin: instead
      ? (player.perGameVor ?? 0) - (instead.perGameVor ?? 0)
      : player.perGameVor ?? 0,
    // the same sum against the man our own order says is there, which
    // is worth seeing when it disagrees with the room
    ourInstead,
    ourMargin: ourInstead
      ? (player.perGameVor ?? 0) - (ourInstead.perGameVor ?? 0)
      : player.perGameVor ?? 0,
    upside: instead
      ? overReplacement(player) - overReplacement(instead)
      : overReplacement(player),
    thin: pick > 130,
  };
}

/** the earliest round he is not clearly worse than the alternative */
/**
 * The earliest round where keeping him still beats using the pick.
 *
 * Measured the same way the card is: what he is worth over a season
 * against what that pick is likely to buy. It used to compare a per
 * game margin with a season's threshold, which nothing could fail, so
 * every man came out worth a first or a second.
 */
function worthUpTo(player, teams, taken) {
  for (let round = 1; round <= 15; round++) {
    const pick = pickForRound(round, teams, mySlot(), !active || active.snake);
    const margin = (player.vor ?? 0) -
      expectedBestAt(pick, taken, player.key, null, player.position);

    if (margin > -CLOSE_SEASON) {
      return { round, margin, instead: bestLeftAt(pick, taken, player.key, null, false) };
    }
  }

  return { round: 16, instead: null, margin: 0, thin: true };
}

let keeperSheet;

/** the league's own keeper list, shipped with the board */
async function loadKeeperSheet() {
  if (keeperSheet !== undefined) {
    return keeperSheet;
  }

  keeperSheet = await fetch(
    "data/keepers-" + meta.boardSeason + ".json" + (window.__bust ?? ""),
  ).then((r) => (r.ok ? r.json() : null)).catch(() => null);

  return keeperSheet;
}

/**
 * Which sheet team is whose.
 *
 * The sheet comes from the league's own paperwork and labels teams the
 * way the commissioner does, which is not what anybody calls themselves
 * in Sleeper. Matching on the players gets around that: a team's
 * eligible list overlaps its own roster and almost nobody else's, and
 * it keeps working when somebody renames their team.
 */
function ownerPerSheetTeam(sheet) {
  const byTeam = new Map();

  for (const team of new Set(sheet.entries.map((e) => e.team))) {
    const keys = new Set(
      sheet.entries.filter((e) => e.team === team).map((e) => e.key),
    );
    let best = null;
    let bestHits = 0;

    for (const roster of active.allRosters ?? []) {
      const hits = (roster.keys ?? []).filter((r) => keys.has(r.key)).length;

      if (hits > bestHits) {
        bestHits = hits;
        best = roster.owner;
      }
    }

    if (best) {
      byTeam.set(team, best);
    }
  }

  return byTeam;
}

/**
 * What each team may keep, from the sheet, as owner to entries.
 *
 * Anyone missing from a team's list was picked up after the deadline
 * and cannot be kept at all, so the sheet is the whole eligible set
 * rather than a set of prices laid over the current roster.
 */
function eligiblePerOwner(sheet) {
  const owners = ownerPerSheetTeam(sheet);
  const byOwner = new Map();

  for (const entry of sheet.entries) {
    const owner = owners.get(entry.team);

    if (!owner) {
      continue;
    }

    if (!byOwner.has(owner)) {
      byOwner.set(owner, []);
    }

    byOwner.get(owner).push(entry);
  }

  return byOwner;
}

/**
 * Who the other teams will hold on to.
 *
 * Their costs are not in here, but the main effect does not need them:
 * a team keeps its best players, so the men at the top of every roster
 * come off the board before the draft starts. That changes who is left
 * at your own pick, which is the whole basis for what your keepers are
 * worth.
 *
 * The count comes from the keepers-per-team box, so it can be set to
 * whatever the league allows.
 */
function likelyKept(perTeam, eligible) {
  const gone = new Set();

  for (const roster of active.allRosters ?? []) {
    if (roster.owner === active.team) continue;

    // it cannot keep more men than it has picks left to pay with
    const canAfford = Math.min(perTeam, (roster.picks ?? []).length);
    const listed = eligible ? eligible.get(roster.owner) : null;

    if (listed) {
      // it pays a named round for each, so it cannot take two men who
      // cost the same one, and it cannot take anyone it traded the
      // pick for
      const spent = new Set();

      for (const entry of listed
        .map((e) => ({
          ...e,
          player: boardLookup(e.key),
          // a price you corrected counts for their team too
          round: keeperCosts()[e.key] ?? e.cost,
        }))
        .filter((e) => e.player)
        .sort((a, b) => b.player.vor - a.player.vor)) {
        if (spent.size >= canAfford) break;
        if (spent.has(entry.round)) continue;
        if ((roster.picks ?? []).length && !roster.picks.includes(entry.round)) continue;

        spent.add(entry.round);
        gone.add(entry.key);
      }

      continue;
    }

    const rated = (roster.keys ?? [])
      .map((r) => boardLookup(r.key))
      .filter(Boolean)
      .sort((a, b) => b.vor - a.vor)
      .slice(0, canAfford);

    for (const p of rated) gone.add(p.key);
  }

  return gone;
}


/**
 * What this league pays for the things a player does.
 *
 * The board ships what the walk says a man does in a game and leaves
 * the scoring to whoever reads it, so one board serves every league.
 * Sleeper spells the categories its own way; these are the ones that
 * decide a skill player's afternoon.
 */
const PAYS = {
  passYds: "pass_yd", passTd: "pass_td", interceptions: "int",
  rushYds: "rush_yd", rushTd: "rush_td",
  receptions: "rec", recYds: "rec_yd", recTd: "rec_td",
  fumblesLost: "fum_lost",
};

const STANDARD_PAY = {
  pass_yd: 0.04, pass_td: 4, int: -2, rush_yd: 0.1, rush_td: 6,
  rec: 0, rec_yd: 0.1, rec_td: 6, fum_lost: -2,
};

function leaguePay() {
  return (active && active.scoring) ? active.scoring : STANDARD_PAY;
}

/** a game of his, scored by what this league pays */
/**
 * A kicker and a defence are paid by their own categories, and the
 * board keeps those parts under the names the league already uses:
 * a field goal by how far it went, a defence by what it did and by
 * how often it held a side to each bracket.
 */
const THEIR_OWN = [
  "fgmYds", "xpm", "xpmiss", "fgm_0_19", "fgm_20_29", "fgm_30_39",
  "fgm_40_49", "fgm_50_59", "fgm_60p", "fgmiss_0_19", "fgmiss_20_29",
  "fgmiss_30_39", "fgmiss_40_49", "fgmiss_50_59", "fgmiss_60p",
  "sack", "int", "fum_rec", "def_td", "safe", "blk_kick",
  "pts_allow_0", "pts_allow_1_6", "pts_allow_7_13", "pts_allow_14_20",
  "pts_allow_21_27", "pts_allow_28_34", "pts_allow_35p",
];

/** what the same categories pay where a league has not said */
const THEIR_OWN_PAY = {
  fgmYds: 0.1, xpm: 1, xpmiss: -1,
  fgm_0_19: 0, fgm_20_29: 0, fgm_30_39: 0, fgm_40_49: 0, fgm_50_59: 0,
  fgm_60p: 0,
  fgmiss_0_19: -3, fgmiss_20_29: -2, fgmiss_30_39: -2, fgmiss_40_49: -1,
  fgmiss_50_59: -1, fgmiss_60p: 0,
  sack: 1, int: 2, fum_rec: 2, def_td: 6, safe: 2, blk_kick: 2,
  pts_allow_0: 10, pts_allow_1_6: 7, pts_allow_7_13: 4, pts_allow_14_20: 1,
  pts_allow_21_27: 0, pts_allow_28_34: -1, pts_allow_35p: -4,
};

function payFor(made) {
  const pays = leaguePay();
  let points = 0;

  for (const [part, category] of Object.entries(PAYS)) {
    points += (made[part] ?? 0) * (pays[category] ?? STANDARD_PAY[category] ?? 0);
  }

  for (const part of THEIR_OWN) {
    if (made[part] !== undefined) {
      points += made[part] *
        (pays[part] ?? THEIR_OWN_PAY[part] ?? 0);
    }
  }

  return points;
}

/**
 * What he scores in a game here.
 *
 * The regression's own projection, scored by this league. The spread
 * of his weeks on the card was worked out around that projection, so
 * taking the walk's number instead would leave the two describing
 * different players. The walk still votes on the order.
 */
function scoredHere(p) {
  if (p.modelMade) {
    return payFor(p.modelMade);
  }

  return p.made ? payFor(p.made) : p.ppg;
}

/**
 * How many of each position the league starts, flex included.
 *
 * What a man is worth is the gap to the last starter at his position,
 * so a league starting three receivers values them differently from
 * one starting two. A flex is shared out among the positions that can
 * fill it, which is how many of each actually get started.
 */
function startedHere() {
  const teams = (active && active.size) || 12;
  const slots = (active && active.slots) || [
    "QB", "RB", "RB", "WR", "WR", "TE", "FLEX",
  ];
  const started = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DEF: 0 };
  const FLEX_SPLIT = { RB: 0.45, WR: 0.4, TE: 0.15 };

  for (const slot of slots) {
    if (started[slot] !== undefined) {
      started[slot]++;
      continue;
    }

    if (slot === "FLEX" || slot === "WRRB_FLEX" || slot === "REC_FLEX") {
      for (const [where, part] of Object.entries(FLEX_SPLIT)) {
        started[where] += part;
      }
    }

    if (slot === "SUPER_FLEX") {
      // nearly every team starts a second quarterback where it can
      started.QB += 0.9;
      started.RB += 0.05;
      started.WR += 0.05;
    }
  }

  const out = {};

  for (const [where, n] of Object.entries(started)) {
    out[where] = Math.max(1, Math.round(n * teams));
  }

  return out;
}

/**
 * The board in this league's terms.
 *
 * Every player is scored by the league's own rules, valued against the
 * last man it would start at his position, and the four opinions are
 * put back in order. Nothing here needs the model to have been run for
 * the league, since the parts travel with the board.
 */
function rescoreBoard() {
  if (!board || !board.players.length) {
    return;
  }

  /**
   * Which mock drafts to read.
   *
   * A point a catch moves receivers up the order, so a ppr league
   * reading standard mocks is reading the wrong room. Both sets ship
   * with the board and the league picks.
   */
  const perCatch = leaguePay().rec ?? 0;
  const room = perCatch >= 0.75 ? "ppr" : perCatch >= 0.25 ? "half" : "standard";

  for (const p of board.players) {
    if (p.adpBy && p.adpBy[room]) {
      p.adp = p.adpBy[room].adp;
      p.adpLow = p.adpBy[room].low;
      p.adpHigh = p.adpBy[room].high;
    }

    /**
     * What the file said, kept aside the first time through.
     *
     * The spread of his weeks and his season total were worked out
     * under whatever the build was told to score, so they move with
     * him when the league pays differently. Rescoring twice must not
     * compound, so everything is scaled from the file's numbers
     * rather than from the last pass.
     */
    if (!p.asBuilt) {
      p.asBuilt = {
        ppg: p.ppg, game: p.game, sim: p.sim, weeks: p.weeks,
      };
    }

    const was = p.asBuilt;
    p.ppg = Number(scoredHere(p).toFixed(1));
    p.modelPpg = p.modelMade ? payFor(p.modelMade) : p.ppg;

    const moved = was.ppg > 0 ? p.ppg / was.ppg : 1;

    if (was.game) {
      p.game = Object.fromEntries(Object.entries(was.game)
        .map(([at, n]) => [at, Number((n * moved).toFixed(1))]));
    }

    if (was.sim) {
      p.sim = Object.fromEntries(Object.entries(was.sim)
        .map(([at, n]) => [at, at === "games" ? n : Math.round(n * moved)]));
    }

    if (was.weeks) {
      p.weeks = was.weeks.map((w) => ({
        ...w, pts: Number((w.pts * moved).toFixed(1)),
      }));
    }
  }

  /**
   * What the last man the league would start at each position scores.
   *
   * This is where the lineup enters: a league starting two
   * quarterbacks has a far better one left over than a league starting
   * one, so the gap to him is smaller and every quarterback is worth
   * less against it.
   */
  const started = startedHere();
  const lastStarter = (of) => {
    const bar = {};

    for (const where of ["QB", "RB", "WR", "TE", "K", "DEF"]) {
      const ranked = board.players
        .filter((p) => p.position === where)
        .map(of)
        .filter((v) => v !== null && v !== undefined)
        .sort((a, b) => b - a);
      bar[where] = ranked[Math.min(ranked.length - 1, started[where])] ?? 0;
    }

    return bar;
  };

  const bar = lastStarter((p) => p.ppg);
  const modelBar = lastStarter((p) => p.modelPpg);

  /**
   * What he adds over a season, not over a game.
   *
   * A man who misses four weeks gives you thirteen weeks of the gap
   * to a replacement and nothing for the other four, since you start
   * somebody else those weeks. Per game alone, a fragile player and a
   * durable one with the same average look identical, which is how a
   * back who plays eight games can price like one who plays sixteen.
   */
  for (const p of board.players) {
    const plays = p.sim && p.sim.games ? p.sim.games : 17;
    p.perGameVor = Number((p.ppg - (bar[p.position] ?? 0)).toFixed(1));
    p.vor = Number((plays * (p.ppg - (bar[p.position] ?? 0))).toFixed(1));
    p.modelVor = plays * (p.modelPpg - (modelBar[p.position] ?? 0));
  }

  /**
   * The men the four opinions rank against each other. Kickers and
   * defences stay out: they are ordered among themselves and placed
   * where the room drafts them, and leaving them in moved a receiver
   * by a place or two for no reason anybody could explain.
   */
  const ownOrder = new Set(["K", "DEF"]);
  const onTheCurve = board.players.filter((p) => !ownOrder.has(p.position));

  const placesBy = (by) => {
    const ranked = onTheCurve
      .map((p, i) => ({ i, v: by(p) }))
      .filter((r) => r.v !== null && r.v !== undefined)
      .sort((a, b) => b.v - a.v);
    const at = new Map();
    ranked.forEach((r, k) => at.set(r.i, k + 1));

    return at;
  };

  // the model votes on value over replacement, so the lineup the
  // league starts reaches the order and not only the cards
  const modelAt = placesBy((p) => p.modelVor);
  const shareAt = placesBy((p) => p.touches);
  const adpAt = placesBy((p) => (p.adp === null || p.adp === undefined ? null : -p.adp));
  /**
   * The played out games say nothing about a rookie, and saying
   * nothing is not the same as saying nothing much. The walk gave
   * Jeremiyah Love a third of a point a game, which is what a man
   * with no plays to draw from comes out at, and that vote dragged
   * every rookie to the bottom of the board. It keeps quiet on them
   * and its weight goes to the opinions that have something to say.
   */
  const walkAt = placesBy((p) =>
    p.made && !p.rookie ? payFor(p.made) - (bar[p.position] ?? 0) : null);
  // the same weights the board is built with, quarterbacks apart
  const LEAN = { model: 0.106, share: 0.319, adp: 0.425, walk: 0.15 };
  const QB_LEAN = { model: 0.03, share: 0, adp: 0.12, walk: 0.85 };

  /**
   * Kickers and defences are ours to order and the room's to place.
   *
   * We order them better than the room does: giving a kicker the
   * attempts his side's drives produce beats his draft position .38
   * to .20 over three seasons. Where the group belongs is another
   * question, and value over replacement answers it badly for these
   * two, since both are replaced off the waiver wire in a week and
   * the gap between the best and the twelfth is under a point a game.
   * So the group takes the picks the room spends on it, and we say
   * which of them to take first.
   */
  const placeIn = new Map();

  for (const where of ownOrder) {
    const its = board.players.filter((p) => p.position === where);
    const picks = its
      .map((p) => p.adp)
      .filter((adp) => adp)
      .sort((a, b) => a - b);
    its
      .sort((a, b) => (b.vor ?? 0) - (a.vor ?? 0))
      .forEach((p, i) => {
        placeIn.set(p.key, picks[i] ?? (picks[picks.length - 1] ?? 300) + i);
      });
  }

  /**
   * Kickers stand against each other, not against the field.
   *
   * Blending a kicker with the rest put an undrafted one above a
   * better one who had a draft position, since adp carries most of the
   * weight and a kicker's is late by definition. They are ordered by
   * what the walk gives them and placed where the room takes kickers.
   */
  const atIndex = new Map(onTheCurve.map((p, i) => [p.key, i]));

  board.players.forEach((p) => {
    if (ownOrder.has(p.position)) {
      p.blend = placeIn.get(p.key) ?? 400;
      return;
    }

    const i = atIndex.get(p.key);

    const lean = p.position === "QB" ? QB_LEAN : LEAN;
    const parts = [
      [lean.model, modelAt.get(i)],
      [lean.share, shareAt.get(i)],
      [lean.adp, adpAt.get(i)],
      [lean.walk, walkAt.get(i)],
    ].filter(([w, place]) => w > 0 && place !== undefined);
    const weight = parts.reduce((sum, [w]) => sum + w, 0);
    p.blend = weight > 0
      ? parts.reduce((sum, [w, place]) => sum + w * place, 0) / weight
      : board.players.length;
  });

  board.players.sort((a, b) => a.blend - b.blend);
  // where we have him, which is what the cards compare against adp
  board.players.forEach((p, i) => { p.rank = i + 1; });

  /**
   * Where the room takes him, as a place rather than an average.
   *
   * Writing an average as a round and a pick left 1.02 empty and put
   * two men on 1.05, since nobody averages between 1.5 and 2.4.
   * Ordering by adp and reading off the place gives one man a slot,
   * the same way our own order does, so the two can be set side by
   * side. The average itself stays on the card, since it says how
   * strongly the room agrees with itself.
   */
  [...board.players]
    .filter((p) => p.adp)
    .sort((a, b) => a.adp - b.adp)
    .forEach((p, i) => { p.adpRank = i + 1; });

  /**
   * What our own order says he is worth.
   *
   * The board is ordered by four opinions together while value over
   * replacement comes from the projection alone, so the two could say
   * different things about the same man: we had Jaylen Warren
   * thirty first and then priced him below what a third round pick
   * buys. Reading the value curve in board order settles it, and every
   * number on a card then agrees with where the board has him.
   */
  /**
   * Read in board order, which means after the sort. Taking the list
   * before it handed the best value to whoever happened to be first in
   * the file, so Jonathan Taylor was shown as worth more than Bijan
   * Robinson while the board had Bijan ahead of him.
   */
  const inOrder = board.players.filter((p) => !ownOrder.has(p.position));
  const curve = inOrder
    .map((p) => p.vor ?? 0)
    .sort((a, b) => b - a);
  inOrder.forEach((p, i) => {
    p.modelVorOwn = p.vor;
    p.vor = Number((curve[i] ?? 0).toFixed(1));
  });
  boardByKey = new Map(board.players.map((p) => [p.key, p]));
}

function keeperCosts() {
  return store_get("keeperCost." + (active ? active.leagueId : "none"), {});
}

function saveKeeperCost(key, round) {
  const all = keeperCosts();
  if (round) all[key] = round;
  else delete all[key];
  store_set("keeperCost." + (active ? active.leagueId : "none"), all);
}


/**
 * Men worth more than him who the room takes after the pick he costs.
 *
 * If somebody better is still on the board when your keeper pick comes
 * round, keeping is beaten outright: pay the pick for the better man
 * and you have both the player and the surplus. His own position
 * counts double here, since that is the swap that needs no thought.
 */
function betterLater(p, costPick, taken) {
  if (!board || !board.players || !costPick) {
    return [];
  }

  return board.players
    .filter((o) =>
      o.key !== p.key && !taken.has(o.key) && o.adp &&
      // his own position, since that is the swap being weighed
      o.position === p.position &&
      (o.vor ?? 0) - (p.vor ?? 0) > CLOSE_SEASON &&
      stillThereAt(o, costPick) >= 0.25)
    .map((o) => ({
      who: o,
      odds: stillThereAt(o, costPick),
      better: (o.vor ?? 0) - (p.vor ?? 0),
      // how much better he is, weighed by how often he is there to take
      gain: stillThereAt(o, costPick) * ((o.vor ?? 0) - (p.vor ?? 0)),
    }))
    .sort((a, b) => b.gain - a.gain)
    .slice(0, 3);
}

/**
 * What the best man still on the board at a pick is worth, on average.
 *
 * Taking the best name near a pick assumes he lasts, and taking the
 * middle of everyone assumes you draft at random. Neither is what
 * happens. Each candidate is weighted by the chance he is there and
 * that everyone better is already gone, which is exactly the man you
 * would end up taking.
 */
function expectedBestAt(pick, taken, exclude, showing, position) {
  if (!board || !board.players) {
    return 0;
  }

  const candidates = board.players
    .filter((o) => o.key !== exclude && !taken.has(o.key) && o.adp &&
      o.adp >= pick - 12 && (!position || o.position === position))
    .sort((a, b) => (b.vor ?? 0) - (a.vor ?? 0))
    .slice(0, 40);
  let stillGone = 1;
  let worth = 0;

  for (const o of candidates) {
    const there = stillThereAt(o, pick);
    // the chance he is the one you end up taking: he lasts, and
    // everyone better than him has gone
    const takesHim = there * stillGone;
    worth += (o.vor ?? 0) * takesHim;

    if (showing && takesHim > 0.02) {
      showing.push({ who: o, odds: takesHim });
    }

    stillGone *= 1 - there;

    if (stillGone < 0.01) {
      break;
    }
  }

  // and the tail, where every one of them has gone
  return worth + (candidates.length
    ? (candidates[candidates.length - 1].vor ?? 0) * stillGone
    : 0);
}

/** the keep as one sum, which both the chip and the figures read */
function keeperSums(p, costPick, teams, taken) {
  /**
   * What the pick buys: the best few men our board says are still on
   * it, averaged. Taking only the very best held every keeper against
   * the model's boldest call at that pick, which is also its least
   * certain; taking the middle of everyone going near it held him
   * against a player nobody would choose.
   */
  /**
   * What the pick buys at his own position, which is the swap you are
   * actually making: keeping a back means drafting one fewer back.
   * The other positions are on the card to be looked at, not to decide
   * it.
   */
  const best = bestLeftAt(costPick, taken, p.key, p.position, false);
  const makesItUp = [];
  const rate = expectedBestAt(costPick, taken, p.key, makesItUp, p.position);
  const roi = p.vor - rate;
  const wait = redraftWorth(p, teams, taken);

  return {
    best, rate, roi, wait, net: roi - wait.gain,
    makesItUp: makesItUp.sort((a, b) => b.odds - a.odds).slice(0, 4),
  };
}

/** the keep as figures: what he is worth, what the pick buys, the balance */
function keeperFigures(p, cost, costPick, teams, taken) {
  /**
   * What the pick actually buys: the best man our board says is still
   * on it, since that is who you would take. The middle of the players
   * going near a pick is what you get by accident, not by choosing.
   */
  const {
    best, rate, roi, wait, net, makesItUp,
  } = keeperSums(p, costPick, teams, taken);
  const box = document.createElement("div");
  box.className = "figures";
  const cell = (label, value, how, tip) =>
    '<span class="fig ' + (how ?? "") + '"' +
    (tip ? ' title="' + tip + '"' : "") + "><i>" + label + "</i>" +
    (value > 0 && how ? "+" : "") + value.toFixed(0) + "</span>";
  box.innerHTML =
    cell("he is worth", p.vor, "",
      "what his place on our board is worth over a season, above the last " +
      "man this league starts at his position") +
    cell(asRound(costPick) + " buys", rate, "",
      "what the best man still on the board is worth there, with every " +
      "candidate weighed by how often he lasts that long" +
      (best ? ". Today that is usually " + best.name : "")) +
    cell("keeping gains", roi, roi >= 0 ? "up" : "down",
      "his value less what that pick would have bought instead") +
    (wait.atPick && wait.chance > 0.1 && wait.chance < 0.98
      ? cell(
          "waiting gains", wait.gain, "",
          "let him go and he is still on the board at your " +
          asRound(wait.atPick) + " pick " + Math.round(100 * wait.chance) +
          "% of the time, so you might have him and the pick both",
        )
      : "") +
    cell("worth keeping", net, net >= 0 ? "up" : "down",
      "what keeping gains, less what waiting for him would have gained. " +
      "Above zero, keep him");

  if (makesItUp.length) {
    const who = document.createElement("div");
    who.className = "madeof";
    who.innerHTML = "<i>" + asRound(costPick) + " lands on</i> " +
      makesItUp.map((o) =>
        o.who.name + " <b>" + Math.round(100 * o.odds) + "%</b>").join(", ");
    box.appendChild(who);
  }

  return box;
}

/**
 * Who else that pick could buy, and how they compare.
 *
 * Two lists: the men at his own position, which is the swap a drafter
 * pictures, and the best of anybody, since a pick spent on him is a
 * pick not spent on a tight end either. Both compare on value over
 * the last man the league would start at that position, which is the
 * only way a quarterback and a receiver can be put side by side.
 */
function instead(p, costPick, taken) {
  const box = document.createElement("div");
  box.className = "instead";
  const his = (o) => (o.vor ?? 0) - (p.vor ?? 0);
  const stillThere = (o) => stillThereAt(o, costPick);
  const table = (title, men) => {
    if (!men.length) {
      return '<div class="hint">nobody ' + title + "</div>";
    }

    return '<div class="scroll"><table class="ranks">' +
      "<thead><tr><th>" + title + "</th><th>adp</th>" +
      '<th title="how often he is still on the board at this pick">there</th>' +
      '<th title="fantasy points in a typical game">pts/g</th>' +
      '<th title="what a man in his place on our board is worth over a ' +
        "season, above the last one this league starts at his position. " +
        'Positions only compare this way">vor</th>' +
      '<th title="his value less the keeper\'s, over a season">vs him</th>' +
      "</tr></thead><tbody>" +
      men.map((o) => {
        const gap = his(o);
        const odds = stillThere(o);

        const howLikely = odds >= 0.7 ? "up" : odds >= 0.3 ? "" : "down";

        return "<tr><td>" +
          o.name + ' <span class="pos">' + o.position + "</span></td>" +
          '<td class="n">' + asRound(o.adpRank ?? o.adp) + "</td>" +
          '<td class="n ' + howLikely + '">' + Math.round(100 * odds) + "%</td>" +
          '<td class="n">' + (o.ppg ?? 0).toFixed(1) + "</td>" +
          '<td class="n">' + (o.vor ?? 0).toFixed(0) + "</td>" +
          '<td class="n ' + (gap > 0 ? "down" : "up") + '">' +
          (gap > 0 ? "+" : "") + gap.toFixed(0) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  };
  const samePosition = optionsAt(costPick, taken, p.key, p.position, 5);
  const anybody = optionsAt(costPick, taken, p.key, null, 10)
    .filter((o) => o.position !== p.position)
    .slice(0, 3);

  box.innerHTML =
    table("other " + p.position + "s near " + asRound(costPick), samePosition) +
    (anybody.length
      ? '<div class="alsoat">' + table("anyone else there", anybody) + "</div>"
      : "");

  return box;
}

/** what the league charges for him, which you can correct */
function costRow(p, cost, listed, atMarket) {
  const row = document.createElement("label");
  row.className = "costrow";
  const market = listed && atMarket.has(p.key);

  if (market) {
    const goesAt = adpOverrides()[p.key] ?? p.adp ?? "";
    row.innerHTML = "<i>market price, goes at</i>" +
      '<input type="number" min="1" max="200" value="' +
      (goesAt ? Math.round(goesAt) : "") + '" placeholder="?">' +
      "<b>" + ordinal(cost) + " rd</b>";
    row.querySelector("input").addEventListener("change", (e) => {
      saveAdpAt(p.key, Number(e.target.value));
      renderKeepers();
    });

    return row;
  }

  const yours = keeperCosts()[p.key];
  row.innerHTML = "<i>costs</i>" +
    '<input type="number" min="1" max="15" value="' + (cost || "") +
    '" placeholder="?"><b>rd</b>' +
    (yours ? '<span class="chip up">yours</span>' : "");
  row.querySelector("input").addEventListener("change", (e) => {
    saveKeeperCost(p.key, Number(e.target.value));
    renderKeepers();
  });

  return row;
}

let keeperDraw = 0;

async function renderKeepers() {
  const drawing = ++keeperDraw;
  if (!board) {
    board = await (await fetch("data/board-" + meta.boardSeason + ".json" + (window.__bust ?? ""))).json();
    boardByKey = new Map(board.players.map((p) => [p.key, p]));
    rescoreBoard();
  }

  const out = $("out");
  out.innerHTML = "";

  if (!active) {
    out.innerHTML = '<div class="empty"><b>No league selected.</b> Open <b>all leagues</b> and tap one.</div>';
    return;
  }

  const teams = active.size || 12;
  const perTeam = Number($("keepn").value) || 3;
  const sheet = await loadKeeperSheet();
  const eligible = sheet ? eligiblePerOwner(sheet) : null;
  const listed = eligible ? eligible.get(active.team) : null;
  // Your own marks, plus the men every other team is likely to keep.
  // Everyone else on a roster goes back into the draft, so treating a
  // whole roster as unavailable would empty the board.
  const taken = new Set([
    ...Object.keys(markedKeepers()), ...likelyKept(perTeam, eligible),
  ]);

  // The league's sheet decides both who you may keep and what he costs.
  // Anybody it leaves out was picked up too late in the season to be
  // kept, so his being on the roster today does not make him a choice.
  const costs = listed
    ? Object.fromEntries(listed.map((e) => [e.key, costOf(e, boardLookup(e.key), teams)]))
    : keeperCosts();
  const atMarket = new Set(
    (listed ?? []).filter((e) => e.marketPriced).map((e) => e.key),
  );
  const onRoster = (listed ?? active.myRoster)
    .map((r) => boardLookup(r.key)).filter(Boolean);

  /**
   * Which of them you actually keep.
   *
   * Each man is judged on his own, against the best player at his
   * position still on the board at the pick he costs, so what you do
   * with one does not change what another is worth. That leaves ranking
   * them by how far they beat their price and taking the best ones you
   * can pay for: two men who cost the same round cannot both be kept,
   * and neither can anyone whose round you traded away.
   */
  const slots = Number($("keepn").value) || 3;
  const spent = new Set();
  const keeping = [];

  for (const { p, cost, at } of onRoster
    .map((p) => {
      const cost = Number(costs[p.key]) || 0;
      return { p, cost, at: cost ? marginAt(p, cost, teams, taken) : null };
    })
    .filter((m) => m.at && m.at.margin > 0)
    .filter((m) => !active.myPicks || active.myPicks.includes(m.cost))
    .sort((a, b) => b.at.margin - a.at.margin)) {
    if (keeping.length >= slots) break;
    if (spent.has(cost)) continue;

    spent.add(cost);
    keeping.push(p.key);
  }

  const mine = onRoster
    .map((p) => ({
      p, keeping: keeping.includes(p.key), ...worthUpTo(p, teams, taken),
    }))
    .sort((a, b) => a.round - b.round);

  const head = document.createElement("div");
  head.className = "empty";
  head.innerHTML = "<b>What each man is worth keeping for.</b> Round shown is the " +
    "earliest pick he still beats." +
    (listed
      ? " Costs come from the league sheet, and anyone it leaves out was " +
        "picked up too late to keep."
      : " Type what your league charges and the card says whether to keep him.") +
    "<br>Assuming every other team keeps its " + perTeam +
    " best it can pay for, which takes " + taken.size + " players out of the draft." +
    (active.myPicks
      ? "<br>You pick " + (mySlot() ? ordinal(mySlot()) + " and " : "") +
        "have rounds " + active.myPicks.join(", ") + "."
      : "");
  if (drawing !== keeperDraw) {
    return;
  }

  out.appendChild(head);

  /**
   * The keep as a trade: his value against what the cost pick buys,
   * and against the chance of drafting him anyway.
   */
  function keepEconomics(p, cost, teams) {
    if (!cost || !p.vor) {
      return "";
    }

    const costPick = pickForRound(
      cost, teams, mySlot(), !active || active.snake,
    );
    const rate = worthAtPick(costPick);
    const roi = p.vor - rate;
    const wait = redraftWorth(p, teams, taken);
    const net = roi - wait.gain;
    let out = " &middot; the pick buys " + rate.toFixed(1) +
      " there, so keeping him is +" + roi.toFixed(1);

    if (wait.atPick && wait.chance > 0.1 && wait.chance < 0.98) {
      out += " &middot; about " + Math.round(100 * wait.chance) +
        "% he is still there at your " + ordinal(wait.round) +
        ", worth " + wait.gain.toFixed(1) + " to wait, net +" + net.toFixed(1);
    }

    return out;
  }

  const grid = document.createElement("div");
  grid.className = "cards wide";
  const seasonMax = seasonScale(mine.map((m) => m.p));

  for (const m of mine) {
    const { p, round } = m;
    const cost = Number(costs[p.key]) || 0;
    const costPick = cost
      ? pickForRound(
          cost, teams, mySlot(), !active || active.snake,
        )
      : null;
    const holdsIt = !cost || !active.myPicks || active.myPicks.includes(cost);
    // the chip says what the net says, so the card cannot argue with
    // itself the way it did when the two were worked out apart
    /**
     * Your own keepers are off the board as well. Weighing Henderson
     * against a pick that might buy Brock Purdy is wrong when Purdy is
     * one of the men you are keeping.
     */
    const mineToo = new Set([
      ...taken, ...keeping,
      // and everyone else you could keep: you either keep them or let
      // them go, so a pick cannot buy them either way
      ...(listed ?? []).map((e) => e.key),
    ]);
    mineToo.delete(p.key);
    const beaten = costPick ? betterLater(p, costPick, mineToo) : [];
    const sums = costPick ? keeperSums(p, costPick, teams, mineToo) : null;
    const call = !sums ? null
      : sums.net > CLOSE_SEASON ? { word: "keep", how: "up" }
      : sums.net < -CLOSE_SEASON ? { word: "let go", how: "down" }
      : { word: "close", how: "even" };

    const card = seasonCard(p, {
      max: seasonMax,
      aside: { label: "worth a", value: round, asRound: true },
      costs: cost || null,
      badge: call ? call.word : "",
      badgeHow: call ? call.how : "",
      tag: !holdsIt
        ? "you traded your " + ordinal(cost) + ", so you cannot keep him"
        : "",
      warn: !holdsIt,
    });

    card.appendChild(costRow(p, cost, listed, atMarket));

    if (costPick) {
      card.appendChild(keeperFigures(p, cost, costPick, teams, mineToo));

      if (beaten.length) {
        const worse = document.createElement("div");
        worse.className = "beaten";
        worse.innerHTML = '<i>better and likely there at ' +
          asRound(costPick) + "</i>" +
          beaten.map((o) =>
            '<span class="f"><b>' + o.who.name + "</b> +" +
            o.better.toFixed(0) + " &middot; " +
            Math.round(100 * o.odds) + "%</span>").join("");
        card.appendChild(worse);
      }

      card.appendChild(instead(p, costPick, mineToo));
    }
    grid.appendChild(card);
  }

  if (drawing === keeperDraw) {
    out.appendChild(grid);
  }
}

async function renderRoster() {
  if (!board) {
    board = await (await fetch("data/board-" + meta.boardSeason + ".json" + (window.__bust ?? ""))).json();
    boardByKey = new Map(board.players.map((p) => [p.key, p]));
    rescoreBoard();
  }

  const out = $("out");
  out.innerHTML = "";

  if (!active) {
    out.innerHTML = '<div class="empty"><b>No league selected.</b> Open <b>all leagues</b> and tap one.</div>';
    return;
  }

  const marked = markedKeepers();
  const mine = active.myRoster
    .map((r) => ({ r, p: boardLookup(r.key) }))
    .sort((a, b) => (b.p?.vor ?? -99) - (a.p?.vor ?? -99));
  const keeperCount = Object.keys(marked).filter((k) => marked[k] === active.team).length;

  const head = document.createElement("div");
  head.className = "empty";
  head.innerHTML = "<b>" + mine.length + " players</b> on " + active.team + " in " + active.name +
    (keeperCount ? ", " + keeperCount + " marked as keepers" : ", none marked as keepers yet");
  out.appendChild(head);

  const byPosition = new Map();

  for (const entry of mine) {
    const position = entry.p?.position ?? "other";
    byPosition.set(position, [...(byPosition.get(position) ?? []), entry]);
  }

  const seasonMax = seasonScale(
    [...byPosition.values()].flat().map((x) => x.p).filter(Boolean),
  );

  for (const position of [...POSITIONS, "other"]) {
    const rows = byPosition.get(position);
    if (!rows) continue;
    const h = document.createElement("h2");
    h.textContent = position;
    out.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "cards";

    for (const { r, p } of rows) {
      if (!p) {
        const div = document.createElement("div");
        div.className = "card plain";
        // he is on last season's roster and nobody has signed him for
        // this one, which is worth saying rather than leaving blank
        div.innerHTML = '<div class="nm"><span class="who">' + r.name +
          '</span></div><div class="sub"><span>no club for ' +
          meta.boardSeason + ", so no projection</span></div>";
        grid.appendChild(div);
        continue;
      }

      const isKept = !!marked[p.key];
      grid.appendChild(seasonCard(p, {
        max: seasonMax,
        kept: isKept,
        badge: isKept ? "keeper" : "",
        tag: isKept ? "counts against your " + $("keepn").value + " keeper slots" : "",
        keeper: { on: isKept, key: p.key },
      }));
    }

    out.appendChild(grid);
  }
}

async function renderStart() {
  if (!meta.weeks.length) return seasonNotStarted();
  const slate = await slateFor($("week").value);
  const mine = myKeys();
  const out = $("out");
  out.innerHTML = "";
  const max = Math.max(...slate.players.map((p) => p.ceiling));
  const starts = [];

  if (mine.size === 0) {
    out.innerHTML = '<div class="empty"><b>Showing the best players in the league.</b> ' +
      'Pick a league on <b>my leagues</b> (or paste your roster above) to see only your players.</div>';
  }

  for (const position of POSITIONS) {
    const rows = slate.players.filter((p) => p.position === position);
    const owned = rows.filter((p) => isMine(mine, p.key));
    const shown = mine.size > 0 ? owned : rows.slice(0, 8);
    const h = document.createElement("h2");
    h.textContent = position;
    out.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "cards";
    // the best week in the group, so a lineup call that needs points
    // rather than safety has something to go on
    const biggest = shown.reduce(
      (best, p) => (!best || p.ceiling > best.ceiling ? p : best), null,
    );

    for (const p of shown) {
      grid.appendChild(weekCard(p, {
        mine: mine.size > 0,
        max,
        hint: biggest && p.key === biggest.key && shown.length > 1
          ? "the biggest week in this group, if you need one"
          : "",
      }));
    }
    out.appendChild(grid);
    if (mine.size > 0 && owned[0]) starts.push(position + ": " + owned[0].name + " " + owned[0].predicted.toFixed(1));
  }
}

async function renderWaivers() {
  if (!meta.weeks.length) return seasonNotStarted();
  const slate = await slateFor($("week").value);
  const mine = myKeys();
  const out = $("out");
  out.innerHTML = "";
  const max = Math.max(...slate.players.map((p) => p.ceiling));
  const suggestions = [];

  if (mine.size === 0) {
    out.innerHTML = '<div class="empty"><b>No roster yet.</b>' +
      '<div class="step"><span>1</span><span>Open <b>my leagues</b> and load your Sleeper username.</span></div>' +
      '<div class="step"><span>2</span><span>Tap the league you want.</span></div>' +
      '<div class="step"><span>or</span><span>Paste your roster in the box above, one name per line.</span></div></div>';
    return;
  }

  for (const position of POSITIONS) {
    const rows = slate.players.filter((p) => p.position === position);
    const owned = rows.filter((p) => isMine(mine, p.key));
    const worst = owned.at(-1);
    const outside = rows.filter((p) => !owned.includes(p)).slice(0, 6);
    const h = document.createElement("h2");
    h.textContent = position;
    out.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "cards";
    for (const p of owned) grid.appendChild(weekCard(p, { mine: true, max, tag: "already yours" }));
    for (const p of outside) {
      const gain = worst ? p.predicted - worst.predicted : 0;
      // a man can be behind on an average week and ahead on a good one,
      // which is the pickup to make when you need points rather than
      // when you need not to lose them
      const onCeiling = worst ? p.ceiling - worst.ceiling : 0;

      if (worst && gain > 2) {
        suggestions.push(p.name + " +" + gain.toFixed(1) + " over " + worst.name);
      }

      grid.appendChild(weekCard(p, {
        max,
        tag: worst && gain > 2
          ? "+" + gain.toFixed(1) + " a week over " + worst.name : "",
        hint: worst && gain <= 2 && onCeiling > 3
          ? "behind " + worst.name + " on an average week, " +
            onCeiling.toFixed(1) + " ahead on a good one"
          : "",
      }));
    }
    out.appendChild(grid);
  }
}

function picksUntil(mySlot, overall, teams, rounds) {
  for (let n = overall; n <= teams * rounds; n++) {
    const round = Math.ceil(n / teams);
    const inRound = n - (round - 1) * teams;
    const slot = round % 2 === 1 ? inRound : teams - inRound + 1;
    if (slot === mySlot) return n - overall;
  }

  return null;
}

/** your remaining picks in a snake draft, earliest first */
function myUpcomingPicks(grid, fromOverall) {
  if (!grid || !grid.mySlot) {
    return [];
  }

  const picks = [];

  for (let n = fromOverall; n <= grid.teams * grid.rounds; n++) {
    const round = Math.ceil(n / grid.teams);
    const inRound = n - (round - 1) * grid.teams;
    const slot = round % 2 === 1 ? inRound : grid.teams - inRound + 1;

    if (slot === grid.mySlot) {
      picks.push({ overall: n, round, label: round + "." + String(grid.mySlot).padStart(2, "0") });
    }
  }

  return picks;
}

/**
 * What taking him now is worth over waiting a turn.
 *
 * Value over replacement does not move as a draft runs: the last back
 * this league starts is the same man whether or not the ten above him
 * have gone. What moves is how far the position falls before your
 * next turn. When backs are flying off, the best one left when you
 * pick again is much worse, and taking one now is worth that gap. On
 * a position nobody is touching the gap is nearly nothing, so waiting
 * costs you nothing.
 */
function dropOffBy(taken, nextTurn) {
  if (!nextTurn) {
    return () => 0;
  }

  const atPosition = new Map();

  return (p) => {
    if (!atPosition.has(p.position)) {
      atPosition.set(
        p.position,
        expectedBestAt(nextTurn, taken, null, null, p.position),
      );
    }

    return (p.vor ?? 0) - atPosition.get(p.position);
  };
}

/**
 * The lineup this league starts, split into the slots that name a
 * position and the flex ones that take several.
 */
function lineupNow() {
  const slots = (active && active.slots) || [
    "QB", "RB", "RB", "WR", "WR", "TE", "FLEX",
  ];
  const named = { QB: 0, RB: 0, WR: 0, TE: 0 };
  let flex = 0;

  for (const slot of slots) {
    if (named[slot] !== undefined) {
      named[slot]++;
    } else if (["FLEX", "WRRB_FLEX", "REC_FLEX", "SUPER_FLEX"].includes(slot)) {
      flex++;
    }
  }

  return { named, flex };
}

async function pollDraft() {
  const playerMap = await sleeperPlayers();
  const marked = markedKeepers();
  const state = { taken: new Set(Object.keys(marked)), teams: {}, mine: new Set(), rosteredBy: {}, grid: null, pickCount: undefined };
  const manual = $("manual").value.trim();
  for (const line of manual ? manual.split("\n") : []) if (line.trim()) state.taken.add(norm(line));

  for (const [key, owner] of Object.entries(marked)) {
    (state.teams[owner] = state.teams[owner] ?? []).push((boardLookup(key)?.name ?? key) + " (keeper)");
    if (active && owner === active.team) state.mine.add(key);
  }

  let draft = null, picks = [];

  if (active) {
    const drafts = await api("/league/" + active.leagueId + "/drafts");
    if (drafts && drafts[0]) {
      draft = await api("/draft/" + drafts[0].draft_id);
      picks = await api("/draft/" + drafts[0].draft_id + "/picks");
    }
  }

  const keeperPicksExist = picks.some((p) => p.is_keeper);

  for (const pick of picks) {
    const p = playerMap[pick.player_id];
    if (!p || !p.n) continue;
    const key = norm(p.n);
    state.taken.add(key);
    const owner = pick.picked_by && active && pick.picked_by === active.userId ? active.team
      : "slot " + pick.draft_slot;
    (state.teams[owner] = state.teams[owner] ?? []).push(p.n + (pick.is_keeper ? " (keeper)" : ""));
    if (active && pick.picked_by === active.userId) state.mine.add(key);
  }

  // who each player sat with last season, shown as a note only; nobody
  // leaves the board without an actual keeper pick or a manual mark
  if (active) {
    for (const r of active.allRosters) {
      for (const k of r.keys) state.rosteredBy[k.key] = r.owner;
    }
  }

  if (draft) {
    const teams = draft.settings?.teams ?? active?.size ?? 12;
    const rounds = draft.settings?.rounds ?? 15;
    const mySlot = draft.draft_order ? draft.draft_order[active.userId] : null;
    state.grid = { rounds, teams, cells: {}, mySlot };

    for (const pick of picks) {
      const p = playerMap[pick.player_id];
      state.grid.cells[pick.round + "|" + pick.draft_slot] = p ? p.n.split(" ").at(-1) : "?";
    }

    state.pickCount = picks.length;
    state.status = draft.status;

    const overall = picks.length + 1;
    const round = Math.ceil(overall / teams);
    const inRound = overall - (round - 1) * teams;
    const slot = round % 2 === 1 ? inRound : teams - inRound + 1;
    const slotToUser = {};

    for (const [userId, s] of Object.entries(draft.draft_order ?? {})) slotToUser[s] = userId;

    state.clock = {
      round, slot, overall,
      who: active.members?.[slotToUser[slot]] ?? "slot " + slot,
      mine: mySlot === slot,
      untilMine: mySlot ? picksUntil(mySlot, overall, teams, rounds) : null,
    };
  }

  draftState = state;
  store_set("draftState", { ...state, taken: [...state.taken], mine: [...state.mine], at: new Date().toISOString().slice(0, 16).replace("T", " ") });
  renderDraft();
}


/**
 * The whole board in order, with who is left.
 *
 * The cards above show the handful worth taking next; this is for
 * looking someone up, or seeing how far the run at a position has
 * gone. A man already drafted stays in place, greyed, with whoever
 * took him, so the order still reads the way it did before the draft
 * started.
 */
function fullRankings(out, s, order) {
  const query = norm($("search").value ?? "");
  const stillHere = new Set((order ?? []).map((p) => p.key));
  const men = [
    ...(order ?? []),
    // the ones already gone keep their place, after the men you can have
    ...board.players
      .filter((p) => !stillHere.has(p.key))
      .filter((p) => matchesFilter(p))
      .filter((p) => !query || p.key.includes(query)),
  ];

  const h = document.createElement("h2");
  h.textContent = "the whole board" +
    (posFilter === "ALL" ? "" : ", " + posFilter.toLowerCase() + " only");
  out.appendChild(h);

  const left = men.filter((p) => !s.taken.has(p.key)).length;
  const note = document.createElement("p");
  note.className = "hint";
  note.textContent = left + " of " + men.length + " still on the board";
  out.appendChild(note);

  const wrap = document.createElement("div");
  wrap.className = "scroll";
  const table = document.createElement("table");
  table.className = "ranks";
  table.innerHTML = "<thead><tr><th>ours</th><th>player</th><th>pts</th>" +
    "<th>value</th><th>adp</th><th>bye</th><th></th>" +
    "</tr></thead>";
  const body = document.createElement("tbody");

  for (const p of men) {
    const row = document.createElement("tr");
    const gone = s.taken.has(p.key);
    const mine = s.mine.has(p.key);
    const who = s.teams && s.teams[p.key];
    row.className = mine ? "mine" : gone ? "gone" : "";
    row.innerHTML =
      "<td class=\"n\">" + (p.rank ? asRound(p.rank) : "") + "</td>" +
      "<td><b>" + p.name + "</b> <span class=\"pos\">" +
        p.position + " &middot; " + (p.team ?? "") + "</span></td>" +
      "<td class=\"n\">" + (p.ppg ?? "") + "</td>" +
      "<td class=\"n\">" + (p.vor ?? "") + "</td>" +
      "<td class=\"n\">" + (p.adp ? asRound(p.adp) : "&mdash;") + "</td>" +
      "<td class=\"n\">" + (p.bye ?? "") + "</td>" +
      '<td class="mark">' + (mine
        ? '<span class="up" title="yours">&#9733;</span>'
        : gone
          ? '<span class="pos" title="' + (who ? "taken by " + who : "taken") +
            '">&times;</span>'
          : '<span class="up" title="still on the board">&check;</span>') +
      "</td>";
    row.addEventListener("click", () => openDetail(p));
    body.appendChild(row);
  }

  table.appendChild(body);
  wrap.appendChild(table);
  out.appendChild(wrap);
}

function renderDraft(staleAt) {
  if (!board) return;
  const out = $("out");
  out.innerHTML = "";
  const s = draftState;
  const counts = { QB: 0, RB: 0, WR: 0, TE: 0 };
  const mineList = [];

  for (const p of board.players) {
    if (s.mine.has(p.key)) { counts[p.position] = (counts[p.position] ?? 0) + 1; mineList.push(p); }
  }

  if (s.status || s.clock) {
    const banner = document.createElement("div");
    banner.className = "clock";
    const started = s.status === "drafting";
    const done = s.status === "complete";
    banner.innerHTML = done
      ? '<div class="big">Draft complete</div>'
      : started
        ? '<div class="big">' + (s.clock.mine ? "You are on the clock" : s.clock.who + " is picking") +
          '</div><div class="sub">' + asRound(s.clock.overall) +
          (s.clock.untilMine !== null && !s.clock.mine ? " &middot; " + s.clock.untilMine + " until your turn" : "") + "</div>"
        : '<div class="big">Draft has not started</div><div class="sub">' +
          (s.clock && s.clock.mine !== undefined && s.grid && s.grid.mySlot ? "you pick from slot " + s.grid.mySlot : "waiting for the commissioner") + "</div>";
    out.appendChild(banner);
  }

  const h = document.createElement("h2");
  h.textContent = "best available for your draft roster" + (staleAt ? " as of " + staleAt : "");
  out.appendChild(h);

  const byAdp = $("sortby") && $("sortby").value === "adp";
  /**
   * Your turn after this one. Everything at a position can be had
   * until then, so what a man is worth taking now is the gap between
   * him and whoever is left when you come back.
   */
  const mine = myUpcomingPicks(s.grid, s.clock ? s.clock.overall : 1);
  const dropOff = dropOffBy(s.taken, mine[1] ? mine[1].overall : null);
  const query = norm($("search").value ?? "");
  const scored = board.players
    .filter((p) => !s.taken.has(p.key))
    .filter((p) => matchesFilter(p))
    .filter((p) => !query || p.key.includes(query))
    .map((p) => ({
      p,
      score: p.vor,
      // and what waiting a turn would cost you at his position
      drop: dropOff(p),
    }))
    .sort((a, b) => byAdp
      ? (a.p.adp ?? 999) - (b.p.adp ?? 999)
      : b.score - a.score);

  const grid = document.createElement("div");
  grid.className = "cards";
  let shown = 0;
  const seasonMax = seasonScale(scored.slice(0, MOST_SHOWN).map(({ p }) => p));
  // Where your own picks fall in this list. Everyone above a line is
  // expected to be gone by the time that pick comes around.
  const upcoming = mine;
  let nextPick = 0;

  for (const { p, score, drop } of scored) {
    if (shown >= MOST_SHOWN) break;

    /**
     * Your turn drawn where it falls.
     *
     * Everyone above a line is expected to be gone by then, so the
     * line comes after as many cards as there are picks before yours,
     * less whoever has already been taken.
     */
    /**
     * How many of these will be gone before your turn: every pick made
     * between now and then. Keepers are already off the list, so they
     * are not counted again.
     */
    while (nextPick < upcoming.length &&
           shown >= Math.max(
             0, upcoming[nextPick].overall - 1 - (s.pickCount ?? 0),
           )) {
      const line = document.createElement("div");
      line.className = "pickline";
      line.innerHTML = "<span>your " + upcoming[nextPick].label + "</span>";
      grid.appendChild(line);
      nextPick++;
    }

    shown++;
    const lastYear = s.rosteredBy[p.key];
    grid.appendChild(seasonCard(p, {
      max: seasonMax,
      aside: { label: "value here", value: score },
      hint: drop > 8
        ? "waiting a turn costs " + drop.toFixed(0) + " at " + p.position
        : "",
      tag: shown <= 3
        ? "best left at " + p.position
        : lastYear ? "was on " + lastYear + " last season" : "",
      warn: shown > 3 && !!lastYear,
    }));
  }

  out.appendChild(grid);

  // and then everyone, in the same order, so the two never disagree
  fullRankings(out, s, scored.map(({ p }) => p));

  if (s.grid) {
    const gh = document.createElement("h2");
    gh.textContent = "pick grid";
    out.appendChild(gh);
    const table = document.createElement("table");
    table.className = "grid";
    let header = "<tr><th></th>";
    for (let slot = 1; slot <= s.grid.teams; slot++) header += "<th>" + (slot === s.grid.mySlot ? "you" : slot) + "</th>";
    let body = header + "</tr>";
    for (let round = 1; round <= s.grid.rounds; round++) {
      body += "<tr><th>r" + round + "</th>";
      for (let slot = 1; slot <= s.grid.teams; slot++) {
        const cell = s.grid.cells[round + "|" + slot] ?? "";
        body += '<td class="' + (slot === s.grid.mySlot ? "me" : "") + '">' + cell + "</td>";
      }
      body += "</tr>";
    }
    table.innerHTML = body;
    out.appendChild(table);
  }

  const drafted = new Set(mineList.map((p) => p.key));
  const rosterNow = active
    ? active.myRoster
        .map((r) => boardLookup(r.key))
        .filter((p) => p && !drafted.has(p.key))
    : [];

  if (mineList.length === 0) {
    const mh = document.createElement("h2");
    mh.textContent = "your draft roster";
    out.appendChild(mh);
    const note = document.createElement("div");
    note.className = "empty";
    note.innerHTML = "Nothing yet. Mark keepers from <b>my roster</b> or from the cards here, and your picks land here as the draft runs.";
    out.appendChild(note);
  }

  if (mineList.length > 0) {
    const mh = document.createElement("h2");
    mh.textContent = "you drafted (" + Object.entries(counts).filter(([, c]) => c > 0).map(([pos, c]) => c + " " + pos).join(", ") + ")";
    out.appendChild(mh);
    const myGrid = document.createElement("div");
    myGrid.className = "cards";
    for (const p of mineList) myGrid.appendChild(seasonCard(p, { mine: true, max: seasonMax, aside: { label: "over replacement", value: p.vor } }));
    out.appendChild(myGrid);
  }

  if (rosterNow.length > 0) {
    const rh = document.createElement("h2");
    rh.textContent = "on your sleeper roster now (" + rosterNow.length + ")";
    out.appendChild(rh);
    const rGrid = document.createElement("div");
    rGrid.className = "cards";

    for (const p of rosterNow) {
      const isKept = !!markedKeepers()[p.key];
      rGrid.appendChild(seasonCard(p, {
        max: seasonMax,
        kept: isKept,
        badge: isKept ? "keeper" : "",
        aside: { label: "over replacement", value: p.vor },
        keeper: { on: isKept, key: p.key },
      }));
    }

    out.appendChild(rGrid);
  }

  const owners = Object.keys(s.teams);

  if (owners.length > 0) {
    const th = document.createElement("h2");
    th.textContent = "keepers and picks so far";
    out.appendChild(th);
    const teamGrid = document.createElement("div");
    teamGrid.className = "cards";
    for (const owner of owners) {
      const div = document.createElement("div");
      div.className = "card plain" + (active && owner === active.team ? " mine" : "");
      div.innerHTML = '<div class="nm">' + owner + '</div><div class="sub" style="display:block; margin-top:.3rem">' + s.teams[owner].join("<br>") + "</div>";
      teamGrid.appendChild(div);
    }
    out.appendChild(teamGrid);
  }
}

async function renderDraftView() {
  if (!board) {
    board = await (await fetch("data/board-" + meta.boardSeason + ".json" + (window.__bust ?? ""))).json();
    boardByKey = new Map(board.players.map((p) => [p.key, p]));
    rescoreBoard();
  }

  if (active) {
    $("status").textContent = "watching the draft, refreshing every 5s; pause anytime";
    await pollDraft();
    draftPoll = setInterval(pollDraft, 5000);
  } else {
    const saved = store_get("draftState", null);
    if (saved) {
      draftState = { ...saved, taken: new Set(saved.taken), mine: new Set(saved.mine) };
      renderDraft(saved.at);
      $("status").textContent = "saved state; pick a league on the leagues tab to refresh";
    } else {
      $("status").textContent = "pick a league on the leagues tab, or use the extra names box";
      draftState = { taken: new Set(), teams: {}, mine: new Set(), rosteredBy: {}, grid: null };
      renderDraft();
    }
  }
}

for (const label of ["ALL", ...POSITIONS]) {
  const button = document.createElement("button");
  button.textContent = label.toLowerCase();
  button.className = label === "ALL" ? "on" : "";
  button.addEventListener("click", () => {
    posFilter = label;
    for (const b of $("posfilter").children) b.classList.toggle("on", b.textContent === label.toLowerCase());
    renderDraft();
  });
  $("posfilter").appendChild(button);
}

$("search").addEventListener("input", () => { if (view === "draft") renderDraft(); });
$("sortby").addEventListener("change", () => { if (view === "draft") renderDraft(); });

/**
 * What draws each view. The nav and the go button both used to carry
 * their own copy of this, which is how the two drifted apart.
 */
const RENDER = {
  leagues: renderLeagues,
  roster: renderRoster,
  keepers: renderKeepers,
  draft: renderDraftView,
  start: renderStart,
  waivers: renderWaivers,
};

async function renderView() {
  const draw = RENDER[view];

  if (draw) {
    await draw();
  }
}

document.querySelectorAll("#subnav button").forEach((b) =>
  b.addEventListener("click", async () => {
    await ready;
    if (!meta) return;
    setView(b.dataset.view);

    try {
      await renderView();
    } catch (error) {
      $("status").textContent = String(error);
    }

    refreshGoLabel();
  }),
);
$("home").addEventListener("click", () => setView("leagues"));
$("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) $("overlay").classList.remove("open"); });

$("go").addEventListener("click", async () => {
  const status = $("status");
  try {
    status.className = "";
    status.textContent = "";
    // the leagues page goes back to Sleeper rather than redrawing, and
    // the draft page is a toggle once it is already following along
    if (view === "leagues") await loadLeagues();
    else if (view === "draft" && draftPoll) {
      clearInterval(draftPoll);
      draftPoll = null;
      status.textContent = "paused";
    } else await renderView();
    refreshGoLabel();
    saveSettings();
  } catch (error) {
    status.className = "bad";
    status.textContent = String(error);
    $("prog").hidden = true;
  }
});

const ready = boot().catch((error) => {
  // a broken index should still leave a usable leagues page behind
  setView("leagues");
  $("status").className = "bad";
  $("status").textContent = "could not load projections: " + error;
});
