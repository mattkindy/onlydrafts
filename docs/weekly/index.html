<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- the page changes far more often than a browser expects, and a
     stale copy shows errors that were fixed hours ago -->
<meta http-equiv="cache-control" content="no-cache, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<title>depthchart</title>
<style>
  :root {
    --bg: #10141C; --panel: #1A2029; --edge: #2A3342; --ink: #E8ECF2;
    --muted: #8B95A5; --faint: #5B6575; --go: #35C06F; --mark: #F5B841;
    --chip: #232B38;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #EFF1F4; --panel: #FFFFFF; --edge: #D8DCE3; --ink: #171B22;
      --muted: #5A6270; --faint: #98A0AD; --go: #1E8A4C; --mark: #D99A16;
      --chip: #E7EAEF;
    }
  }
  * { box-sizing: border-box; }
  /* .controls sets display:flex, which would otherwise beat the attribute */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, sans-serif; line-height: 1.45; }
  .wrap { max-width: 64rem; margin: 0 auto; padding: 1rem 1rem 4rem; }
  nav { display: flex; gap: .4rem; align-items: center; margin: .5rem 0 1rem;
    flex-wrap: wrap; }
  nav .brand { margin-right: auto; font-weight: 800; font-size: 1.05rem;
    letter-spacing: -0.02em; cursor: pointer; }
  nav .brand b { color: var(--go); }
  #crumb { display: flex; gap: .5rem; align-items: center; font-size: .85rem;
    color: var(--muted); }
  #crumb b { color: var(--ink); }
  #crumb button { font: inherit; font-size: .78rem; background: var(--chip);
    color: var(--muted); border: none; border-radius: 999px;
    padding: .25rem .7rem; cursor: pointer; }
  #subnav { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: .8rem;
    border-bottom: 1px solid var(--edge); }
  #posfilter button { font: inherit; font-size: .78rem; font-weight: 600;
    background: var(--chip); color: var(--muted); border: none;
    border-radius: 999px; padding: .25rem .75rem; margin-right: .3rem;
    cursor: pointer; }
  #posfilter button.on { background: var(--go); color: #0C1117; }
  .clock { background: var(--panel); border: 1px solid var(--go);
    border-radius: 12px; padding: .7rem 1rem; margin-bottom: .9rem; }
  .clock .big { font-size: 1.05rem; font-weight: 700; }
  .clock .sub { color: var(--muted); font-size: .82rem; }
  #subnav button, nav button { font: inherit; font-size: .8rem; font-weight: 600;
    background: transparent; color: var(--muted); border: none;
    border-bottom: 2px solid transparent; padding: .35rem .7rem; cursor: pointer; }
  nav button.on { color: var(--ink); border-bottom-color: var(--go); }
  .controls { background: var(--panel); border: 1px solid var(--edge);
    border-radius: 10px; padding: .7rem 1rem; margin: 0 0 1rem;
    display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; }
  .controls label { color: var(--muted); font-size: .82rem; }
  input, select { font: inherit; font-size: .85rem; color: var(--ink);
    background: var(--bg); border: 1px solid var(--edge);
    padding: .3rem .5rem; border-radius: 7px; }
  button.act { font: inherit; font-size: .85rem; font-weight: 700;
    background: var(--go); color: #0C1117; border: none;
    padding: .4rem 1.1rem; border-radius: 999px; cursor: pointer; }
  button.act:hover { filter: brightness(1.12); }
  #status { color: var(--faint); font-size: .82rem; }
  #status.bad { color: var(--mark); font-weight: 600; }
  progress { width: 9rem; accent-color: var(--go); }
  textarea { width: 100%; height: 3rem; font: inherit; font-size: .85rem;
    color: var(--ink); background: var(--bg); border: 1px solid var(--edge);
    padding: .4rem; border-radius: 7px; }
  h2 { font-size: .78rem; margin: 1.3rem 0 .5rem; color: var(--faint);
    font-family: ui-monospace, Menlo, monospace; letter-spacing: .12em;
    text-transform: uppercase; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: .7rem; align-items: start; }
  .cards.wide { grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr));
    gap: 1.1rem; }
  .card { background: var(--panel); border: 1px solid var(--edge);
    border-radius: 12px; padding: .75rem .95rem; }
  .more { flex: 0 0 auto; margin-left: .4rem; vertical-align: middle;
    background: var(--chip); border: 1px solid var(--edge); color: var(--muted);
    cursor: pointer; padding: .22rem; line-height: 0; border-radius: 999px; }
  .more:hover { color: var(--ink); border-color: var(--muted); }
  .more:focus-visible { outline: 2px solid var(--go); outline-offset: 1px; }
  .keepbtn { margin-top: .5rem; font: inherit; font-size: .72rem; font-weight: 700;
    padding: .25rem .6rem; border-radius: 999px; cursor: pointer;
    background: var(--chip); color: var(--muted); border: 1px solid var(--edge); }
  .keepbtn:hover { color: var(--ink); border-color: var(--muted); }
  .keepbtn.on { background: var(--go); color: #0C1117; border-color: var(--go); }
  .card.plain { cursor: default; }
  .card.mine { border-color: var(--go); }
  /* a keeper is a ticket you are holding, so its edge is perforated */
  .card.kept { border-color: var(--go); border-left-style: dashed; }
  .card.gone { opacity: .45; }
  .badge { font-size: .6rem; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; color: #0C1117; background: var(--go);
    border-radius: 999px; padding: .1rem .45rem; margin-left: .4rem;
    vertical-align: .1em; }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; }
  .card .nm { font-weight: 700; font-size: .92rem; display: flex;
    align-items: center; gap: .1rem; min-width: 0; flex-wrap: wrap; }
  .card .big { font-size: 1.35rem; font-weight: 800;
    font-variant-numeric: tabular-nums; display: flex; flex-direction: column;
    align-items: flex-end; line-height: 1.1; }
  .card .unit { font-size: .6rem; font-weight: 600; font-style: normal;
    color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }
  .card .val { color: var(--muted); font-weight: 700; white-space: nowrap; }
  .card .note { color: var(--faint); font-size: .72rem; margin-top: .35rem; }
  .figures { display: flex; flex-wrap: wrap; gap: .35rem .9rem; margin-top: .5rem;
    padding-top: .5rem; border-top: 1px solid var(--edge);
    font-variant-numeric: tabular-nums; }
  .fig { font-size: .85rem; font-weight: 700; color: var(--ink); }
  .fig i { display: block; font-style: normal; font-size: .6rem; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .fig.up { color: var(--go); }
  .fig.down { color: var(--mark); }
  .beaten i { display: block; font-style: normal; font-size: .62rem;
    font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--faint); margin-bottom: .2rem; }
  .beaten .f { display: inline-block; margin-right: .8rem;
    font-variant-numeric: tabular-nums; }
  .beaten { margin-top: .55rem; font-size: .8rem; color: var(--ink);
    background: color-mix(in srgb, var(--mark) 12%, transparent);
    border-left: 2px solid var(--mark); padding: .35rem .5rem;
    border-radius: 0 4px 4px 0; }
  .madeof { flex-basis: 100%; font-size: .78rem; color: var(--muted);
    margin-top: .15rem; }
  .madeof i { font-style: normal; font-size: .62rem; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: var(--faint);
    margin-right: .35rem; }
  .madeof b { color: var(--ink); font-weight: 700; }
  .instead { margin-top: .6rem; }
  .alsoat { margin-top: .5rem; }
  .instead table.ranks th { position: static; }
  .instead td.up { color: var(--go); }
  .instead td.down { color: var(--mark); }
  .costrow { flex-wrap: wrap; }
  .costrow i { font-style: normal; font-size: .62rem; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .costrow input { width: 4rem; flex: 0 0 auto; }
  .costrow b { font-size: .8rem; }
  .badge.up { background: var(--go); color: #0C1117; }
  .badge.down { background: var(--mark); color: #0C1117; }
  .badge.even { background: var(--chip); color: var(--muted);
    border: 1px solid var(--edge); }
  .facts { display: flex; flex-wrap: wrap; gap: .1rem .9rem; align-items: baseline;
    font-variant-numeric: tabular-nums; }
  .facts .f { color: var(--ink); font-size: .8rem; font-weight: 600; }
  .facts .f small { color: var(--faint); font-size: .62rem; font-weight: 600;
    margin-left: .28rem; }
  .facts .f i { color: var(--faint); font-style: normal; font-size: .62rem;
    font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
    margin-right: .3rem; }
  .chip { font-size: .68rem; font-weight: 700; padding: .05rem .35rem;
    border-radius: 3px; letter-spacing: .02em; }
  .chip.up { color: var(--go); background: color-mix(in srgb, var(--go) 14%, transparent); }
  .chip.down { color: var(--mark); background: color-mix(in srgb, var(--mark) 14%, transparent); }
  .rangenum { display: flex; justify-content: space-between; align-items: baseline;
    font-size: .72rem; font-weight: 600; color: var(--faint);
    font-variant-numeric: tabular-nums; margin-top: .2rem; }
  .card .sub { color: var(--faint); font-size: .74rem;
    display: flex; justify-content: space-between; margin-top: .1rem; gap: .5rem; }
  .range { position: relative; height: 14px; background: var(--chip);
    border-radius: 999px; margin-top: .7rem; }
  /* the middle half, which is where he lands most weeks */
  .range .tail { position: absolute; top: 4px; bottom: 4px;
    background: color-mix(in srgb, var(--go) 22%, var(--chip)); border-radius: 2px; }
  .card.mine .range .tail { background: color-mix(in srgb, var(--go) 34%, var(--chip)); }
  .range .span { position: absolute; top: 0; bottom: 0;
    background: color-mix(in srgb, var(--go) 55%, var(--chip));
    border-radius: 999px; }
  .card.mine .range .span { background: color-mix(in srgb, var(--go) 70%, var(--chip)); }
  .range .mark { position: absolute; top: -4px; width: 4px; height: 22px;
    background: var(--mark); border-radius: 2px;
    box-shadow: 0 0 0 2px var(--panel); }
  .costrow { display: flex; align-items: center; gap: .4rem; margin-top: .5rem;
    color: var(--faint); font-size: .74rem; }
  .costrow input { width: 3.2rem; font-size: .8rem; padding: .2rem .35rem; }
  .pickline { grid-column: 1 / -1; display: flex; align-items: center;
    gap: .6rem; margin: .3rem 0; color: var(--mark); font-size: .72rem;
    font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .pickline::after { content: ""; flex: 1;
    border-top: 1px dashed var(--mark); opacity: .5; }
  .tag { font-size: .72rem; font-weight: 700; color: var(--go); margin-top: .45rem; }
  .tag.warn { color: var(--mark); }
  .tag.hint { color: var(--faint); font-weight: 500; }
  .hint { color: var(--faint); font-size: .78rem; }
  #explain h1 { font-size: 1.25rem; margin: .2rem 0 .15rem; }
  #explain p { color: var(--muted); font-size: .85rem; margin: 0 0 .9rem; }
  /* the view stacks headings, notes and grids, and they need air */
  #out { display: flex; flex-direction: column; gap: .9rem; }
  #out > h2:not(:first-child) { margin-top: .3rem; }
  .empty { background: var(--panel); border: 1px dashed var(--edge);
    border-radius: 12px; padding: 1.2rem; color: var(--muted); font-size: .88rem; }
  .empty b { color: var(--ink); }
  .step { display: flex; gap: .5rem; align-items: baseline; margin: .35rem 0; }
  .step span:first-child { color: var(--go); font-weight: 700; }
  table.grid { border-collapse: collapse; font-size: .68rem; width: 100%;
    overflow-x: auto; display: block; background: var(--panel);
    border: 1px solid var(--edge); border-radius: 10px; }
  table.grid td, table.grid th { border: 1px solid var(--edge);
    padding: .25rem .4rem; white-space: nowrap; color: var(--muted); }
  table.grid th { color: var(--faint); font-weight: 600; }
  table.grid td.me { background: color-mix(in srgb, var(--go) 18%, var(--panel));
    color: var(--ink); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: flex-start; justify-content: center;
    padding: 2rem 1rem; overflow-y: auto; z-index: 10; }
  #overlay.open { display: flex; }
  table.ranks { border-collapse: collapse; width: 100%; font-size: .85rem;
    font-variant-numeric: tabular-nums; }
  table.ranks th { text-align: left; font-size: .68rem; text-transform: uppercase;
    letter-spacing: .06em; color: var(--faint); font-weight: 600;
    border-bottom: 1px solid var(--edge); padding: .35rem .5rem;
    position: sticky; top: 0; background: var(--bg); }
  table.ranks td { padding: .3rem .5rem; border-bottom: 1px solid var(--edge); }
  table.ranks td.n { text-align: right; }
  table.ranks td.mark { text-align: center; font-size: 1rem; width: 1.6rem; }
  table.ranks th:last-child { width: 1.6rem; }
  table.ranks tr { cursor: pointer; }
  table.ranks tr:hover td { background: var(--panel); }
  table.ranks tr.gone td { opacity: .45; }
  table.ranks tr.mine td { background: rgba(88, 166, 255, .08); }
  table.ranks .pos { color: var(--faint); font-size: .75rem; }
  .up { color: var(--go); }
  .down { color: var(--mark); }
  .hint { color: var(--faint); font-size: .82rem; margin: .2rem 0 .6rem; }
  .scroll { overflow-x: auto; }
  .sheet { background: var(--panel); border: 1px solid var(--edge);
    border-radius: 14px; padding: 1.2rem 1.4rem; max-width: 34rem; width: 100%; }
  .sheet h3 { margin: 0; font-size: 1.15rem; }
  .sheet .sub { color: var(--faint); font-size: .8rem; margin-bottom: .8rem; }
  .wk { display: grid; grid-template-columns: 2.4rem 3.4rem 1fr 2.4rem;
    gap: .5rem; align-items: center; font-size: .75rem; color: var(--muted);
    padding: .1rem 0; }
  .wk .bar { height: 11px; position: relative; }
  .wk .bar u, .wk .bar i, .wk .bar b { position: absolute; }
  /* whisker: a bad week to a big one */
  .wk .bar u { top: 5px; height: 1px; background: var(--chip); }
  /* box: the middle half of outcomes */
  .wk .bar i { top: 2px; height: 7px; background: var(--go);
    opacity: .35; border-radius: 3px; }
  /* tick: the projection */
  .wk .bar b { top: 0; width: 2px; height: 11px; background: var(--go); }
  .wk .scale { grid-column: 3; display: flex; justify-content: space-between;
    color: var(--faint); font-size: .65rem; padding-top: .2rem; }
  .fact { font-size: .8rem; margin: .15rem 0; }
  .fact.p::before { content: "+ "; color: var(--go); font-weight: 700; }
  .fact.m::before { content: "- "; color: var(--mark); font-weight: 700; }
  .sheet .row { display: flex; gap: .6rem; margin-top: 1rem; }
  .league-card .nm { font-size: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <span class="brand" id="home">depth<b>chart</b></span>
    <span id="crumb"></span>
  </nav>

  <div id="subnav" hidden>
    <button data-view="roster">my roster</button>
    <button data-view="keepers">keeper value</button>
    <button data-view="draft">draft help</button>
    <button data-view="start">who to start</button>
    <button data-view="waivers">who to add</button>
  </div>

  <div id="explain">
    <h1 id="title"></h1>
    <p id="blurb"></p>
  </div>

  <div class="controls" id="ctl">
    <label id="userwrap">sleeper user <input id="username" size="12"></label>
    <label id="weekwrap" hidden>week <select id="week"></select></label>
    <label id="keepwrap" hidden>keepers per team
      <input id="keepn" type="number" value="3" min="0" max="6" style="width:3.2rem"></label>
    <span id="posfilter" hidden></span>
    <label id="sortwrap" hidden>order by <select id="sortby">
      <option value="value">our value</option>
      <option value="adp">adp</option>
    </select></label>
    <label id="searchwrap" hidden>find <input id="search" size="12" placeholder="a name"></label>
    <button class="act" id="go">find my leagues</button>
    <span id="status"></span>
    <progress id="prog" max="100" value="0" hidden></progress>
  </div>

  <div class="controls" id="manualwrap" hidden>
    <label class="hint" id="manualhint"></label>
    <textarea id="manual"></textarea>
  </div>

  <div id="out"></div>
  <p class="hint" id="legend"></p>
</div>

<div id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
/**
 * The filters over the board. Flex is whoever can fill one, and
 * rookies are the men nobody has seen play, which is a different
 * question from what position they are.
 */
const POSITIONS = ["QB", "RB", "WR", "TE", "FLEX", "K", "DEF", "ROOKIES"];
const STARTERS = { QB: 1, RB: 2, WR: 2, TE: 1 };
let view = "leagues";
let meta = null, board = null, boardByKey = null;
const slates = {};
let players = null;
let leagues = store_get("leagues", []);
let active = store_get("active", null); // {leagueId, name, team, userId}
let draftPoll = null;
let posFilter = "ALL";
let draftState = { taken: new Set(), teams: {}, mine: new Set(), rosteredBy: {}, grid: null, pickCount: undefined };

function store_get(key, fallback) {
  try { const raw = localStorage.getItem("dc." + key); return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function store_set(key, value) {
  try { localStorage.setItem("dc." + key, JSON.stringify(value)); } catch {}
}

const $ = (id) => document.getElementById(id);
const norm = (n) => (n ?? "").toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?$/, "").replace(/[^a-z]/g, "");
const api = (path) => fetch("https://api.sleeper.app/v1" + path).then((r) => r.json());

async function sleeperPlayers() {
  if (players) return players;
  // v2 keys the trimmed shape; an older cache used different field names
  const cached = store_get("players.v2", null);
  if (cached) { players = cached; return cached; }
  try { localStorage.removeItem("dc.players"); } catch {}
  $("status").textContent = "fetching player list (5MB, once ever)...";
  $("prog").hidden = false; $("prog").value = 40;
  const raw = await api("/players/nfl");
  $("prog").hidden = true;
  const trimmed = {};
  for (const [id, p] of Object.entries(raw)) {
    if (p.full_name && p.position) trimmed[id] = { n: p.full_name, p: p.position };
  }
  store_set("players.v2", trimmed);
  players = trimmed;
  return trimmed;
}

function keeperKeyFor(league) { return "keepers." + league; }
function markedKeepers() { return active ? store_get(keeperKeyFor(active.leagueId), {}) : {}; }
function saveMarkedKeepers(map) { if (active) store_set(keeperKeyFor(active.leagueId), map); }

async function boot() {
  const bust = "?v=" + Math.floor(Date.now() / 60000);
  meta = await (await fetch("data/index.json" + bust)).json();
  window.__bust = bust;
  for (const entry of meta.weeks) {
    const option = document.createElement("option");
    option.value = entry.season + "|" + entry.week;
    option.textContent = entry.season + " week " + entry.week;
    $("week").appendChild(option);
  }
  const latest = meta.weeks.at(-1);

  if (latest) {
    $("week").value = latest.season + "|" + latest.week;
  }

  const saved = store_get("settings", null);

  if (saved) {
    $("username").value = saved.username ?? "";
    $("manual").value = saved.manual ?? "";
    $("keepn").value = saved.keepn ?? 3;
    if (saved.week && [...$("week").options].some((o) => o.value === saved.week)) $("week").value = saved.week;
  }
  const fallbackView = meta.weeks.length ? "start" : "draft";
  setView(active ? (saved && saved.view ? saved.view : fallbackView) : "leagues");
  if (view === "leagues" && leagues.length) renderLeagues();
}

function saveSettings() {
  store_set("settings", { username: $("username").value, manual: $("manual").value,
    keepn: $("keepn").value, week: $("week").value, view });
}

function setView(next) {
  if (next !== "leagues" && !active) next = "leagues";
  view = next;
  $("subnav").hidden = next === "leagues";
  $("crumb").innerHTML = active && next !== "leagues"
    ? '<button id="back">all leagues</button><b>' + active.name + "</b><span>you: " + active.team + "</span>"
    : "";

  if ($("back")) {
    $("back").addEventListener("click", () => { setView("leagues"); renderLeagues(); });
  }

  for (const b of document.querySelectorAll("#subnav button")) b.classList.toggle("on", b.dataset.view === next);
  applyToolbar(next);
  const preseason = (next === "start" || next === "waivers") && !meta.weeks.length;

  if (preseason) {
    $("manualwrap").hidden = true;
  }
  const copy = {
    leagues: ["My leagues",
      "Type your Sleeper username, then tap a league to open it. Draft help, lineups, and waivers all live inside a league.",
      ""],
    roster: ["My roster",
      "Everyone Sleeper currently has on your team, with this season's projection for each.",
      "Before a keeper draft this is last season's roster until the league clears it. Tap a player for the season distribution and to mark a keeper."],
    keepers: ["Keeper value",
      "The most a player is worth keeping for. Paying a round for him means giving up that pick, so he is worth it only while he beats whoever you could take with it.",
      "Type what your league charges and each card says whether to keep him. A player worth a 5th and costing a 9th is a bargain; one costing a 2nd is not."],
    draft: ["Draft help",
      "Live board for draft night. It watches your league's draft, removes players as they go, and ranks who is left by what your roster still needs.",
      "The big number is value over a replacement starter, weighted by the slots your draft roster still needs. Players stay on the board until they are actually kept or drafted."],
    start: ["Who to start",
      "Your roster for one week, ranked by projected points, so you can set a lineup.",
      "The bar shows the range from a bad week to a great one; the gold mark is the projection. Tap a card for the week-by-week season and what is helping or hurting."],
    waivers: ["Who to add",
      "Your players next to the best available at each position, so you can see whether a pickup is an upgrade.",
      "A green tag means that player projects clearly ahead of your weakest starter at the spot."],
  }[next] ?? ["", "", ""];
  $("title").textContent = copy[0];
  $("blurb").textContent = copy[1];
  $("legend").textContent = preseason ? "" : copy[2];
  $("out").innerHTML = "";
  if (draftPoll && next !== "draft") { clearInterval(draftPoll); draftPoll = null; }
  refreshGoLabel();
  if (next === "leagues" && leagues.length) renderLeagues();
  if (next === "keepers") renderKeepers();
}

const TOOLBAR_FIELDS = [
  "userwrap", "weekwrap", "keepwrap", "posfilter", "searchwrap", "sortwrap",
];

function applyToolbar(next) {
  const bar = TOOLBARS[next] ?? { fields: [], action: null };
  const weekMissing = bar.fields.includes("weekwrap") && !meta.weeks.length;

  for (const field of TOOLBAR_FIELDS) {
    $(field).hidden = !bar.fields.includes(field) || (field === "weekwrap" && weekMissing);
  }

function refreshGoLabel() {

    $("go").textContent = TOOLBARS[view]?.action ?? "refresh";

async function loadLeagues() {
  const username = $("username").value.trim();
  if (!username) { $("status").textContent = "type your sleeper username"; return; }
  $("status").textContent = "finding leagues...";
  const user = await api("/user/" + username);
  if (!user || !user.user_id) { $("status").textContent = "no such user"; return; }
  const state = await api("/state/nfl");
  const found = await api("/user/" + user.user_id + "/leagues/nfl/" + state.season);
  const playerMap = await sleeperPlayers();
  leagues = [];

  for (const lg of found ?? []) {
    const [rosters, users, traded, drafts] = await Promise.all([
      api("/league/" + lg.league_id + "/rosters"),
      api("/league/" + lg.league_id + "/users"),
      api("/league/" + lg.league_id + "/traded_picks").catch(() => []),
      api("/league/" + lg.league_id + "/drafts").catch(() => []),
    ]);
    // Keeping a man costs the pick he is priced at, so a team without
    // that round cannot keep him at any price. Everyone starts with one
    // of each of their own; a traded pick leaves the roster it came
    // from and joins whoever owns it now. A pick dealt away and later
    // bought back reads as both, so it stays put, and a team can end up
    // holding two of a round.
    const ROUNDS = 15;
    const picksOf = new Map(rosters.map((r) => [
      r.roster_id,
      new Map(Array.from({ length: ROUNDS }, (_, i) => [i + 1, 1])),
    ]));

    for (const pick of (traded ?? []).filter((t) => String(t.season) === String(lg.season))) {
      if (pick.roster_id === pick.owner_id) continue;
      const from = picksOf.get(pick.roster_id);
      const to = picksOf.get(pick.owner_id);
      if (from) from.set(pick.round, (from.get(pick.round) ?? 0) - 1);
      if (to) to.set(pick.round, (to.get(pick.round) ?? 0) + 1);
    }

    const roundsHeld = (id) =>
      [...(picksOf.get(id) ?? new Map())]
        .filter(([, n]) => n > 0).map(([round]) => round).sort((a, b) => a - b);
    const mine = rosters.find((r) => r.owner_id === user.user_id);
    const nameOf = new Map(users.map((u) => [u.user_id, u.display_name]));
    leagues.push({
      members: Object.fromEntries(users.map((u) => [u.user_id, u.display_name])),
      leagueId: lg.league_id, name: lg.name, size: lg.total_rosters,
      // what this league pays and who it starts, so the board can be
      // scored here rather than at build time
      scoring: lg.scoring_settings ?? null,
      slots: lg.roster_positions ?? null,
      userId: user.user_id, team: nameOf.get(user.user_id) ?? username,
      myRoster: (mine && mine.players ? mine.players : [])
        .map((id) => playerMap[id]).filter((p) => p && p.n).map((p) => ({ name: p.n, key: norm(p.n) })),
      myPicks: roundsHeld(mine ? mine.roster_id : -1),
      // where you sit in the order, so a keeper is priced against the
      // pick you would actually make rather than the middle of a round
      draftSlot: (drafts && drafts[0] && drafts[0].draft_order
        ? drafts[0].draft_order[user.user_id]
        : null) ?? null,
      snake: !drafts || !drafts[0] || drafts[0].type === "snake",
      allRosters: rosters.map((r) => ({
        owner: nameOf.get(r.owner_id) ?? r.owner_id,
        picks: roundsHeld(r.roster_id),
        keys: (r.players ?? []).map((id) => playerMap[id]).filter((p) => p && p.n)
          .map((p) => ({ name: p.n, key: norm(p.n), pos: p.p })),
      })),
    });
  }

  store_set("leagues", leagues);
  $("status").textContent = "";
  renderLeagues();
}

function renderLeagues() {
  const out = $("out");
  out.innerHTML = "";

  if (!leagues.length) {
    out.innerHTML = '<div class="empty"><b>Start here.</b>' +
      '<div class="step"><span>1</span><span>Type your Sleeper username above.</span></div>' +
      '<div class="step"><span>2</span><span>Press load. Your leagues appear as cards.</span></div>' +
      '<div class="step"><span>3</span><span>Tap a league, then use draft help, who to start, or who to add.</span></div></div>';
    return;
  }
  const h = document.createElement("h2");
  h.textContent = "your leagues";
  out.appendChild(h);
  const grid = document.createElement("div");
  grid.className = "cards";

  for (const lg of leagues) {
    const div = document.createElement("div");
    div.className = "card league-card" + (active && active.leagueId === lg.leagueId ? " mine" : "");
    div.innerHTML = '<div class="nm">' + lg.name + '</div><div class="sub"><span>' +
      lg.size + ' teams</span><span>you: ' + lg.team + "</span></div>";
    div.addEventListener("click", async () => {
      active = lg;
      store_set("active", active);
      // a different league pays differently and starts a different
      // lineup, so the board is put back in order for it
      rescoreBoard();
      setView(meta.weeks.length ? "start" : "draft");
      if (meta.weeks.length) await renderStart();
      else await renderDraftView();
      refreshGoLabel();
    });
    grid.appendChild(div);
  }

  out.appendChild(grid);
}

function boardLookup(key) {
  if (!boardByKey) return null;
  return boardByKey.get(key) ?? [...boardByKey.entries()].find(([k]) => k.includes(key) || key.includes(k))?.[1] ?? null;
}

/*
 * One row per week, drawn as a box and whisker rather than a filled bar.
 * The season's per-game quantiles give the shape of a single week; each
 * week stretches that shape by its own projection, so a soft matchup
 * shows a lower box and a shorter tail, not only a shorter bar.
 */
function weeklyRows(b) {
  const games = b.weeks ?? [];

  if (!games.length) {
    return "";
  }

  const g = b.game;
  const spread = g && g.ev > 0
    ? { low: g.low / g.ev, q1: g.q1 / g.ev, q3: g.q3 / g.ev, high: g.high / g.ev }
    : { low: 1, q1: 1, q3: 1, high: 1 };
  const max = Math.max(...games.map((w) => w.pts * spread.high)) || 1;
  const pct = (v) => (v / max) * 100;

  const rows = games.map((w) => {
    const low = pct(w.pts * spread.low);
    const q1 = pct(w.pts * spread.q1);
    const q3 = pct(w.pts * spread.q3);
    const high = pct(w.pts * spread.high);
    return '<div class="wk"><span>w' + w.w + "</span><span>" + w.opp +
      '</span><span class="bar">' +
      '<u style="left:' + low + "%;right:" + (100 - high) + '%"></u>' +
      '<i style="left:' + q1 + "%;right:" + (100 - q3) + '%"></i>' +
      '<b style="left:' + pct(w.pts) + '%"></b>' +
      "</span><span>" + w.pts.toFixed(1) + "</span></div>";
  }).join("");

  return rows +
    '<div class="wk"><span></span><span></span><div class="scale"><span>0</span><span>' +
    (max / 2).toFixed(0) + "</span><span>" + max.toFixed(0) +
    "</span></div><span></span></div>";
}

function openDetail(p, slatePlayer) {
  const b = boardLookup(p.key) ?? p;
  const sheet = $("sheet");
  const marked = markedKeepers();
  const isKept = !!marked[p.key];
  const weeks = weeklyRows(b);
  const plus = (b.plus ?? []).map((f) => '<div class="fact p">' + f + "</div>").join("");
  const minus = (b.minus ?? []).map((f) => '<div class="fact m">' + f + "</div>").join("");
  sheet.innerHTML =
    "<h3>" + (b.name ?? p.name) + '</h3><div class="sub">' + (b.position ?? p.position) +
    " &middot; " + (b.team ?? p.team ?? "") +
    (b.ppg
      ? " &middot; " + b.ppg.toFixed(1) + " a game" +
        (b.game
          ? " (median " + b.game.mid.toFixed(1) + ", eight weeks in ten " +
            b.game.low.toFixed(1) + " to " + b.game.high.toFixed(1) + ")"
          : "")
      : "") +
    (b.adp
      ? " &middot; adp " + asRound(b.adp) +
        (b.adpLow
          ? " (" + asRound(b.adpHigh) + " to " + asRound(b.adpLow) + ")"
          : "")
      : " &middot; undrafted") + "</div>" +
    (b.sim
      ? "<h2>season total, 2000 simulations</h2>" +
        '<div class="fact">expected <b>' + b.sim.ev + "</b> points, median <b>" +
          b.sim.mid + "</b></div>" +
        '<div class="fact">eight seasons in ten between <b>' + b.sim.low +
          "</b> and <b>" + b.sim.high + "</b></div>" +
        '<div class="fact">the middle half between <b>' + b.sim.q1 +
          "</b> and <b>" + b.sim.q3 + "</b></div>" +
        '<div class="fact">about ' + b.sim.games + " games played</div>"
      : "") +
    (plus || minus ? "<h2>factors vs past years</h2>" + plus + minus : "") +
    (weeks ? "<h2>week by week</h2>" + weeks : "") +
    '<div class="row"><button class="act" id="keepbtn">' +
    (isKept ? "unmark keeper" : "mark as keeper") + "</button>" +
    '<button class="act" id="closebtn" style="background:var(--chip); color:var(--ink)">close</button></div>';
  $("overlay").classList.add("open");
  $("keepbtn").addEventListener("click", () => {
    const map = markedKeepers();
    if (map[p.key]) delete map[p.key];
    else {
      const owner = ownerOf(p.key);
      const already = Object.entries(map).filter(([k, o]) => o === owner).length;
      if (owner && already >= Number($("keepn").value)) {
        $("status").textContent = owner + " already has " + already + " keepers marked";
        return;
      }
      map[p.key] = owner ?? "unknown";
    }
    saveMarkedKeepers(map);
    $("overlay").classList.remove("open");
    if (view === "draft") renderDraft();
  });
  $("closebtn").addEventListener("click", () => $("overlay").classList.remove("open"));
}

function ownerOf(key) {
  if (!active) return null;
  for (const r of active.allRosters) if (r.keys.some((k) => k.key === key)) return r.owner;
  return null;
}

/*
 * Every card states what its big number measures. The two views answer
 * different questions, so they get different cards: a week card is
 * points in one game, a season card is points a game across the year.
 * Passing a bare number with no unit is what let a draft score and a
 * weekly projection look identical on screen.
 */
/** one scale for every season card on screen, so the bars compare */
function seasonScale(players) {
  return Math.max(12, ...players.map((p) => (p.game ? p.game.high : p.ppg) ?? 0)) * 1.02;
}

function card(p, opts) {
  const div = document.createElement("div");
  div.className = "card" + (opts.mine ? " mine" : "") +
    (opts.kept ? " kept" : "") + (opts.gone ? " gone" : "");
  const r = opts.range;
  const span = (v) => Math.max(0, Math.min(100, (v / opts.max) * 100));
  // The middle half sits inside the tenth to ninetieth, because the
  // middle half on its own reads as a steady player: it covers 0.72 of
  // a man's own average where his weeks actually run 1.27 across.
  const tail = r && r.tailLow !== undefined
    ? '<span class="tail" style="left:' + span(r.tailLow) +
      "%; width:" + (span(r.tailHigh) - span(r.tailLow)) + '%"></span>'
    : "";
  const range = r
    ? '<div class="range">' + tail + '<span class="span" style="left:' + span(r.low) +
      "%; width:" + (span(r.high) - span(r.low)) + '%"></span>' +
      '<span class="mark" style="left:' + span(r.mid) + '%"></span></div>' +
      '<div class="rangenum"><span>' +
      (r.tailLow !== undefined ? r.tailLow.toFixed(1) : r.low.toFixed(1)) +
      "</span><span>" +
      (r.tailHigh !== undefined ? r.tailHigh.toFixed(1) : r.high.toFixed(1)) +
      "</span></div>"
    : "";
  const aside = opts.aside
    ? '<span class="val">' + opts.aside.label + " " +
      (opts.aside.asRound
        ? ordinal(Math.round(opts.aside.value))
        : opts.aside.value.toFixed(1)) + "</span>"
    : "";
  const tag = opts.tag
    ? '<div class="tag' + (opts.warn ? " warn" : "") + '">' + opts.tag + "</div>"
    : opts.hint
      ? '<div class="tag hint">' + opts.hint + "</div>"
      : "";
  const badge = opts.badge
    ? '<span class="badge ' + (opts.badgeHow ?? "") + '">' + opts.badge + "</span>"
    : "";
  /**
   * Opening the detail belongs on its own control. The whole card used
   * to take the click, so typing a keeper price opened the overlay
   * on top of the input.
   */
  const more = opts.plain
    ? ""
    : '<button class="more" title="more about him" aria-label="more">' +
      '<svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">' +
      '<circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" ' +
      'stroke-width="1.6"/><path d="M10 9v5M10 6.2v.1" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round"/></svg></button>';
  div.innerHTML =
    '<div class="top"><span class="nm"><span class="who">' + p.name +
    "</span>" + badge + more + "</span>" +
    '<span class="big">' + opts.value.toFixed(1) +
    '<em class="unit">' + opts.unit + "</em></span></div>" +
    '<div class="sub"><span>' + p.position + " &middot; " + (p.team ?? "") +
    (p.opponent ? " &middot; " + p.opponent : "") + "</span>" + aside + "</div>" +
    range + (opts.note ? '<div class="note">' + opts.note + "</div>" : "") + tag;
  if (opts.keeper) {
    const mark = document.createElement("button");
    mark.className = "keepbtn" + (opts.keeper.on ? " on" : "");
    mark.textContent = opts.keeper.on ? "kept" : "mark keeper";
    mark.addEventListener("click", (e) => {
      e.stopPropagation();
      const marked = markedKeepers();

      if (opts.keeper.on) {
        delete marked[opts.keeper.key];
      } else {
        marked[opts.keeper.key] = active ? active.team : true;
      }

      saveMarkedKeepers(marked);
      renderView();
    });
    div.appendChild(mark);
  }

  const button = div.querySelector(".more");

  if (button) {
    button.addEventListener("click", (e) => {
      e.stopPropagation();
      openDetail(p);
    });
  }

  return div;
}

/** pick 44 in a 12-team draft is how everyone says it: 4.08 */
function asRound(pick, teams = (active && active.size) || 12) {
  const overall = Math.max(1, Math.round(pick));
  const round = Math.ceil(overall / teams);
  return round + "." + String(overall - (round - 1) * teams).padStart(2, "0");
}

/** one game: what he scores this week, and how wrong that could be */
function weekCard(p, opts = {}) {
  return card(p, {
    ...opts,
    value: p.predicted,
    unit: "this week",
    range: { low: p.floor, mid: p.predicted, high: p.ceiling },
    aside: opts.aside ?? { label: "at best", value: p.ceiling },
    note: p.snaps + "% of snaps recently",
  });
}

/** the season: what he scores in a typical game, and how those vary */
/**
 * How many rounds of value the room is handing you, or charging you.
 *
 * Adp is an overall pick and our rank is a place in the same order, so
 * the two subtract. Under a round either way is noise in mock drafts.
 */
/**
 * The picks a drafter can plan around: where he is still on the board
 * three times in four, and where he is gone three times in four.
 *
 * The earliest and latest anyone has taken him are the two ends of
 * everything ever seen, which is far wider than a draft feels. Read
 * off the same slide the rest of the page uses for whether a man
 * lasts, the quarter points say when to stop counting on him.
 */
function usuallyAt(p) {
  const early = p.adpHigh;
  const late = p.adpLow;

  if (!early || !late || late <= early) {
    return "#" + p.adp.toFixed(1);
  }

  const spread = late - early;

  return "#" + p.adp.toFixed(1) + " " +
    Math.round(early + 0.25 * spread) + "-" +
    Math.round(early + 0.75 * spread);
}

function gapChip(p) {
  if (!p.rank || !p.adp) {
    return "";
  }

  const teams = (active && active.size) || 12;
  const rounds = Math.round(((p.adpRank ?? p.adp) - p.rank) / teams);

  if (rounds === 0) {
    return "";
  }

  return '<span class="chip ' + (rounds > 0 ? "up" : "down") + '">' +
    (rounds > 0 ? "+" : "") + rounds + " rd</span>";
}

function seasonCard(p, opts = {}) {
  const g = p.game;
  return card(p, {
    ...opts,
    value: g ? g.ev : p.ppg,
    unit: "pts/g",
    range: g
      ? {
          low: g.q1, mid: g.ev, high: g.q3,
          tailLow: g.low, tailHigh: g.high,
        }
      : undefined,
    note: '<span class="facts">' + [
      // no raw number beside ours: a rank is a whole pick, so the round
      // and the pick say the same thing twice
      p.rank ? '<span class="f"><i>ours</i>' + asRound(p.rank) + "</span>" : "",
      '<span class="f"' +
        (p.adp
          ? ' title="pick ' + p.adp.toFixed(1) + " overall on average. The " +
            "two picks after it are where he is still on the board three " +
            "times in four, and where he is gone three times in four" +
            '"'
          : "") +
        '><i>adp</i>' + (p.adpRank ? asRound(p.adpRank) : "&mdash;") +
        // marked as an overall pick, since 3.8 beside 1.03 otherwise
        // reads as the third round
        // the pick and the spread the room has shown, since a place
        // alone says nothing about how firmly it is held
        (p.adp ? '<small>' + usuallyAt(p) + "</small>" : "") + "</span>",
      opts.costs
        ? '<span class="f"><i>costs</i>' + ordinal(opts.costs) + "</span>"
        : "",
      gapChip(p),
      p.bye ? '<span class="f"><i>bye</i>' + p.bye + "</span>" : "",
    ].filter(Boolean).join("") + "</span>",
  });
}
