<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>depthchart</title>
<style>
  :root {
    --bg: #10141C; --panel: #1A2029; --edge: #2A3342; --ink: #E8ECF2;
    --muted: #8B95A5; --faint: #5B6575; --go: #35C06F; --mark: #F5B841;
    --chip: #232B38;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #EFF1F4; --panel: #FFFFFF; --edge: #D8DCE3; --ink: #171B22;
      --muted: #5A6270; --faint: #98A0AD; --go: #1E8A4C; --mark: #D99A16;
      --chip: #E7EAEF;
    }
  }
  * { box-sizing: border-box; }
  /* .controls sets display:flex, which would otherwise beat the attribute */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, sans-serif; line-height: 1.45; }
  .wrap { max-width: 64rem; margin: 0 auto; padding: 1rem 1rem 4rem; }
  nav { display: flex; gap: .4rem; align-items: center; margin: .5rem 0 1rem;
    flex-wrap: wrap; }
  nav .brand { margin-right: auto; font-weight: 800; font-size: 1.05rem;
    letter-spacing: -0.02em; cursor: pointer; }
  nav .brand b { color: var(--go); }
  #crumb { display: flex; gap: .5rem; align-items: center; font-size: .85rem;
    color: var(--muted); }
  #crumb b { color: var(--ink); }
  #crumb button { font: inherit; font-size: .78rem; background: var(--chip);
    color: var(--muted); border: none; border-radius: 999px;
    padding: .25rem .7rem; cursor: pointer; }
  #subnav { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: .8rem;
    border-bottom: 1px solid var(--edge); }
  #posfilter button { font: inherit; font-size: .78rem; font-weight: 600;
    background: var(--chip); color: var(--muted); border: none;
    border-radius: 999px; padding: .25rem .75rem; margin-right: .3rem;
    cursor: pointer; }
  #posfilter button.on { background: var(--go); color: #0C1117; }
  .clock { background: var(--panel); border: 1px solid var(--go);
    border-radius: 12px; padding: .7rem 1rem; margin-bottom: .9rem; }
  .clock .big { font-size: 1.05rem; font-weight: 700; }
  .clock .sub { color: var(--muted); font-size: .82rem; }
  #subnav button, nav button { font: inherit; font-size: .8rem; font-weight: 600;
    background: transparent; color: var(--muted); border: none;
    border-bottom: 2px solid transparent; padding: .35rem .7rem; cursor: pointer; }
  nav button.on { color: var(--ink); border-bottom-color: var(--go); }
  .controls { background: var(--panel); border: 1px solid var(--edge);
    border-radius: 10px; padding: .7rem 1rem; margin: 0 0 1rem;
    display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; }
  .controls label { color: var(--muted); font-size: .82rem; }
  input, select { font: inherit; font-size: .85rem; color: var(--ink);
    background: var(--bg); border: 1px solid var(--edge);
    padding: .3rem .5rem; border-radius: 7px; }
  button.act { font: inherit; font-size: .85rem; font-weight: 700;
    background: var(--go); color: #0C1117; border: none;
    padding: .4rem 1.1rem; border-radius: 999px; cursor: pointer; }
  button.act:hover { filter: brightness(1.12); }
  #status { color: var(--faint); font-size: .82rem; }
  #status.bad { color: var(--mark); font-weight: 600; }
  progress { width: 9rem; accent-color: var(--go); }
  textarea { width: 100%; height: 3rem; font: inherit; font-size: .85rem;
    color: var(--ink); background: var(--bg); border: 1px solid var(--edge);
    padding: .4rem; border-radius: 7px; }
  h2 { font-size: .78rem; margin: 1.3rem 0 .5rem; color: var(--faint);
    font-family: ui-monospace, Menlo, monospace; letter-spacing: .12em;
    text-transform: uppercase; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: .7rem; }
  .card { background: var(--panel); border: 1px solid var(--edge);
    border-radius: 12px; padding: .75rem .95rem; cursor: pointer; }
  .card.plain { cursor: default; }
  .card.mine { border-color: var(--go); }
  .card.kept { border-color: var(--go);
    background: color-mix(in srgb, var(--go) 9%, var(--panel));
    box-shadow: inset 4px 0 0 var(--go); }
  .card.gone { opacity: .45; }
  .badge { font-size: .6rem; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; color: #0C1117; background: var(--go);
    border-radius: 999px; padding: .1rem .45rem; margin-left: .4rem;
    vertical-align: .1em; }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; }
  .card .nm { font-weight: 700; font-size: .92rem; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .card .big { font-size: 1.35rem; font-weight: 800;
    font-variant-numeric: tabular-nums; display: flex; flex-direction: column;
    align-items: flex-end; line-height: 1.1; }
  .card .unit { font-size: .6rem; font-weight: 600; font-style: normal;
    color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }
  .card .val { color: var(--muted); font-weight: 700; white-space: nowrap; }
  .card .note { color: var(--faint); font-size: .72rem; margin-top: .35rem; }
  .rangenum { display: flex; justify-content: space-between; align-items: baseline;
    font-size: .78rem; font-weight: 700; color: var(--ink);
    font-variant-numeric: tabular-nums; margin-top: .3rem; }
  .rangenum span:nth-child(2) { color: var(--faint); font-size: .62rem;
    font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  .card .sub { color: var(--faint); font-size: .74rem;
    display: flex; justify-content: space-between; margin-top: .1rem; gap: .5rem; }
  .range { position: relative; height: 14px; background: var(--chip);
    border-radius: 999px; margin-top: .7rem; }
  /* the middle half, which is where he lands most weeks */
  .range .span { position: absolute; top: 0; bottom: 0;
    background: color-mix(in srgb, var(--go) 55%, var(--chip));
    border-radius: 999px; }
  .card.mine .range .span { background: color-mix(in srgb, var(--go) 70%, var(--chip)); }
  .range .mark { position: absolute; top: -4px; width: 4px; height: 22px;
    background: var(--mark); border-radius: 2px;
    box-shadow: 0 0 0 2px var(--panel); }
  .costrow { display: flex; align-items: center; gap: .4rem; margin-top: .5rem;
    color: var(--faint); font-size: .74rem; }
  .costrow input { width: 3.2rem; font-size: .8rem; padding: .2rem .35rem; }
  .pickline { grid-column: 1 / -1; display: flex; align-items: center;
    gap: .6rem; margin: .3rem 0; color: var(--mark); font-size: .72rem;
    font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .pickline::after { content: ""; flex: 1;
    border-top: 1px dashed var(--mark); opacity: .5; }
  .tag { font-size: .72rem; font-weight: 700; color: var(--go); margin-top: .45rem; }
  .tag.warn { color: var(--mark); }
  .tag.hint { color: var(--faint); font-weight: 500; }
  .hint { color: var(--faint); font-size: .78rem; }
  #explain h1 { font-size: 1.25rem; margin: .2rem 0 .15rem; }
  #explain p { color: var(--muted); font-size: .85rem; margin: 0 0 .9rem; }
  .empty { background: var(--panel); border: 1px dashed var(--edge);
    border-radius: 12px; padding: 1.2rem; color: var(--muted); font-size: .88rem; }
  .empty b { color: var(--ink); }
  .step { display: flex; gap: .5rem; align-items: baseline; margin: .35rem 0; }
  .step span:first-child { color: var(--go); font-weight: 700; }
  table.grid { border-collapse: collapse; font-size: .68rem; width: 100%;
    overflow-x: auto; display: block; background: var(--panel);
    border: 1px solid var(--edge); border-radius: 10px; }
  table.grid td, table.grid th { border: 1px solid var(--edge);
    padding: .25rem .4rem; white-space: nowrap; color: var(--muted); }
  table.grid th { color: var(--faint); font-weight: 600; }
  table.grid td.me { background: color-mix(in srgb, var(--go) 18%, var(--panel));
    color: var(--ink); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: flex-start; justify-content: center;
    padding: 2rem 1rem; overflow-y: auto; z-index: 10; }
  #overlay.open { display: flex; }
  .sheet { background: var(--panel); border: 1px solid var(--edge);
    border-radius: 14px; padding: 1.2rem 1.4rem; max-width: 34rem; width: 100%; }
  .sheet h3 { margin: 0; font-size: 1.15rem; }
  .sheet .sub { color: var(--faint); font-size: .8rem; margin-bottom: .8rem; }
  .wk { display: grid; grid-template-columns: 2.4rem 3.4rem 1fr 2.4rem;
    gap: .5rem; align-items: center; font-size: .75rem; color: var(--muted);
    padding: .1rem 0; }
  .wk .bar { height: 11px; position: relative; }
  .wk .bar u, .wk .bar i, .wk .bar b { position: absolute; }
  /* whisker: a bad week to a big one */
  .wk .bar u { top: 5px; height: 1px; background: var(--chip); }
  /* box: the middle half of outcomes */
  .wk .bar i { top: 2px; height: 7px; background: var(--go);
    opacity: .35; border-radius: 3px; }
  /* tick: the projection */
  .wk .bar b { top: 0; width: 2px; height: 11px; background: var(--go); }
  .wk .scale { grid-column: 3; display: flex; justify-content: space-between;
    color: var(--faint); font-size: .65rem; padding-top: .2rem; }
  .fact { font-size: .8rem; margin: .15rem 0; }
  .fact.p::before { content: "+ "; color: var(--go); font-weight: 700; }
  .fact.m::before { content: "- "; color: var(--mark); font-weight: 700; }
  .sheet .row { display: flex; gap: .6rem; margin-top: 1rem; }
  .league-card .nm { font-size: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <span class="brand" id="home">depth<b>chart</b></span>
    <span id="crumb"></span>
  </nav>

  <div id="subnav" hidden>
    <button data-view="roster">my roster</button>
    <button data-view="keepers">keeper value</button>
    <button data-view="draft">draft help</button>
    <button data-view="start">who to start</button>
    <button data-view="waivers">who to add</button>
  </div>

  <div id="explain">
    <h1 id="title"></h1>
    <p id="blurb"></p>
  </div>

  <div class="controls" id="ctl">
    <label id="userwrap">sleeper user <input id="username" size="12"></label>
    <label id="weekwrap" hidden>week <select id="week"></select></label>
    <label id="keepwrap" hidden>keepers per team
      <input id="keepn" type="number" value="3" min="0" max="6" style="width:3.2rem"></label>
    <span id="posfilter" hidden></span>
    <label id="searchwrap" hidden>find <input id="search" size="12" placeholder="a name"></label>
    <button class="act" id="go">find my leagues</button>
    <span id="status"></span>
    <progress id="prog" max="100" value="0" hidden></progress>
  </div>

  <div class="controls" id="manualwrap" hidden>
    <label class="hint" id="manualhint"></label>
    <textarea id="manual"></textarea>
  </div>

  <div id="out"></div>
  <p class="hint" id="legend"></p>
</div>

<div id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
const POSITIONS = ["QB", "RB", "WR", "TE"];
const STARTERS = { QB: 1, RB: 2, WR: 2, TE: 1 };
let view = "leagues";
let meta = null, board = null, boardByKey = null;
const slates = {};
let players = null;
let leagues = store_get("leagues", []);
let active = store_get("active", null); // {leagueId, name, team, userId}
let draftPoll = null;
let posFilter = "ALL";
let draftState = { taken: new Set(), teams: {}, mine: new Set(), rosteredBy: {}, grid: null, pickCount: undefined };

function store_get(key, fallback) {
  try { const raw = localStorage.getItem("dc." + key); return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function store_set(key, value) {
  try { localStorage.setItem("dc." + key, JSON.stringify(value)); } catch {}
}

const $ = (id) => document.getElementById(id);
const norm = (n) => (n ?? "").toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?$/, "").replace(/[^a-z]/g, "");
const api = (path) => fetch("https://api.sleeper.app/v1" + path).then((r) => r.json());

async function sleeperPlayers() {
  if (players) return players;
  // v2 keys the trimmed shape; an older cache used different field names
  const cached = store_get("players.v2", null);
  if (cached) { players = cached; return cached; }
  try { localStorage.removeItem("dc.players"); } catch {}
  $("status").textContent = "fetching player list (5MB, once ever)...";
  $("prog").hidden = false; $("prog").value = 40;
  const raw = await api("/players/nfl");
  $("prog").hidden = true;
  const trimmed = {};
  for (const [id, p] of Object.entries(raw)) {
    if (p.full_name && p.position) trimmed[id] = { n: p.full_name, p: p.position };
  }
  store_set("players.v2", trimmed);
  players = trimmed;
  return trimmed;
}

function keeperKeyFor(league) { return "keepers." + league; }
function markedKeepers() { return active ? store_get(keeperKeyFor(active.leagueId), {}) : {}; }
function saveMarkedKeepers(map) { if (active) store_set(keeperKeyFor(active.leagueId), map); }

async function boot() {
  const bust = "?v=" + Math.floor(Date.now() / 60000);
  meta = await (await fetch("data/index.json" + bust)).json();
  window.__bust = bust;
  for (const entry of meta.weeks) {
    const option = document.createElement("option");
    option.value = entry.season + "|" + entry.week;
    option.textContent = entry.season + " week " + entry.week;
    $("week").appendChild(option);
  }
  const latest = meta.weeks.at(-1);

  if (latest) {
    $("week").value = latest.season + "|" + latest.week;
  }

  const saved = store_get("settings", null);

  if (saved) {
    $("username").value = saved.username ?? "";
    $("manual").value = saved.manual ?? "";
    $("keepn").value = saved.keepn ?? 3;
    if (saved.week && [...$("week").options].some((o) => o.value === saved.week)) $("week").value = saved.week;
  }
  const fallbackView = meta.weeks.length ? "start" : "draft";
  setView(active ? (saved && saved.view ? saved.view : fallbackView) : "leagues");
  if (view === "leagues" && leagues.length) renderLeagues();
}

function saveSettings() {
  store_set("settings", { username: $("username").value, manual: $("manual").value,
    keepn: $("keepn").value, week: $("week").value, view });
}

function setView(next) {
  if (next !== "leagues" && !active) next = "leagues";
  view = next;
  $("subnav").hidden = next === "leagues";
  $("crumb").innerHTML = active && next !== "leagues"
    ? '<button id="back">all leagues</button><b>' + active.name + "</b><span>you: " + active.team + "</span>"
    : "";

  if ($("back")) {
    $("back").addEventListener("click", () => { setView("leagues"); renderLeagues(); });
  }

  for (const b of document.querySelectorAll("#subnav button")) b.classList.toggle("on", b.dataset.view === next);
  applyToolbar(next);
  const preseason = (next === "start" || next === "waivers") && !meta.weeks.length;

  if (preseason) {
    $("manualwrap").hidden = true;
  }
  const copy = {
    leagues: ["My leagues",
      "Type your Sleeper username, then tap a league to open it. Draft help, lineups, and waivers all live inside a league.",
      ""],
    roster: ["My roster",
      "Everyone Sleeper currently has on your team, with this season's projection for each.",
      "Before a keeper draft this is last season's roster until the league clears it. Each card shows points in a typical game and the middle half of his weeks. Tap a player for the season distribution and to mark a keeper."],
    keepers: ["Keeper value",
      "The most a player is worth keeping for. Paying a round for him means giving up that pick, so he is worth it only while he beats whoever you could take with it.",
      "Type what your league charges and each card says whether to keep him. A player worth a 5th and costing a 9th is a bargain; one costing a 2nd is not."],
    draft: ["Draft help",
      "Live board for draft night. It watches your league's draft, removes players as they go, and ranks who is left by what your roster still needs.",
      "The big number is value over a replacement starter, weighted by the slots your draft roster still needs. Underneath is what he scores in a typical game and the middle half of his weeks. Players stay on the board until they are actually kept or drafted."],
    start: ["Who to start",
      "Your roster for one week, ranked by projected points, so you can set a lineup.",
      "The bar shows the range from a bad week to a great one; the gold mark is the projection. Tap a card for the week-by-week season and what is helping or hurting."],
    waivers: ["Who to add",
      "Your players next to the best available at each position, so you can see whether a pickup is an upgrade.",
      "A green tag means that player projects clearly ahead of your weakest starter at the spot."],
  }[next] ?? ["", "", ""];
  $("title").textContent = copy[0];
  $("blurb").textContent = copy[1];
  $("legend").textContent = preseason ? "" : copy[2];
  $("out").innerHTML = "";
  if (draftPoll && next !== "draft") { clearInterval(draftPoll); draftPoll = null; }
  refreshGoLabel();
  if (next === "leagues" && leagues.length) renderLeagues();
  if (next === "keepers") renderKeepers();
}

/*
 * Each section needs different controls, so each declares its own
 * instead of sharing one bar and hiding pieces of it. `action` is what
 * the button does here, said in the section's own words.
 */
const TOOLBARS = {
  leagues: {
    fields: ["userwrap"],
    action: "find my leagues",
  },
  roster: {
    fields: [],
    action: "reload from sleeper",
  },
  keepers: {
    fields: [],
    action: "work it out again",
  },
  draft: {
    fields: ["keepwrap", "posfilter", "searchwrap"],
    action: null,
    manual: "extra names to mark as taken, one per line",
  },
  start: {
    fields: ["weekwrap"],
    action: "load this week",
    manual: "no sleeper league? paste your roster, one name per line",
  },
  waivers: {
    fields: ["weekwrap"],
    action: "load this week",
    manual: "no sleeper league? paste your roster, one name per line",
  },
};

const TOOLBAR_FIELDS = ["userwrap", "weekwrap", "keepwrap", "posfilter", "searchwrap"];

function applyToolbar(next) {
  const bar = TOOLBARS[next] ?? { fields: [], action: null };
  const weekMissing = bar.fields.includes("weekwrap") && !meta.weeks.length;

  for (const field of TOOLBAR_FIELDS) {
    $(field).hidden = !bar.fields.includes(field) || (field === "weekwrap" && weekMissing);
  }

  $("go").hidden = !bar.action && next !== "draft";
  $("ctl").hidden = weekMissing ||
    (!bar.fields.length && !bar.action && next !== "draft");
  $("manualwrap").hidden = !bar.manual;
  $("manualhint").textContent = bar.manual ?? "";
}

function refreshGoLabel() {
  if (view !== "draft") {
    $("go").textContent = TOOLBARS[view]?.action ?? "refresh";
    return;
  }

  $("go").textContent = draftPoll
    ? "pause watching"
    : store_get("draftState", null) ? "resume draft" : "start watching the draft";
}

async function loadLeagues() {
  const username = $("username").value.trim();
  if (!username) { $("status").textContent = "type your sleeper username"; return; }
  $("status").textContent = "finding leagues...";
  const user = await api("/user/" + username);
  if (!user || !user.user_id) { $("status").textContent = "no such user"; return; }
  const state = await api("/state/nfl");
  const found = await api("/user/" + user.user_id + "/leagues/nfl/" + state.season);
  const playerMap = await sleeperPlayers();
  leagues = [];

  for (const lg of found ?? []) {
    const [rosters, users] = await Promise.all([
      api("/league/" + lg.league_id + "/rosters"),
      api("/league/" + lg.league_id + "/users"),
    ]);
    const mine = rosters.find((r) => r.owner_id === user.user_id);
    const nameOf = new Map(users.map((u) => [u.user_id, u.display_name]));
    leagues.push({
      members: Object.fromEntries(users.map((u) => [u.user_id, u.display_name])),
      leagueId: lg.league_id, name: lg.name, size: lg.total_rosters,
      userId: user.user_id, team: nameOf.get(user.user_id) ?? username,
      myRoster: (mine && mine.players ? mine.players : [])
        .map((id) => playerMap[id]).filter((p) => p && p.n).map((p) => ({ name: p.n, key: norm(p.n) })),
      allRosters: rosters.map((r) => ({
        owner: nameOf.get(r.owner_id) ?? r.owner_id,
        keys: (r.players ?? []).map((id) => playerMap[id]).filter((p) => p && p.n)
          .map((p) => ({ name: p.n, key: norm(p.n), pos: p.p })),
      })),
    });
  }

  store_set("leagues", leagues);
  $("status").textContent = "";
  renderLeagues();
}

function renderLeagues() {
  const out = $("out");
  out.innerHTML = "";

  if (!leagues.length) {
    out.innerHTML = '<div class="empty"><b>Start here.</b>' +
      '<div class="step"><span>1</span><span>Type your Sleeper username above.</span></div>' +
      '<div class="step"><span>2</span><span>Press load. Your leagues appear as cards.</span></div>' +
      '<div class="step"><span>3</span><span>Tap a league, then use draft help, who to start, or who to add.</span></div></div>';
    return;
  }
  const h = document.createElement("h2");
  h.textContent = "your leagues";
  out.appendChild(h);
  const grid = document.createElement("div");
  grid.className = "cards";

  for (const lg of leagues) {
    const div = document.createElement("div");
    div.className = "card league-card" + (active && active.leagueId === lg.leagueId ? " mine" : "");
    div.innerHTML = '<div class="nm">' + lg.name + '</div><div class="sub"><span>' +
      lg.size + ' teams</span><span>you: ' + lg.team + "</span></div>";
    div.addEventListener("click", async () => {
      active = lg;
      store_set("active", active);
      setView(meta.weeks.length ? "start" : "draft");
      if (meta.weeks.length) await renderStart();
      else await renderDraftView();
      refreshGoLabel();
    });
    grid.appendChild(div);
  }

  out.appendChild(grid);
}

function boardLookup(key) {
  if (!boardByKey) return null;
  return boardByKey.get(key) ?? [...boardByKey.entries()].find(([k]) => k.includes(key) || key.includes(k))?.[1] ?? null;
}

/*
 * One row per week, drawn as a box and whisker rather than a filled bar.
 * The season's per-game quantiles give the shape of a single week; each
 * week stretches that shape by its own projection, so a soft matchup
 * shows a lower box and a shorter tail, not only a shorter bar.
 */
function weeklyRows(b) {
  const games = b.weeks ?? [];

  if (!games.length) {
    return "";
  }

  const g = b.game;
  const spread = g && g.ev > 0
    ? { low: g.low / g.ev, q1: g.q1 / g.ev, q3: g.q3 / g.ev, high: g.high / g.ev }
    : { low: 1, q1: 1, q3: 1, high: 1 };
  const max = Math.max(...games.map((w) => w.pts * spread.high)) || 1;
  const pct = (v) => (v / max) * 100;

  const rows = games.map((w) => {
    const low = pct(w.pts * spread.low);
    const q1 = pct(w.pts * spread.q1);
    const q3 = pct(w.pts * spread.q3);
    const high = pct(w.pts * spread.high);
    return '<div class="wk"><span>w' + w.w + "</span><span>" + w.opp +
      '</span><span class="bar">' +
      '<u style="left:' + low + "%;right:" + (100 - high) + '%"></u>' +
      '<i style="left:' + q1 + "%;right:" + (100 - q3) + '%"></i>' +
      '<b style="left:' + pct(w.pts) + '%"></b>' +
      "</span><span>" + w.pts.toFixed(1) + "</span></div>";
  }).join("");

  return rows +
    '<div class="wk"><span></span><span></span><div class="scale"><span>0</span><span>' +
    (max / 2).toFixed(0) + "</span><span>" + max.toFixed(0) +
    "</span></div><span></span></div>";
}

function ownerOf(key) {
  if (!active) return null;
  for (const r of active.allRosters) if (r.keys.some((k) => k.key === key)) return r.owner;
  return null;
}

/*
 * Every card states what its big number measures. The two views answer
 * different questions, so they get different cards: a week card is
 * points in one game, a season card is points a game across the year.
 * Passing a bare number with no unit is what let a draft score and a
 * weekly projection look identical on screen.
 */
/** one scale for every season card on screen, so the bars compare */
function seasonScale(players) {
  return Math.max(12, ...players.map((p) => (p.game ? p.game.q3 : p.ppg) ?? 0)) * 1.05;
}

function card(p, opts) {
  const div = document.createElement("div");
  div.className = "card" + (opts.mine ? " mine" : "") +
    (opts.kept ? " kept" : "") + (opts.gone ? " gone" : "");
  const r = opts.range;
  const span = (v) => Math.max(0, Math.min(100, (v / opts.max) * 100));
  const range = r
    ? '<div class="range"><span class="span" style="left:' + span(r.low) +
      "%; width:" + (span(r.high) - span(r.low)) + '%"></span>' +
      '<span class="mark" style="left:' + span(r.mid) + '%"></span></div>' +
      '<div class="rangenum"><span>' + r.low.toFixed(1) + "</span><span>" +
      r.label + "</span><span>" + r.high.toFixed(1) + "</span></div>"
    : "";
  const aside = opts.aside
    ? '<span class="val">' + opts.aside.label + " " + opts.aside.value.toFixed(1) + "</span>"
    : "";
  const tag = opts.tag
    ? '<div class="tag' + (opts.warn ? " warn" : "") + '">' + opts.tag + "</div>"
    : opts.hint
      ? '<div class="tag hint">' + opts.hint + "</div>"
      : "";
  const badge = opts.badge ? '<span class="badge">' + opts.badge + "</span>" : "";
  div.innerHTML =
    '<div class="top"><span class="nm">' + p.name + badge + '</span>' +
    '<span class="big">' + opts.value.toFixed(1) +
    '<em class="unit">' + opts.unit + "</em></span></div>" +
    '<div class="sub"><span>' + p.position + " &middot; " + (p.team ?? "") +
    (p.opponent ? " &middot; " + p.opponent : "") + "</span>" + aside + "</div>" +
    range + (opts.note ? '<div class="note">' + opts.note + "</div>" : "") + tag;
  div.addEventListener("click", () => openDetail(p));
  return div;
}

/** pick 44 in a 12-team draft is how everyone says it: 4.08 */
function asRound(pick, teams = 12) {
  const overall = Math.max(1, Math.round(pick));
  const round = Math.ceil(overall / teams);
  return round + "." + String(overall - (round - 1) * teams).padStart(2, "0");
}

/** one game: what he scores this week, and how wrong that could be */
function weekCard(p, opts = {}) {
  return card(p, {
    ...opts,
    value: p.predicted,
    unit: "this week",
    range: { low: p.floor, mid: p.predicted, high: p.ceiling, label: "floor to ceiling" },
    note: p.snaps + "% of snaps recently",
  });
}

/** the season: what he scores in a typical game, and how those vary */
function seasonCard(p, opts = {}) {
  const g = p.game;
  return card(p, {
    ...opts,
    value: g ? g.ev : p.ppg,
    unit: "a game",
    range: g
      ? { low: g.q1, mid: g.ev, high: g.q3, label: "middle half of games" }
      : undefined,
    note: [
      p.adp
        ? "goes " + asRound(p.adp) +
          (p.adpHigh ? " in PPR mocks, " + asRound(p.adpHigh) + " to " + asRound(p.adpLow) : " in PPR mocks")
        : "undrafted in mocks",
      p.bye ? "bye " + p.bye : "",
    ].filter(Boolean).join(" &middot; "),
  });
}

/** 1st, 2nd, 3rd, 4th, and the teens which all take th */
function ordinal(n) {
  if (n % 100 >= 11 && n % 100 <= 13) return n + "th";
  return n + (["th", "st", "nd", "rd"][n % 10] ?? "th");
}

/**
 * What you could still take with a given pick.
 *
 * Best available falls as the rounds pass, so a player is worth
 * keeping for round R only while he beats whoever is left at that
 * pick. Reading the market's own draft order is the closest thing to
 * knowing who will be there.
 */
function bestLeftAt(pick, taken, exclude) {
  let best = null;

  for (const p of board.players) {
    // he cannot be his own alternative, and a man already kept is not
    // in the draft at all
    if (p.key === exclude || taken.has(p.key) || !p.adp) continue;
    // the market expects him around his own draft position, so anyone
    // going later than this pick should still be there
    if (p.adp < pick) continue;
    if (!best || p.vor > best.vor) best = p;
  }

  return best;
}

/** the earliest round he still beats what that pick would buy */
function worthUpTo(player, teams, taken) {
  for (let round = 1; round <= 15; round++) {
    const pick = (round - 1) * teams + Math.ceil(teams / 2);
    const instead = bestLeftAt(pick, taken, player.key);
    if (!instead || player.vor >= instead.vor) return { round, instead };
  }

  return { round: 16, instead: null };
}

function keeperCosts() {
  return store_get("keeperCost." + (active ? active.leagueId : "none"), {});

function saveKeeperCost(key, round) {

async function renderKeepers() {

    board = await (await fetch("data/board-" + meta.boardSeason + ".json" + (window.__bust ?? ""))).json();
    boardByKey = new Map(board.players.map((p) => [p.key, p]));

    out.innerHTML = '<div class="empty"><b>No league selected.</b> Open <b>all leagues</b> and tap one.</div>';
    return;
  }

  const teams = active.size || 12;
  // Only men actually kept are out of the pool. In a keeper league
  // everyone else on a roster goes back into the draft, so treating a
  // whole roster as unavailable would empty the board.
  const taken = new Set(Object.keys(markedKeepers()));

  const costs = keeperCosts();
  const mine = active.myRoster
    .map((r) => boardLookup(r.key))
    .filter(Boolean)
    .map((p) => ({ p, ...worthUpTo(p, teams, taken) }))
    .sort((a, b) => a.round - b.round);

  const head = document.createElement("div");
  head.className = "empty";

    "earliest pick he still beats. Type what your league charges and the card says " +
    "whether to keep him.";
  out.appendChild(head);

  const grid = document.createElement("div");
  grid.className = "cards";
  const seasonMax = seasonScale(mine.map((m) => m.p));

  for (const { p, round, instead } of mine) {
    const cost = Number(costs[p.key]) || 0;
    const verdict = !cost ? ""
      : cost > round ? "keep him, he is worth a " + ordinal(round)
      : cost === round ? "line ball at a " + ordinal(cost)
      : "let him go, he is only worth a " + ordinal(round);

    const card = seasonCard(p, {
      max: seasonMax,
      aside: { label: "worth a", value: round },
      tag: cost && cost > round ? verdict : "",
      hint: cost ? (cost > round ? "" : verdict) : "",
      note: (instead
        ? "at a " + ordinal(round) + " you would otherwise get " + instead.name
        : "worth keeping at any price") +
        (p.adp ? " &middot; goes " + asRound(p.adp) + " in mocks" : ""),
    });

    const row = document.createElement("label");
    row.className = "costrow";
    row.innerHTML = "costs a <input type=\"number\" min=\"1\" max=\"15\" " +
      "value=\"" + (cost || "") + "\" placeholder=\"?\"> round";
    row.querySelector("input").addEventListener("change", (e) => {
      saveKeeperCost(p.key, Number(e.target.value));
      renderKeepers();
    });
    card.appendChild(row);
    grid.appendChild(card);
  }

  out.appendChild(grid);
}

function picksUntil(mySlot, overall, teams, rounds) {
  for (let n = overall; n <= teams * rounds; n++) {
    const round = Math.ceil(n / teams);
    const inRound = n - (round - 1) * teams;
    const slot = round % 2 === 1 ? inRound : teams - inRound + 1;
    if (slot === mySlot) return n - overall;
  }

  return null;
}

/** your remaining picks in a snake draft, earliest first */
function myUpcomingPicks(grid, fromOverall) {
  if (!grid || !grid.mySlot) {
    return [];
  }

  const picks = [];

  for (let n = fromOverall; n <= grid.teams * grid.rounds; n++) {
    const round = Math.ceil(n / grid.teams);
    const inRound = n - (round - 1) * grid.teams;
    const slot = round % 2 === 1 ? inRound : grid.teams - inRound + 1;

    if (slot === grid.mySlot) {
      picks.push({ overall: n, round, label: round + "." + String(grid.mySlot).padStart(2, "0") });
    }
  }

  return picks;
}

function needFactor(position, count) {
  const starters = STARTERS[position] ?? 0;
  if (count < starters) return 1;
  if (position === "RB" || position === "WR") return count < starters + 2 ? 0.6 : 0.35;
  return 0.2;
}

async function pollDraft() {
  const playerMap = await sleeperPlayers();
  const marked = markedKeepers();
  const state = { taken: new Set(Object.keys(marked)), teams: {}, mine: new Set(), rosteredBy: {}, grid: null, pickCount: undefined };
  const manual = $("manual").value.trim();
  for (const line of manual ? manual.split("\n") : []) if (line.trim()) state.taken.add(norm(line));

  for (const [key, owner] of Object.entries(marked)) {
    (state.teams[owner] = state.teams[owner] ?? []).push((boardLookup(key)?.name ?? key) + " (keeper)");
    if (active && owner === active.team) state.mine.add(key);
  }

  let draft = null, picks = [];

  if (active) {
    const drafts = await api("/league/" + active.leagueId + "/drafts");
    if (drafts && drafts[0]) {
      draft = await api("/draft/" + drafts[0].draft_id);
      picks = await api("/draft/" + drafts[0].draft_id + "/picks");
    }
  }

  const keeperPicksExist = picks.some((p) => p.is_keeper);

  for (const pick of picks) {
    const p = playerMap[pick.player_id];
    if (!p || !p.n) continue;
    const key = norm(p.n);
    state.taken.add(key);
    const owner = pick.picked_by && active && pick.picked_by === active.userId ? active.team
      : "slot " + pick.draft_slot;
    (state.teams[owner] = state.teams[owner] ?? []).push(p.n + (pick.is_keeper ? " (keeper)" : ""));
    if (active && pick.picked_by === active.userId) state.mine.add(key);
  }

  // who each player sat with last season, shown as a note only; nobody
  // leaves the board without an actual keeper pick or a manual mark
  if (active) {
    for (const r of active.allRosters) {
      for (const k of r.keys) state.rosteredBy[k.key] = r.owner;
    }
  }

  if (draft) {
    const teams = draft.settings?.teams ?? active?.size ?? 12;
    const rounds = draft.settings?.rounds ?? 15;
    const mySlot = draft.draft_order ? draft.draft_order[active.userId] : null;
    state.grid = { rounds, teams, cells: {}, mySlot };

    for (const pick of picks) {
      const p = playerMap[pick.player_id];
      state.grid.cells[pick.round + "|" + pick.draft_slot] = p ? p.n.split(" ").at(-1) : "?";
    }

    state.pickCount = picks.length;
    state.status = draft.status;

    const overall = picks.length + 1;
    const round = Math.ceil(overall / teams);
    const inRound = overall - (round - 1) * teams;
    const slot = round % 2 === 1 ? inRound : teams - inRound + 1;
    const slotToUser = {};

    for (const [userId, s] of Object.entries(draft.draft_order ?? {})) slotToUser[s] = userId;

    state.clock = {
      round, slot, overall,
      who: active.members?.[slotToUser[slot]] ?? "slot " + slot,
      mine: mySlot === slot,
      untilMine: mySlot ? picksUntil(mySlot, overall, teams, rounds) : null,
    };
  }

  draftState = state;
  store_set("draftState", { ...state, taken: [...state.taken], mine: [...state.mine], at: new Date().toISOString().slice(0, 16).replace("T", " ") });
  renderDraft();
}

function renderDraft(staleAt) {
  if (!board) return;
  const out = $("out");
  out.innerHTML = "";
  const s = draftState;
  const counts = { QB: 0, RB: 0, WR: 0, TE: 0 };
  const mineList = [];

  for (const p of board.players) {
    if (s.mine.has(p.key)) { counts[p.position] = (counts[p.position] ?? 0) + 1; mineList.push(p); }
  }

  if (s.status || s.clock) {
    const banner = document.createElement("div");
    banner.className = "clock";
    const started = s.status === "drafting";
    const done = s.status === "complete";
    banner.innerHTML = done
      ? '<div class="big">Draft complete</div>'
      : started
        ? '<div class="big">' + (s.clock.mine ? "You are on the clock" : s.clock.who + " is picking") +
          '</div><div class="sub">round ' + s.clock.round + ", pick " + s.clock.overall +
          (s.clock.untilMine !== null && !s.clock.mine ? " &middot; " + s.clock.untilMine + " until your turn" : "") + "</div>"
        : '<div class="big">Draft has not started</div><div class="sub">' +
          (s.clock && s.clock.mine !== undefined && s.grid && s.grid.mySlot ? "you pick from slot " + s.grid.mySlot : "waiting for the commissioner") + "</div>";
    out.appendChild(banner);
  }

  const h = document.createElement("h2");
  h.textContent = "best available for your draft roster" + (staleAt ? " as of " + staleAt : "");
  out.appendChild(h);

  const query = norm($("search").value ?? "");
  const scored = board.players
    .filter((p) => !s.taken.has(p.key))
    .filter((p) => posFilter === "ALL" || p.position === posFilter)
    .filter((p) => !query || p.key.includes(query))
    .map((p) => ({ p, score: p.vor * needFactor(p.position, counts[p.position] ?? 0) }))
    .sort((a, b) => b.score - a.score);

  const grid = document.createElement("div");
  grid.className = "cards";
  let shown = 0;
  const seasonMax = seasonScale(scored.slice(0, 20).map(({ p }) => p));
  // Where your own picks fall in this list. Everyone above a line is
  // expected to be gone by the time that pick comes around.
  const upcoming = myUpcomingPicks(s.grid, s.clock ? s.clock.overall : 1);
  let nextPick = 0;

  for (const { p, score } of scored) {
    if (shown >= 20) break;

    while (nextPick < upcoming.length && p.adp && p.adp > upcoming[nextPick].overall) {
      const line = document.createElement("div");
      line.className = "pickline";
      line.innerHTML = "<span>your " + upcoming[nextPick].label +
        ", pick " + upcoming[nextPick].overall + "</span>";
      grid.appendChild(line);
      nextPick++;
    }

    shown++;
    const lastYear = s.rosteredBy[p.key];
    grid.appendChild(seasonCard(p, {
      max: seasonMax,
      aside: { label: "value here", value: score },
      tag: shown <= 3
        ? "fills " + p.position
        : lastYear ? "was on " + lastYear + " last season" : "",
      warn: shown > 3 && !!lastYear,
    }));
  }

  out.appendChild(grid);

  if (s.grid) {
    const gh = document.createElement("h2");
    gh.textContent = "pick grid";
    out.appendChild(gh);
    const table = document.createElement("table");
    table.className = "grid";
    let header = "<tr><th></th>";
    for (let slot = 1; slot <= s.grid.teams; slot++) header += "<th>" + (slot === s.grid.mySlot ? "you" : slot) + "</th>";
    let body = header + "</tr>";
    for (let round = 1; round <= s.grid.rounds; round++) {
      body += "<tr><th>r" + round + "</th>";
      for (let slot = 1; slot <= s.grid.teams; slot++) {
        const cell = s.grid.cells[round + "|" + slot] ?? "";
        body += '<td class="' + (slot === s.grid.mySlot ? "me" : "") + '">' + cell + "</td>";
      }
      body += "</tr>";
    }
    table.innerHTML = body;
    out.appendChild(table);
  }

  const drafted = new Set(mineList.map((p) => p.key));
  const rosterNow = active
    ? active.myRoster
        .map((r) => boardLookup(r.key))
        .filter((p) => p && !drafted.has(p.key))
    : [];

  if (mineList.length === 0) {
    const mh = document.createElement("h2");
    mh.textContent = "your draft roster";
    out.appendChild(mh);
    const note = document.createElement("div");
    note.className = "empty";
    note.innerHTML = "Nothing yet. Mark keepers from <b>my roster</b> or tap a player here, and your picks land here as the draft runs.";
    out.appendChild(note);
  }

  if (mineList.length > 0) {
    const mh = document.createElement("h2");
    mh.textContent = "you drafted (" + Object.entries(counts).filter(([, c]) => c > 0).map(([pos, c]) => c + " " + pos).join(", ") + ")";
    out.appendChild(mh);
    const myGrid = document.createElement("div");
    myGrid.className = "cards";
    for (const p of mineList) myGrid.appendChild(seasonCard(p, { mine: true, max: seasonMax, aside: { label: "over replacement", value: p.vor } }));
    out.appendChild(myGrid);
  }

  if (rosterNow.length > 0) {
    const rh = document.createElement("h2");
    rh.textContent = "on your sleeper roster now (" + rosterNow.length + ")";
    out.appendChild(rh);
    const rGrid = document.createElement("div");
    rGrid.className = "cards";

    for (const p of rosterNow) {
      const isKept = !!markedKeepers()[p.key];
      rGrid.appendChild(seasonCard(p, {
        max: seasonMax,
        kept: isKept,
        badge: isKept ? "keeper" : "",
        aside: { label: "over replacement", value: p.vor },
        hint: isKept ? "" : "tap to mark as a keeper",
      }));
    }

    out.appendChild(rGrid);
  }

  const owners = Object.keys(s.teams);

  if (owners.length > 0) {
    const th = document.createElement("h2");
    th.textContent = "keepers and picks so far";
    out.appendChild(th);
    const teamGrid = document.createElement("div");
    teamGrid.className = "cards";
    for (const owner of owners) {
      const div = document.createElement("div");
      div.className = "card plain" + (active && owner === active.team ? " mine" : "");
      div.innerHTML = '<div class="nm">' + owner + '</div><div class="sub" style="display:block; margin-top:.3rem">' + s.teams[owner].join("<br>") + "</div>";
      teamGrid.appendChild(div);
    }
    out.appendChild(teamGrid);
  }
}

async function renderDraftView() {
  if (!board) {
    board = await (await fetch("data/board-" + meta.boardSeason + ".json" + (window.__bust ?? ""))).json();
    boardByKey = new Map(board.players.map((p) => [p.key, p]));
  }

  if (active) {
    $("status").textContent = "watching the draft, refreshing every 5s; pause anytime";
    await pollDraft();
    draftPoll = setInterval(pollDraft, 5000);
  } else {
    const saved = store_get("draftState", null);
    if (saved) {
      draftState = { ...saved, taken: new Set(saved.taken), mine: new Set(saved.mine) };
      renderDraft(saved.at);
      $("status").textContent = "saved state; pick a league on the leagues tab to refresh";
    } else {
      $("status").textContent = "pick a league on the leagues tab, or use the extra names box";
      draftState = { taken: new Set(), teams: {}, mine: new Set(), rosteredBy: {}, grid: null };
      renderDraft();
    }
  }
}

for (const label of ["ALL", ...POSITIONS]) {
  const button = document.createElement("button");
  button.textContent = label.toLowerCase();
  button.className = label === "ALL" ? "on" : "";
  button.addEventListener("click", () => {
    posFilter = label;
    for (const b of $("posfilter").children) b.classList.toggle("on", b.textContent === label.toLowerCase());
    renderDraft();
  });
  $("posfilter").appendChild(button);
}

$("search").addEventListener("input", () => { if (view === "draft") renderDraft(); });

document.querySelectorAll("#subnav button").forEach((b) =>
  b.addEventListener("click", async () => {
    await ready;
    if (!meta) return;
    setView(b.dataset.view);

    try {
      if (view === "start") await renderStart();
      else if (view === "roster") await renderRoster();
      else if (view === "waivers") await renderWaivers();
      else if (view === "keepers") await renderKeepers();
      else if (view === "draft") await renderDraftView();
    } catch (error) {
      $("status").textContent = String(error);
    }

    refreshGoLabel();
  }),
);
$("home").addEventListener("click", () => setView("leagues"));
$("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) $("overlay").classList.remove("open"); });

$("go").addEventListener("click", async () => {
  const status = $("status");
  try {
    status.className = "";
    status.textContent = "";
    if (view === "leagues") await loadLeagues();
    else if (view === "roster") await renderRoster();
    else if (view === "start") await renderStart();
    else if (view === "waivers") await renderWaivers();
    else if (view === "keepers") await renderKeepers();
    else if (draftPoll) { clearInterval(draftPoll); draftPoll = null; status.textContent = "paused"; }
    else await renderDraftView();
    refreshGoLabel();
    saveSettings();
  } catch (error) {
    status.className = "bad";
    status.textContent = String(error);
    $("prog").hidden = true;
  }
});

const ready = boot().catch((error) => {
  // a broken index should still leave a usable leagues page behind
  setView("leagues");
  $("status").className = "bad";
  $("status").textContent = "could not load projections: " + error;
});
</script>
</body>
</html>
