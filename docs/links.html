<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link test</title>
<style>
  :root { color-scheme: dark; --bg: #0f141b; --panel: #1a212b; --edge: #2b3440; --ink: #e8edf3; --muted: #9aa6b4; --go: #4cc38a; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 8px 0 4px; }
  p { color: var(--muted); margin: 4px 0 16px; }
  h2 { font-size: 1rem; margin: 20px 0 8px; }
  a.try { display: block; padding: 14px 16px; margin: 0 0 10px; border: 1px solid var(--edge); border-radius: 12px;
    background: var(--panel); color: var(--ink); text-decoration: none; }
  a.try b { color: var(--go); margin-right: 8px; }
  a.try small { display: block; color: var(--muted); font-size: .8rem; word-break: break-all; margin-top: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 8px; border-radius: 10px;
    border: 1px solid var(--edge); background: var(--panel); color: var(--ink); font: inherit; }
</style>
</head>
<body>
<main>
  <h1>Which link opens ESPN?</h1>
  <p>Tap each one, then come back here. Note for each: did it open the ESPN Fantasy app, and on which screen (your team, free agents, the matchup, the league, the app's home), or the browser, or the Play Store?</p>
  <div id="pick"></div>
  <div id="tries"></div>
</main>
<script>
  // the ESPN leagues the app has saved on this phone; an ESPN league's
  // userId is the team you picked in it
  let leagues = [];
  try {
    leagues = (JSON.parse(localStorage.getItem("dc.leagues") || "[]") || [])
      .filter((l) => l && l.provider === "espn" && l.leagueId);
  } catch (e) {}

  const pick = document.getElementById("pick");
  const tries = document.getElementById("tries");
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

  function show(league, team, season) {
    if (!league) {
      tries.innerHTML = "";
      return;
    }

    const L = encodeURIComponent(league);
    const T = encodeURIComponent(team || "1");
    const S = encodeURIComponent(season || "2026");
    const base = "https://fantasy.espn.com/football";
    const links = [
      ["A", "your team, the link the app uses now", `${base}/team?leagueId=${L}&teamId=${T}&seasonId=${S}`],
      ["B", "free agents, the link the app uses now", `${base}/players/add?leagueId=${L}&seasonId=${S}`],
      ["C", "this week's matchup", `${base}/fantasycast?leagueId=${L}&teamId=${T}&seasonId=${S}`],
      ["D", "the league", `${base}/league?leagueId=${L}&seasonId=${S}`],
      ["E", "your team, without the season", `${base}/team?leagueId=${L}&teamId=${T}`],
      ["F", "your team, straight to the app",
        `intent://fantasy.espn.com/football/team?leagueId=${L}&teamId=${T}&seasonId=${S}#Intent;scheme=https;package=com.espn.fantasy.lm.football;end`],
    ];
    tries.innerHTML = "<h2>Links</h2>" + links.map(([k, says, href]) =>
      `<a class="try" href="${esc(href)}"><b>${k}</b>${says}<small>${esc(href)}</small></a>`).join("");
  }

  if (leagues.length) {
    pick.innerHTML = "<p>League: " + leagues.map((l, i) =>
      `<label><input type="radio" name="lg" value="${i}" ${i === 0 ? "checked" : ""} style="width:auto"> ${esc(l.name || l.leagueId)}</label>`).join("<br>") + "</p>";
    const use = (l) => show(l.leagueId, l.userId, l.season);
    pick.addEventListener("change", (e) => use(leagues[Number(e.target.value)]));
    use(leagues[0]);
  } else {
    pick.innerHTML = '<p>No ESPN league saved here. Enter your league ID and team ID (both are in the address on ESPN\'s team page):</p>' +
      '<input id="lid" inputmode="numeric" placeholder="league ID"><input id="tid" inputmode="numeric" placeholder="team ID">';
    const read = () => show(document.getElementById("lid").value.trim(), document.getElementById("tid").value.trim(), "2026");
    document.getElementById("lid").addEventListener("input", read);
    document.getElementById("tid").addEventListener("input", read);
  }
</script>
</body>
</html>
