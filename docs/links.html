<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link test</title>
<style>
  :root { color-scheme: dark; --bg: #0f141b; --panel: #1a212b; --edge: #2b3440; --ink: #e8edf3; --muted: #9aa6b4; --go: #4cc38a; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 8px 0 4px; }
  p { color: var(--muted); margin: 4px 0 16px; }
  h2 { font-size: 1rem; margin: 20px 0 8px; }
  a.try { display: block; padding: 14px 16px; margin: 0 0 10px; border: 1px solid var(--edge); border-radius: 12px;
    background: var(--panel); color: var(--ink); text-decoration: none; }
  a.try b { color: var(--go); margin-right: 8px; }
  a.try small { display: block; color: var(--muted); font-size: .8rem; word-break: break-all; margin-top: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 1px solid var(--edge);
    background: var(--panel); color: var(--ink); font: inherit; }
</style>
</head>
<body>
<main>
  <h1>Which link opens Sleeper?</h1>
  <p>Tap each one, then come back here. Note for each: did it open the Sleeper app, and on which screen (your team, the league, the app's home), or the browser, or the Play Store?</p>
  <div id="pick"></div>
  <div id="tries"></div>
</main>
<script>
  // the leagues the app has saved on this phone, Sleeper's only
  let leagues = [];
  try {
    leagues = (JSON.parse(localStorage.getItem("dc.leagues") || "[]") || [])
      .filter((l) => l && l.provider === "sleeper" && l.leagueId);
  } catch (e) {}

  const pick = document.getElementById("pick");
  const tries = document.getElementById("tries");

  function show(id) {
    const L = encodeURIComponent(id);
    const links = [
      ["A", "the link the app uses now", `https://sleeper.com/leagues/${L}/team`],
      ["B", "Sleeper's app address, home", "sleeper://"],
      ["C", "Sleeper's app address, your team", `sleeper://leagues/${L}/team`],
      ["D", "Sleeper's app address, the league", `sleeper://league/${L}`],
      ["E", "straight to the app, your team", `intent://leagues/${L}/team#Intent;scheme=sleeper;package=com.sleeperbot;end`],
      ["F", "straight to the app, home", "intent://#Intent;scheme=sleeper;package=com.sleeperbot;end"],
      ["G", "a chat link, which the app takes on iPhone", "https://sleeper.com/channels"],
      ["H", "the league on sleeper.app", `https://sleeper.app/leagues/${L}/team`],
    ];
    tries.innerHTML = "<h2>Links</h2>" + links.map(([k, says, href]) =>
      `<a class="try" href="${href}"><b>${k}</b>${says}<small>${href.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</small></a>`).join("");
  }

  if (leagues.length) {
    pick.innerHTML = "<p>League: " + leagues.map((l, i) =>
      `<label><input type="radio" name="lg" value="${i}" ${i === 0 ? "checked" : ""} style="width:auto"> ${String(l.name || l.leagueId).replace(/</g, "&lt;")}</label>`).join("<br>") + "</p>";
    pick.addEventListener("change", (e) => show(leagues[Number(e.target.value)].leagueId));
    show(leagues[0].leagueId);
  } else {
    pick.innerHTML = '<p>No Sleeper league saved here. Paste your league ID:</p><input id="lid" inputmode="numeric" placeholder="league ID">';
    document.getElementById("lid").addEventListener("input", (e) => show(e.target.value.trim()));
  }
</script>
</body>
</html>
