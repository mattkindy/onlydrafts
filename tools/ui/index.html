<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>depthchart</title>
<style>
  :root {
    --bg: #10141C; --panel: #1A2029; --edge: #2A3342; --ink: #E8ECF2;
    --muted: #8B95A5; --faint: #5B6575; --go: #35C06F; --mark: #F5B841;
    --chip: #232B38;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #EFF1F4; --panel: #FFFFFF; --edge: #D8DCE3; --ink: #171B22;
      --muted: #5A6270; --faint: #98A0AD; --go: #1E8A4C; --mark: #D99A16;
      --chip: #E7EAEF;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, sans-serif; line-height: 1.45;
  }
  .wrap { max-width: 64rem; margin: 0 auto; padding: 1rem 1rem 4rem; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: .7rem;
    letter-spacing: .1em; text-transform: uppercase; }
  nav { display: flex; gap: .4rem; align-items: center; margin: .5rem 0 1rem; }
  nav .brand { margin-right: auto; font-weight: 800; font-size: 1.05rem;
    letter-spacing: -0.02em; }
  nav .brand b { color: var(--go); }
  nav button {
    font: inherit; font-size: .8rem; font-weight: 600;
    background: transparent; color: var(--muted);
    border: none; border-bottom: 2px solid transparent;
    padding: .35rem .7rem; cursor: pointer;
  }
  nav button.on { color: var(--ink); border-bottom-color: var(--go); }
  .controls { background: var(--panel); border: 1px solid var(--edge);
    border-radius: 10px; padding: .7rem 1rem; margin: 0 0 1rem;
    display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; }
  .controls label { color: var(--muted); font-size: .82rem; }
  input, select {
    font: inherit; font-size: .85rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--edge); padding: .3rem .5rem; border-radius: 7px;
  }
  button.act {
    font: inherit; font-size: .85rem; font-weight: 700;
    background: var(--go); color: #0C1117; border: none;
    padding: .4rem 1.1rem; border-radius: 999px; cursor: pointer;
  }
  button.act:hover { filter: brightness(1.12); }
  #status { color: var(--faint); font-size: .82rem; }
  progress { width: 9rem; accent-color: var(--go); }
  textarea { width: 100%; height: 3.2rem; font: inherit; font-size: .85rem;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--edge); padding: .4rem; border-radius: 7px; }
  h2 { font-size: .78rem; margin: 1.3rem 0 .5rem; color: var(--faint);
    font-family: ui-monospace, Menlo, monospace; letter-spacing: .12em;
    text-transform: uppercase; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: .7rem; }
  .card { background: var(--panel); border: 1px solid var(--edge);
    border-radius: 12px; padding: .75rem .95rem; }
  .card.mine { border-color: var(--go); }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; }
  .card .nm { font-weight: 700; font-size: .92rem; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .card .big { font-size: 1.35rem; font-weight: 800;
    font-variant-numeric: tabular-nums; }
  .card .sub { color: var(--faint); font-size: .74rem;
    display: flex; justify-content: space-between; margin-top: .1rem; }
  .range { position: relative; height: 8px; background: var(--chip);
    border-radius: 999px; margin-top: .6rem; }
  .range .span { position: absolute; top: 0; bottom: 0;
    background: var(--edge); border-radius: 999px; }
  .card.mine .range .span { background: color-mix(in srgb, var(--go) 45%, var(--chip)); }
  .range .mark { position: absolute; top: -3px; width: 3px; height: 14px;
    background: var(--mark); border-radius: 2px; }
  .tag { font-size: .72rem; font-weight: 700; color: var(--go); margin-top: .45rem; }
  .tag.warn { color: var(--mark); }
  .hint { color: var(--faint); font-size: .78rem; }
  .gone { opacity: .3; }
  @media (max-width: 640px) {
    nav { flex-wrap: wrap; }
    nav .brand { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <span class="brand">depth<b>chart</b></span>
    <button data-view="draft">draft</button>
    <button data-view="start" class="on">start</button>
    <button data-view="waivers">waivers</button>
    <button data-view="history">history</button>
  </nav>

  <div class="controls">
    <label id="weekwrap">week <select id="week"></select></label>
    <label>sleeper league <input id="league" size="14" placeholder="league id"></label>
    <label id="teamwrap" hidden>team <select id="team"></select></label>
    <label id="draftwrap" hidden>draft <input id="draftid" size="14" placeholder="draft id (auto)"></label>
    <button class="act" id="go">load</button>
    <span id="status"></span>
    <progress id="prog" max="100" value="0" hidden></progress>
  </div>

  <div class="controls" id="manualwrap" style="display:block">
    <label class="hint">no sleeper? paste your roster, one name per line</label>
    <textarea id="manual"></textarea>
  </div>

  <div id="out"></div>
  <p class="hint" id="legend"></p>
</div>

<script>
const POSITIONS = ["QB", "RB", "WR", "TE"];
const STARTERS = { QB: 1, RB: 2, WR: 2, TE: 1 };
let view = "start";
let meta = null;
let board = null;
const slates = {};
let sleeper = { players: null, rosters: null };
let draftPoll = null;
let taken = new Set();
let draftTeams = {};
let myDraftKeys = new Set();
let draftUsers = [];

const $ = (id) => document.getElementById(id);
const norm = (n) => n.toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?$/, "").replace(/[^a-z]/g, "");

const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem("dc." + key);
      return raw ? JSON.parse(raw) : fallback;
    } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem("dc." + key, JSON.stringify(value)); } catch {}
  },
};

function saveSettings() {
  store.set("settings", {
    league: $("league").value, draftId: $("draftid").value,
    team: $("team").value, manual: $("manual").value,
    week: $("week").value, view,
  });
}

function logHistory(note) {
  const history = store.get("history", []);
  history.unshift({ at: new Date().toISOString().slice(0, 16).replace("T", " "), view, week: $("week").value, note });
  store.set("history", history.slice(0, 50));
}

async function sleeperPlayers() {
  if (sleeper.players) return sleeper.players;
  const cached = store.get("players", null);
  if (cached) { sleeper.players = cached; return cached; }

  $("status").textContent = "fetching player list (5MB, once ever)...";
  $("prog").hidden = false;
  $("prog").value = 40;
  const raw = await fetch("https://api.sleeper.app/v1/players/nfl").then((r) => r.json());
  $("prog").hidden = true;
  const trimmed = {};

  for (const [id, p] of Object.entries(raw)) {
    if (p.full_name && p.position) trimmed[id] = { full_name: p.full_name, position: p.position };
  }

  store.set("players", trimmed);
  sleeper.players = trimmed;
  return trimmed;
}

async function boot() {
  meta = await (await fetch("data/index.json")).json();

  for (const entry of meta.weeks) {
    const option = document.createElement("option");
    option.value = `${entry.season}|${entry.week}`;
    option.textContent = `${entry.season} week ${entry.week}`;
    $("week").appendChild(option);
  }

  $("week").value = `${meta.weeks.at(-1).season}|${meta.weeks.at(-1).week}`;
  const saved = store.get("settings", null);

  if (saved) {
    $("league").value = saved.league ?? "";
    $("draftid").value = saved.draftId ?? "";
    $("manual").value = saved.manual ?? "";
    if (saved.week && [...$("week").options].some((o) => o.value === saved.week)) $("week").value = saved.week;
  }

  setView(saved && saved.view && saved.view !== "history" ? saved.view : "start");
}

function setView(next) {
  view = next;

  for (const button of document.querySelectorAll("nav button")) {
    button.classList.toggle("on", button.dataset.view === next);
  }

  $("weekwrap").hidden = next === "draft" || next === "history";
  $("draftwrap").hidden = next !== "draft";
  document.querySelector("#manualwrap .hint").textContent =
    next === "draft"
      ? "extra keepers to mark taken, one name per line (league keepers load automatically)"
      : "no sleeper? paste your roster, one name per line";
  $("legend").textContent =
    next === "draft"
      ? "cards rank by value over a replacement starter, weighted by what your roster still needs"
      : "bar spans floor to ceiling; the mark is the projection";
  $("out").innerHTML = "";

  if (draftPoll && next !== "draft") { clearInterval(draftPoll); draftPoll = null; }
  if (next === "history") renderHistory();
}

async function loadSleeper(leagueId) {
  $("status").textContent = "fetching league...";
  const [rosters, users] = await Promise.all([
    fetch(`https://api.sleeper.app/v1/league/${leagueId}/rosters`).then((r) => r.json()),
    fetch(`https://api.sleeper.app/v1/league/${leagueId}/users`).then((r) => r.json()),
  ]);
  const players = await sleeperPlayers();
  const nameOf = new Map(users.map((u) => [u.user_id, u.display_name]));
  draftUsers = users.map((u) => u.display_name);
  sleeper.rosters = rosters.map((r) => ({
    owner: nameOf.get(r.owner_id) ?? r.owner_id,
    keys: (r.players ?? [])
      .map((id) => players[id])
      .filter((p) => p && p.full_name)
      .map((p) => norm(p.full_name)),
  }));

  $("team").innerHTML = "";

  for (const r of sleeper.rosters) {
    const option = document.createElement("option");
    option.value = r.owner;
    option.textContent = r.owner;
    $("team").appendChild(option);
  }

  $("teamwrap").hidden = false;
  const saved = store.get("settings", null);
  if (saved && saved.team && sleeper.rosters.some((r) => r.owner === saved.team)) $("team").value = saved.team;
  $("status").textContent = "pick your team, then load again";
}

function myKeys() {
  const manual = $("manual").value.trim();
  if (manual) return new Set(manual.split("\n").map(norm).filter(Boolean));

  if (sleeper.rosters) {
    const roster = sleeper.rosters.find((r) => r.owner === $("team").value);
    return new Set(roster ? roster.keys : []);
  }

  return new Set();
}

const isMine = (mine, key) => [...mine].some((k) => key.includes(k) || k.includes(key));

function card(p, opts = {}) {
  const div = document.createElement("div");
  div.className = "card" + (opts.mine ? " mine" : "");
  const max = opts.max ?? 40;
  const range =
    p.floor !== undefined
      ? `<div class="range">
          <span class="span" style="left:${(p.floor / max) * 100}%; width:${((p.ceiling - p.floor) / max) * 100}%"></span>
          <span class="mark" style="left:${(p.predicted / max) * 100}%"></span>
        </div>`
      : "";
  const tag = opts.tag ? `<div class="tag${opts.warn ? " warn" : ""}">${opts.tag}</div>` : "";
  div.innerHTML = `
    <div class="top"><span class="nm">${p.name}</span><span class="big">${(p.predicted ?? p.vor).toFixed(1)}</span></div>
    <div class="sub"><span>${p.position} &middot; ${p.team}${p.opponent ? " &middot; " + p.opponent : ""}</span><span>${opts.sub ?? ""}</span></div>
    ${range}${tag}`;
  return div;
}

async function slateFor(key) {
  if (!slates[key]) {
    const parts = key.split("|");
    slates[key] = await (await fetch(`data/slate-${parts[0]}-${parts[1]}.json`)).json();
  }

  return slates[key];
}

async function renderStart() {
  const slate = await slateFor($("week").value);
  const mine = myKeys();
  const out = $("out");
  out.innerHTML = "";
  const max = Math.max(...slate.players.map((p) => p.ceiling));
  const starts = [];

  for (const position of POSITIONS) {
    const rows = slate.players.filter((p) => p.position === position);
    const owned = rows.filter((p) => isMine(mine, p.key));
    const shown = mine.size > 0 ? owned : rows.slice(0, 8);
    const h = document.createElement("h2");
    h.textContent = position;
    out.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "cards";

    for (const p of shown) grid.appendChild(card(p, { mine: mine.size > 0, max, sub: `${p.snaps}% snaps` }));

    out.appendChild(grid);
    if (mine.size > 0 && owned[0]) starts.push(`${position}: ${owned[0].name} ${owned[0].predicted.toFixed(1)}`);
  }

  if (starts.length > 0) logHistory(`starts: ${starts.join("; ")}`);
}

async function renderWaivers() {
  const slate = await slateFor($("week").value);
  const mine = myKeys();
  const out = $("out");
  out.innerHTML = "";
  const max = Math.max(...slate.players.map((p) => p.ceiling));
  const suggestions = [];

  if (mine.size === 0) {
    out.innerHTML = '<p class="hint">connect a league or paste a roster to compare against free agents</p>';
    return;
  }

  for (const position of POSITIONS) {
    const rows = slate.players.filter((p) => p.position === position);
    const owned = rows.filter((p) => isMine(mine, p.key));
    const worst = owned.at(-1);
    const outside = rows.filter((p) => !owned.includes(p)).slice(0, 6);
    const h = document.createElement("h2");
    h.textContent = position;
    out.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "cards";

    for (const p of owned) grid.appendChild(card(p, { mine: true, max, sub: `${p.snaps}% snaps` }));

    for (const p of outside) {
      const gain = worst ? p.predicted - worst.predicted : 0;
      if (worst && gain > 2) suggestions.push(`${p.name} +${gain.toFixed(1)} over ${worst.name}`);
      grid.appendChild(card(p, { max, sub: `${p.snaps}% snaps`, tag: worst && gain > 2 ? `+${gain.toFixed(1)} over ${worst.name}` : "" }));
    }

    out.appendChild(grid);
  }

  logHistory(suggestions.length > 0 ? `waiver ideas: ${suggestions.slice(0, 3).join("; ")}` : "no waiver moves clear the bar");
}

async function findDraftId(leagueId) {
  const drafts = await fetch(`https://api.sleeper.app/v1/league/${leagueId}/drafts`).then((r) => r.json());
  return drafts && drafts[0] ? drafts[0].draft_id : null;
}

function manualTaken() {
  const manual = $("manual").value.trim();
  return manual ? manual.split("\n").map(norm).filter(Boolean) : [];
}

function needFactor(position, count) {
  const starters = STARTERS[position] ?? 0;
  if (count < starters) return 1;
  if (position === "RB" || position === "WR") return count < starters + 2 ? 0.6 : 0.35;
  return 0.2;
}

async function pollPicks(draftId, leagueId) {
  taken = new Set(manualTaken());
  draftTeams = {};
  myDraftKeys = new Set();
  const players = await sleeperPlayers();
  const me = $("team").value;

  if (leagueId) {
    const [rosters, users] = await Promise.all([
      fetch(`https://api.sleeper.app/v1/league/${leagueId}/rosters`).then((r) => r.json()),
      fetch(`https://api.sleeper.app/v1/league/${leagueId}/users`).then((r) => r.json()),
    ]);
    const nameOf = new Map(users.map((u) => [u.user_id, u.display_name]));

    if ($("team").options.length === 0) {
      for (const u of users) {
        const option = document.createElement("option");
        option.value = option.textContent = u.display_name;
        $("team").appendChild(option);
      }

      const saved = store.get("settings", null);
      if (saved && saved.team) $("team").value = saved.team;
      $("teamwrap").hidden = false;
    }

    for (const r of rosters) {
      const owner = nameOf.get(r.owner_id) ?? r.owner_id;

      for (const id of r.players ?? []) {
        const p = players[id];

        if (p && p.full_name) {
          const key = norm(p.full_name);
          taken.add(key);
          (draftTeams[owner] = draftTeams[owner] ?? []).push(p.full_name + " (kept)");
          if (owner === me) myDraftKeys.add(key);
        }
      }
    }
  }

  let pickCount;

  if (draftId) {
    const picks = await fetch(`https://api.sleeper.app/v1/draft/${draftId}/picks`).then((r) => r.json());
    const users = await fetch(`https://api.sleeper.app/v1/draft/${draftId}`).then((r) => r.json()).catch(() => null);
    pickCount = picks.length;

    for (const pick of picks) {
      const p = players[pick.player_id];
      if (!p || !p.full_name) continue;
      const key = norm(p.full_name);
      taken.add(key);
      const owner = (pick.metadata && pick.metadata.team) || `slot ${pick.draft_slot}`;
      const label = draftUsers.length && pick.picked_by
        ? (sleeper.rosters?.find(() => false), owner)
        : owner;
      (draftTeams[label] = draftTeams[label] ?? []).push(p.full_name);
      if ($("team").value && pick.metadata && norm(pick.metadata.team ?? "") === norm(me)) myDraftKeys.add(key);
    }
  }

  store.set("draft", {
    draftId, leagueId, taken: [...taken], teams: draftTeams,
    mine: [...myDraftKeys], pickCount,
    at: new Date().toISOString().slice(0, 16).replace("T", " "),
  });
  renderDraft(pickCount);
}

function renderDraft(pickCount, staleAt) {
  if (!board) return;
  const out = $("out");
  out.innerHTML = "";

  const counts = { QB: 0, RB: 0, WR: 0, TE: 0 };
  const mineList = [];

  for (const p of board.players) {
    if (myDraftKeys.has(p.key)) {
      counts[p.position] = (counts[p.position] ?? 0) + 1;
      mineList.push(p);
    }
  }

  const h = document.createElement("h2");
  h.textContent = (pickCount !== undefined ? `pick ${pickCount + 1}, ` : "") +
    "recommended for your roster" + (staleAt ? ` as of ${staleAt}` : "");
  out.appendChild(h);

  const scored = board.players
    .filter((p) => !taken.has(p.key))
    .map((p) => ({ p, score: p.vor * needFactor(p.position, counts[p.position] ?? 0) }))
    .sort((a, b) => b.score - a.score);

  const grid = document.createElement("div");
  grid.className = "cards";

  scored.slice(0, 18).forEach(({ p, score }, i) => {
    grid.appendChild(card(
      { ...p, predicted: undefined },
      {
        sub: `${p.ppg.toFixed(1)} a game${p.adp ? " &middot; adp " + p.adp.toFixed(0) : ""}${p.bye ? " &middot; bye " + p.bye : ""}`,
        tag: i < 3 ? `pick this: fills ${p.position}, need-adjusted ${score.toFixed(1)}` : "",
      },
    ));
  });

  out.appendChild(grid);

  if (mineList.length > 0) {
    const mh = document.createElement("h2");
    mh.textContent = `your team (${Object.entries(counts).filter(([, c]) => c > 0).map(([pos, c]) => `${c} ${pos}`).join(", ")})`;
    out.appendChild(mh);
    const myGrid = document.createElement("div");
    myGrid.className = "cards";

    for (const p of mineList) {
      myGrid.appendChild(card({ ...p, predicted: undefined }, { mine: true, sub: `${p.ppg.toFixed(1)} a game` }));
    }

    out.appendChild(myGrid);
  }

  const owners = Object.keys(draftTeams);

  if (owners.length > 0) {
    const th = document.createElement("h2");
    th.textContent = "all teams";
    out.appendChild(th);
    const teamGrid = document.createElement("div");
    teamGrid.className = "cards";

    for (const owner of owners) {
      const div = document.createElement("div");
      div.className = "card" + (owner === $("team").value ? " mine" : "");
      div.innerHTML = `<div class="nm">${owner}</div><div class="sub" style="display:block; margin-top:.3rem">${draftTeams[owner].join("<br>")}</div>`;
      teamGrid.appendChild(div);
    }

    out.appendChild(teamGrid);
  }
}

async function renderDraftView() {
  if (!board) board = await (await fetch(`data/board-${meta.boardSeason}.json`)).json();
  let draftId = $("draftid").value.trim();
  const leagueId = $("league").value.trim();

  if (!draftId && leagueId) {
    $("status").textContent = "finding the league's draft...";
    draftId = (await findDraftId(leagueId)) ?? "";
    if (draftId) $("draftid").value = draftId;
  }

  if (draftId || leagueId) {
    $("status").textContent = draftId
      ? "watching the draft, refreshing every 5s; close and load later to catch up"
      : "keepers loaded from league rosters";
    await pollPicks(draftId, leagueId);
    if (draftId) draftPoll = setInterval(() => pollPicks(draftId, leagueId), 5000);
  } else {
    const saved = store.get("draft", null);

    if (saved && saved.taken) {
      taken = new Set([...saved.taken, ...manualTaken()]);
      draftTeams = saved.teams ?? {};
      myDraftKeys = new Set(saved.mine ?? []);
      renderDraft(saved.pickCount, saved.at);
      $("status").textContent = "saved draft state; enter the league to refresh";
    } else {
      taken = new Set(manualTaken());
      draftTeams = {};
      myDraftKeys = new Set();
      renderDraft();
    }
  }
}

function renderHistory() {
  const out = $("out");
  out.innerHTML = "";
  const history = store.get("history", []);

  if (history.length === 0) {
    out.innerHTML = '<p class="hint">nothing yet; loads from the other tabs land here</p>';
    return;
  }

  for (const entry of history) {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<div class="sub"><span>${entry.at}</span><span>${entry.view} &middot; ${entry.week ?? ""}</span></div><div style="font-size:.85rem; margin-top:.3rem">${entry.note}</div>`;
    out.appendChild(div);
  }
}

document.querySelectorAll("nav button").forEach((button) =>
  button.addEventListener("click", () => setView(button.dataset.view)),
);

$("go").addEventListener("click", async () => {
  const status = $("status");

  try {
    const leagueId = $("league").value.trim();

    if (view !== "draft" && leagueId && !sleeper.rosters) {
      await loadSleeper(leagueId);
      saveSettings();
      return;
    }

    status.textContent = "";

    if (view === "start") await renderStart();
    else if (view === "waivers") await renderWaivers();
    else if (view === "history") renderHistory();
    else await renderDraftView();

    saveSettings();
  } catch (error) {
    status.textContent = String(error);
    $("prog").hidden = true;
  }
});

boot();
</script>
</body>
</html>
