<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>depth-chart</title>
<style>
  :root {
    --bg: #FBFCFD; --grid: #E7EEF5; --ink: #1C2430; --muted: #5B6470;
    --faint: #8E96A2; --draft: #4A78B0; --draft-soft: rgba(74,120,176,0.35);
    --accent: #C43C2C; --surface: #FFFFFF; --ok: #2E7D5B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1D2126; --grid: #272D35; --ink: #E6E8EB; --muted: #A2A9B2;
      --faint: #6F7680; --draft: #7FA5D4; --draft-soft: rgba(127,165,212,0.35);
      --accent: #E07060; --surface: #232830; --ok: #6FBF9A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink); font-family: system-ui, sans-serif; line-height: 1.45;
  }
  .wrap { max-width: 64rem; margin: 0 auto; padding: 1rem 1rem 4rem; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: .7rem;
    letter-spacing: .1em; text-transform: uppercase; }
  nav { display: flex; gap: .5rem; align-items: center; margin: .5rem 0 1rem; }
  nav .brand { color: var(--draft); margin-right: auto; }
  nav button {
    font: inherit; font-size: .8rem; background: var(--surface);
    color: var(--muted); border: 1px solid var(--draft-soft);
    padding: .35rem .9rem; border-radius: 2px; cursor: pointer;
  }
  nav button.on { background: var(--draft); color: var(--surface);
    border-color: var(--draft); }
  .controls { border: 1px solid var(--draft); background: var(--surface);
    padding: .7rem 1rem; margin: 0 0 1rem; display: flex; gap: .8rem;
    flex-wrap: wrap; align-items: center; }
  .controls label { color: var(--muted); font-size: .82rem; }
  input, select {
    font: inherit; font-size: .85rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--draft-soft); padding: .3rem .5rem; border-radius: 2px;
  }
  button.act {
    font: inherit; font-size: .85rem; background: var(--draft);
    color: var(--surface); border: none; padding: .35rem .9rem;
    border-radius: 2px; cursor: pointer;
  }
  button.act:hover { background: var(--accent); }
  #status { color: var(--faint); font-size: .82rem; }
  progress { width: 9rem; accent-color: var(--draft); }
  textarea { width: 100%; height: 3.2rem; font: inherit; font-size: .85rem;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--draft-soft); padding: .4rem; }
  h2 { font-size: .85rem; margin: 1.2rem 0 .5rem; color: var(--draft); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: .7rem; }
  .card { background: var(--surface); border: 1px solid var(--draft-soft);
    border-radius: 2px; padding: .7rem .9rem; position: relative; }
  .card.mine { border-color: var(--draft); box-shadow: inset 0 0 0 1px var(--draft); }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; }
  .card .nm { font-weight: 600; font-size: .92rem; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .card .big { font-size: 1.3rem; font-weight: 700; }
  .card .sub { color: var(--faint); font-size: .74rem;
    display: flex; justify-content: space-between; margin-top: .1rem; }
  .range { position: relative; height: 8px; background: var(--grid);
    border-radius: 2px; margin-top: .55rem; }
  .range .span { position: absolute; top: 0; bottom: 0;
    background: var(--draft-soft); border-radius: 2px; }
  .range .mark { position: absolute; top: -2px; width: 3px; height: 12px;
    background: var(--accent); }
  .tag { font-size: .72rem; color: var(--ok); margin-top: .4rem; }
  .tag.warn { color: var(--accent); }
  .hint { color: var(--faint); font-size: .78rem; }
  .gone { opacity: .35; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <span class="brand mono">depth-chart</span>
    <button data-view="draft">draft</button>
    <button data-view="start" class="on">start</button>
    <button data-view="waivers">waivers</button>
  </nav>

  <div class="controls">
    <label id="weekwrap">week <select id="week"></select></label>
    <label>sleeper league <input id="league" size="14" placeholder="league id"></label>
    <label id="teamwrap" hidden>team <select id="team"></select></label>
    <label id="draftwrap" hidden>draft <input id="draftid" size="14" placeholder="draft id (auto)"></label>
    <button class="act" id="go">load</button>
    <span id="status"></span>
    <progress id="prog" max="100" value="0" hidden></progress>
  </div>

  <div class="controls" id="manualwrap" style="display:block">
    <label class="hint">no sleeper? paste your roster, one name per line</label>
    <textarea id="manual"></textarea>
  </div>

  <div id="out"></div>
  <p class="hint" id="legend"></p>
</div>

<script>
const POSITIONS = ["QB", "RB", "WR", "TE"];
let view = "start";
let meta = null;
let board = null;
const slates = {};
let sleeper = { players: null, rosters: null, leagueId: null };
let draftPoll = null;
let taken = new Set();

const $ = (id) => document.getElementById(id);
const norm = (n) => n.toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?$/, "").replace(/[^a-z]/g, "");

async function boot() {
  meta = await (await fetch("data/index.json")).json();

  for (const entry of meta.weeks) {
    const option = document.createElement("option");
    option.value = `${entry.season}|${entry.week}`;
    option.textContent = `${entry.season} week ${entry.week}`;
    $("week").appendChild(option);
  }

  $("week").value = `${meta.weeks.at(-1).season}|${meta.weeks.at(-1).week}`;
  setView("start");
}

function setView(next) {
  view = next;

  for (const button of document.querySelectorAll("nav button")) {
    button.classList.toggle("on", button.dataset.view === next);
  }

  $("weekwrap").hidden = next === "draft";
  $("draftwrap").hidden = next !== "draft";
  $("legend").textContent =
    next === "draft"
      ? "cards rank by value over a replacement starter; drafted players drop out as picks come in"
      : "bar spans floor to ceiling; the red mark is the projection";
  $("out").innerHTML = "";

  if (draftPoll && next !== "draft") {
    clearInterval(draftPoll);
    draftPoll = null;
  }
}

async function loadSleeper(leagueId, status, prog) {
  status.textContent = "fetching league...";
  const [rosters, users] = await Promise.all([
    fetch(`https://api.sleeper.app/v1/league/${leagueId}/rosters`).then((r) => r.json()),
    fetch(`https://api.sleeper.app/v1/league/${leagueId}/users`).then((r) => r.json()),
  ]);

  if (!sleeper.players) {
    status.textContent = "fetching player list (5MB, once)...";
    prog.hidden = false;
    prog.value = 40;
    sleeper.players = await fetch("https://api.sleeper.app/v1/players/nfl").then((r) => r.json());
    prog.hidden = true;
  }

  const nameOf = new Map(users.map((u) => [u.user_id, u.display_name]));
  sleeper.rosters = rosters.map((r) => ({
    owner: nameOf.get(r.owner_id) ?? r.owner_id,
    keys: (r.players ?? [])
      .map((id) => sleeper.players[id])
      .filter((p) => p && p.full_name)
      .map((p) => norm(p.full_name)),
  }));
  sleeper.leagueId = leagueId;

  $("team").innerHTML = "";

  for (const r of sleeper.rosters) {
    const option = document.createElement("option");
    option.value = r.owner;
    option.textContent = r.owner;
    $("team").appendChild(option);
  }

  $("teamwrap").hidden = false;
  status.textContent = "pick your team, then load again";
}

function myKeys() {
  const manual = $("manual").value.trim();

  if (manual) {
    return new Set(manual.split("\n").map(norm).filter(Boolean));
  }

  if (sleeper.rosters) {
    const roster = sleeper.rosters.find((r) => r.owner === $("team").value);
    return new Set(roster ? roster.keys : []);
  }

  return new Set();
}

const isMine = (mine, key) => [...mine].some((k) => key.includes(k) || k.includes(key));

function card(p, opts = {}) {
  const div = document.createElement("div");
  div.className = "card" + (opts.mine ? " mine" : "") + (opts.gone ? " gone" : "");
  const max = opts.max ?? 40;
  const range =
    p.floor !== undefined
      ? `<div class="range">
          <span class="span" style="left:${(p.floor / max) * 100}%; width:${((p.ceiling - p.floor) / max) * 100}%"></span>
          <span class="mark" style="left:${(p.predicted / max) * 100}%"></span>
        </div>`
      : "";
  const tag = opts.tag ? `<div class="tag${opts.warn ? " warn" : ""}">${opts.tag}</div>` : "";
  div.innerHTML = `
    <div class="top"><span class="nm">${p.name}</span><span class="big">${(p.predicted ?? p.vor).toFixed(1)}</span></div>
    <div class="sub"><span>${p.position} · ${p.team}${p.opponent ? " · " + p.opponent : ""}</span><span>${opts.sub ?? ""}</span></div>
    ${range}${tag}`;
  return div;
}

async function renderStart() {
  const key = $("week").value;

  if (!slates[key]) {
    const parts = key.split("|");
    slates[key] = await (await fetch(`data/slate-${parts[0]}-${parts[1]}.json`)).json();
  }

  const slate = slates[key];
  const mine = myKeys();
  const out = $("out");
  out.innerHTML = "";
  const max = Math.max(...slate.players.map((p) => p.ceiling));

  for (const position of POSITIONS) {
    const rows = slate.players.filter((p) => p.position === position);
    const owned = rows.filter((p) => isMine(mine, p.key));
    const shown = mine.size > 0 ? owned : rows.slice(0, 8);
    const h = document.createElement("h2");
    h.className = "mono";
    h.textContent = position;
    out.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "cards";

    for (const p of shown) {
      grid.appendChild(card(p, { mine: mine.size > 0, max, sub: `${p.snaps}% snaps` }));
    }

    out.appendChild(grid);
  }
}

async function renderWaivers() {
  const key = $("week").value;

  if (!slates[key]) {
    const parts = key.split("|");
    slates[key] = await (await fetch(`data/slate-${parts[0]}-${parts[1]}.json`)).json();
  }

  const slate = slates[key];
  const mine = myKeys();
  const out = $("out");
  out.innerHTML = "";
  const max = Math.max(...slate.players.map((p) => p.ceiling));

  if (mine.size === 0) {
    out.innerHTML = '<p class="hint">connect a league or paste a roster to compare against free agents</p>';
    return;
  }

  for (const position of POSITIONS) {
    const rows = slate.players.filter((p) => p.position === position);
    const owned = rows.filter((p) => isMine(mine, p.key));
    const worst = owned.at(-1);
    const outside = rows.filter((p) => !owned.includes(p)).slice(0, 6);
    const h = document.createElement("h2");
    h.className = "mono";
    h.textContent = position;
    out.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "cards";

    for (const p of owned) {
      grid.appendChild(card(p, { mine: true, max, sub: `${p.snaps}% snaps` }));
    }

    for (const p of outside) {
      const gain = worst ? p.predicted - worst.predicted : 0;
      grid.appendChild(
        card(p, {
          max,
          sub: `${p.snaps}% snaps`,
          tag: worst && gain > 2 ? `+${gain.toFixed(1)} over ${worst.name}` : "",
        }),
      );
    }

    out.appendChild(grid);
  }
}

async function findDraftId(leagueId) {
  const drafts = await fetch(`https://api.sleeper.app/v1/league/${leagueId}/drafts`).then((r) => r.json());
  return drafts && drafts[0] ? drafts[0].draft_id : null;
}

async function pollPicks(draftId) {
  const picks = await fetch(`https://api.sleeper.app/v1/draft/${draftId}/picks`).then((r) => r.json());
  taken = new Set();

  if (sleeper.players) {
    for (const pick of picks) {
      const p = sleeper.players[pick.player_id];

      if (p && p.full_name) {
        taken.add(norm(p.full_name));
      }
    }
  }

  renderDraft(picks.length);
}

function renderDraft(pickCount) {
  if (!board) {
    return;
  }

  const out = $("out");
  out.innerHTML = "";
  const status = document.createElement("h2");
  status.className = "mono";
  status.textContent = pickCount !== undefined
    ? `pick ${pickCount + 1}, best available by value over replacement`
    : "the full board by value over replacement";
  out.appendChild(status);

  const available = board.players.filter((p) => !taken.has(p.key));
  const grid = document.createElement("div");
  grid.className = "cards";

  for (const p of available.slice(0, 24)) {
    grid.appendChild(
      card(
        { ...p, predicted: undefined },
        {
          sub: `${p.ppg.toFixed(1)} a game${p.adp ? " · adp " + p.adp.toFixed(0) : ""}${p.bye ? " · bye " + p.bye : ""}`,
        },
      ),
    );
  }

  out.appendChild(grid);
}

async function renderDraftView() {
  if (!board) {
    board = await (await fetch(`data/board-${meta.boardSeason}.json`)).json();
  }

  let draftId = $("draftid").value.trim();
  const leagueId = $("league").value.trim();

  if (!draftId && leagueId) {
    $("status").textContent = "finding the league's draft...";
    draftId = await findDraftId(leagueId);

    if (draftId) {
      $("draftid").value = draftId;
    }
  }

  if (draftId) {
    if (!sleeper.players) {
      $("status").textContent = "fetching player list (5MB, once)...";
      sleeper.players = await fetch("https://api.sleeper.app/v1/players/nfl").then((r) => r.json());
    }

    $("status").textContent = "watching the draft, refreshing every 5s";
    await pollPicks(draftId);
    draftPoll = setInterval(() => pollPicks(draftId), 5000);
  } else {
    renderDraft();
  }
}

document.querySelectorAll("nav button").forEach((button) =>
  button.addEventListener("click", () => setView(button.dataset.view)),
);

$("go").addEventListener("click", async () => {
  const status = $("status");

  try {
    const leagueId = $("league").value.trim();

    if (view !== "draft" && leagueId && !sleeper.rosters) {
      await loadSleeper(leagueId, status, $("prog"));
      return;
    }

    status.textContent = "";

    if (view === "start") {
      await renderStart();
    } else if (view === "waivers") {
      await renderWaivers();
    } else {
      await renderDraftView();
    }
  } catch (error) {
    status.textContent = String(error);
    $("prog").hidden = true;
  }
});

boot();
</script>
</body>
</html>
