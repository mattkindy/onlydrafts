<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>depthchart</title>
<style>
  :root {
    --bg: #10141C; --panel: #1A2029; --edge: #2A3342; --ink: #E8ECF2;
    --muted: #8B95A5; --faint: #5B6575; --go: #35C06F; --mark: #F5B841;
    --chip: #232B38;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #EFF1F4; --panel: #FFFFFF; --edge: #D8DCE3; --ink: #171B22;
      --muted: #5A6270; --faint: #98A0AD; --go: #1E8A4C; --mark: #D99A16;
      --chip: #E7EAEF;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, sans-serif; line-height: 1.45; }
  .wrap { max-width: 64rem; margin: 0 auto; padding: 1rem 1rem 4rem; }
  nav { display: flex; gap: .4rem; align-items: center; margin: .5rem 0 1rem;
    flex-wrap: wrap; }
  nav .brand { margin-right: auto; font-weight: 800; font-size: 1.05rem;
    letter-spacing: -0.02em; cursor: pointer; }
  nav .brand b { color: var(--go); }
  #crumb { display: flex; gap: .5rem; align-items: center; font-size: .85rem;
    color: var(--muted); }
  #crumb b { color: var(--ink); }
  #crumb button { font: inherit; font-size: .78rem; background: var(--chip);
    color: var(--muted); border: none; border-radius: 999px;
    padding: .25rem .7rem; cursor: pointer; }
  #subnav { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: .8rem;
    border-bottom: 1px solid var(--edge); }
  #subnav button, nav button { font: inherit; font-size: .8rem; font-weight: 600;
    background: transparent; color: var(--muted); border: none;
    border-bottom: 2px solid transparent; padding: .35rem .7rem; cursor: pointer; }
  nav button.on { color: var(--ink); border-bottom-color: var(--go); }
  .controls { background: var(--panel); border: 1px solid var(--edge);
    border-radius: 10px; padding: .7rem 1rem; margin: 0 0 1rem;
    display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; }
  .controls label { color: var(--muted); font-size: .82rem; }
  input, select { font: inherit; font-size: .85rem; color: var(--ink);
    background: var(--bg); border: 1px solid var(--edge);
    padding: .3rem .5rem; border-radius: 7px; }
  button.act { font: inherit; font-size: .85rem; font-weight: 700;
    background: var(--go); color: #0C1117; border: none;
    padding: .4rem 1.1rem; border-radius: 999px; cursor: pointer; }
  button.act:hover { filter: brightness(1.12); }
  #status { color: var(--faint); font-size: .82rem; }
  progress { width: 9rem; accent-color: var(--go); }
  textarea { width: 100%; height: 3rem; font: inherit; font-size: .85rem;
    color: var(--ink); background: var(--bg); border: 1px solid var(--edge);
    padding: .4rem; border-radius: 7px; }
  h2 { font-size: .78rem; margin: 1.3rem 0 .5rem; color: var(--faint);
    font-family: ui-monospace, Menlo, monospace; letter-spacing: .12em;
    text-transform: uppercase; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: .7rem; }
  .card { background: var(--panel); border: 1px solid var(--edge);
    border-radius: 12px; padding: .75rem .95rem; cursor: pointer; }
  .card.plain { cursor: default; }
  .card.mine { border-color: var(--go); }
  .card.kept { opacity: .55; }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; }
  .card .nm { font-weight: 700; font-size: .92rem; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .card .big { font-size: 1.35rem; font-weight: 800;
    font-variant-numeric: tabular-nums; }
  .card .sub { color: var(--faint); font-size: .74rem;
    display: flex; justify-content: space-between; margin-top: .1rem; gap: .5rem; }
  .range { position: relative; height: 8px; background: var(--chip);
    border-radius: 999px; margin-top: .6rem; }
  .range .span { position: absolute; top: 0; bottom: 0;
    background: var(--edge); border-radius: 999px; }
  .card.mine .range .span { background: color-mix(in srgb, var(--go) 45%, var(--chip)); }
  .range .mark { position: absolute; top: -3px; width: 3px; height: 14px;
    background: var(--mark); border-radius: 2px; }
  .tag { font-size: .72rem; font-weight: 700; color: var(--go); margin-top: .45rem; }
  .tag.warn { color: var(--mark); }
  .hint { color: var(--faint); font-size: .78rem; }
  #explain h1 { font-size: 1.25rem; margin: .2rem 0 .15rem; }
  #explain p { color: var(--muted); font-size: .85rem; margin: 0 0 .9rem; }
  .empty { background: var(--panel); border: 1px dashed var(--edge);
    border-radius: 12px; padding: 1.2rem; color: var(--muted); font-size: .88rem; }
  .empty b { color: var(--ink); }
  .step { display: flex; gap: .5rem; align-items: baseline; margin: .35rem 0; }
  .step span:first-child { color: var(--go); font-weight: 700; }
  table.grid { border-collapse: collapse; font-size: .68rem; width: 100%;
    overflow-x: auto; display: block; background: var(--panel);
    border: 1px solid var(--edge); border-radius: 10px; }
  table.grid td, table.grid th { border: 1px solid var(--edge);
    padding: .25rem .4rem; white-space: nowrap; color: var(--muted); }
  table.grid th { color: var(--faint); font-weight: 600; }
  table.grid td.me { background: color-mix(in srgb, var(--go) 18%, var(--panel));
    color: var(--ink); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: flex-start; justify-content: center;
    padding: 2rem 1rem; overflow-y: auto; z-index: 10; }
  #overlay.open { display: flex; }
  .sheet { background: var(--panel); border: 1px solid var(--edge);
    border-radius: 14px; padding: 1.2rem 1.4rem; max-width: 34rem; width: 100%; }
  .sheet h3 { margin: 0; font-size: 1.15rem; }
  .sheet .sub { color: var(--faint); font-size: .8rem; margin-bottom: .8rem; }
  .wk { display: grid; grid-template-columns: 2.4rem 3.4rem 1fr 2.4rem;
    gap: .5rem; align-items: center; font-size: .75rem; color: var(--muted);
    padding: .1rem 0; }
  .wk .bar { height: 7px; background: var(--chip); border-radius: 999px;
    position: relative; }
  .wk .bar i { position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--go); border-radius: 999px; opacity: .7; }
  .fact { font-size: .8rem; margin: .15rem 0; }
  .fact.p::before { content: "+ "; color: var(--go); font-weight: 700; }
  .fact.m::before { content: "- "; color: var(--mark); font-weight: 700; }
  .sheet .row { display: flex; gap: .6rem; margin-top: 1rem; }
  .league-card .nm { font-size: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <span class="brand" id="home">depth<b>chart</b></span>
    <span id="crumb"></span>
  </nav>

  <div id="subnav" hidden>
    <button data-view="roster">my roster</button>
    <button data-view="draft">draft help</button>
    <button data-view="start">who to start</button>
    <button data-view="waivers">who to add</button>
    <button data-view="history">past advice</button>
  </div>

  <div id="explain">
    <h1 id="title"></h1>
    <p id="blurb"></p>
  </div>

  <div class="controls" id="ctl">
    <label id="userwrap">sleeper user <input id="username" size="12"></label>
    <label id="weekwrap">week <select id="week"></select></label>
    <label id="teamwrap" hidden>team <select id="team"></select></label>
    <label id="keepwrap" hidden>keepers/team <input id="keepn" type="number" value="2" min="0" max="6" style="width:3.2rem"></label>
    <button class="act" id="go">load</button>
    <span id="status"></span>
    <progress id="prog" max="100" value="0" hidden></progress>
  </div>

  <div class="controls" id="manualwrap" style="display:block">
    <label class="hint" id="manualhint"></label>
    <textarea id="manual"></textarea>
  </div>

  <div id="out"></div>
  <p class="hint" id="legend"></p>
</div>

<div id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
const POSITIONS = ["QB", "RB", "WR", "TE"];
const STARTERS = { QB: 1, RB: 2, WR: 2, TE: 1 };
let view = "leagues";
let meta = null, board = null, boardByKey = null;
const slates = {};
let players = null;
let leagues = store_get("leagues", []);
let active = store_get("active", null); // {leagueId, name, team, userId}
let draftPoll = null;
let draftState = { taken: new Set(), teams: {}, mine: new Set(), rosteredBy: {}, grid: null, pickCount: undefined };

function store_get(key, fallback) {
  try { const raw = localStorage.getItem("dc." + key); return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function store_set(key, value) {
  try { localStorage.setItem("dc." + key, JSON.stringify(value)); } catch {}
}

const $ = (id) => document.getElementById(id);
const norm = (n) => (n ?? "").toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?$/, "").replace(/[^a-z]/g, "");
const api = (path) => fetch("https://api.sleeper.app/v1" + path).then((r) => r.json());

async function sleeperPlayers() {
  if (players) return players;
  // v2 keys the trimmed shape; an older cache used different field names
  const cached = store_get("players.v2", null);
  if (cached) { players = cached; return cached; }
  try { localStorage.removeItem("dc.players"); } catch {}
  $("status").textContent = "fetching player list (5MB, once ever)...";
  $("prog").hidden = false; $("prog").value = 40;
  const raw = await api("/players/nfl");
  $("prog").hidden = true;
  const trimmed = {};
  for (const [id, p] of Object.entries(raw)) {
    if (p.full_name && p.position) trimmed[id] = { n: p.full_name, p: p.position };
  }
  store_set("players.v2", trimmed);
  players = trimmed;
  return trimmed;
}

function keeperKeyFor(league) { return "keepers." + league; }
function markedKeepers() { return active ? store_get(keeperKeyFor(active.leagueId), {}) : {}; }
function saveMarkedKeepers(map) { if (active) store_set(keeperKeyFor(active.leagueId), map); }

function logHistory(note) {
  const history = store_get("history", []);
  history.unshift({ at: new Date().toISOString().slice(0, 16).replace("T", " "), view, week: $("week").value, note });
  store_set("history", history.slice(0, 50));
}

async function boot() {
  meta = await (await fetch("data/index.json")).json();
  for (const entry of meta.weeks) {
    const option = document.createElement("option");
    option.value = entry.season + "|" + entry.week;
    option.textContent = entry.season + " week " + entry.week;
    $("week").appendChild(option);
  }
  $("week").value = meta.weeks.at(-1).season + "|" + meta.weeks.at(-1).week;
  const saved = store_get("settings", null);
  if (saved) {
    $("username").value = saved.username ?? "";
    $("manual").value = saved.manual ?? "";
    $("keepn").value = saved.keepn ?? 2;
    if (saved.week && [...$("week").options].some((o) => o.value === saved.week)) $("week").value = saved.week;
  }
  const fallbackView = meta.weeks.length ? "start" : "draft";
  setView(active ? (saved && saved.view ? saved.view : fallbackView) : "leagues");
  if (view === "leagues" && leagues.length) renderLeagues();
}

function saveSettings() {
  store_set("settings", { username: $("username").value, manual: $("manual").value,
    keepn: $("keepn").value, week: $("week").value, view });
}

function setView(next) {
  if (next !== "leagues" && !active) next = "leagues";
  view = next;
  $("subnav").hidden = next === "leagues";
  $("crumb").innerHTML = active && next !== "leagues"
    ? '<button id="back">all leagues</button><b>' + active.name + "</b><span>you: " + active.team + "</span>"
    : "";

  if ($("back")) {
    $("back").addEventListener("click", () => { setView("leagues"); renderLeagues(); });
  }

  for (const b of document.querySelectorAll("#subnav button")) b.classList.toggle("on", b.dataset.view === next);
  $("userwrap").hidden = next !== "leagues";
  $("weekwrap").hidden = !meta.weeks.length || next === "draft" || next === "history" || next === "leagues";
  $("teamwrap").hidden = true;
  $("keepwrap").hidden = next !== "draft" && next !== "roster";
  $("manualwrap").style.display = next === "start" || next === "waivers" || next === "draft" ? "block" : "none";
  if (next === "roster") $("manualwrap").style.display = "none";
  $("manualhint").textContent = next === "draft"
    ? "extra names to mark taken, one per line"
    : "no sleeper league? paste your roster, one name per line";
  const copy = {
    leagues: ["My leagues",
      "Type your Sleeper username, then tap a league to open it. Draft help, lineups, and waivers all live inside a league.",
      ""],
    roster: ["My roster",
      "Everyone Sleeper currently has on your team, with this season's projection for each.",
      "Before a keeper draft this is last season's roster until the league clears it. Tap a player to see his season and mark him as a keeper."],
    draft: ["Draft help",
      "Live board for draft night. It watches your league's draft, removes players as they go, and ranks who is left by what your roster still needs.",
      "The big number is value over a replacement starter, weighted by the slots your draft roster still needs. Your draft roster starts with the keepers you mark and grows with your picks. Players stay on the board until they are actually kept or drafted."],
    start: ["Who to start",
      "Your roster for one week, ranked by projected points, so you can set a lineup.",
      "The bar shows the range from a bad week to a great one; the gold mark is the projection. Tap a card for the week-by-week season and what is helping or hurting."],
    waivers: ["Who to add",
      "Your players next to the best available at each position, so you can see whether a pickup is an upgrade.",
      "A green tag means that player projects clearly ahead of your weakest starter at the spot."],
    history: ["Past advice",
      "What this page told you and when, so you can check it against how the weeks actually went.",
      ""],
  }[next] ?? ["", "", ""];
  $("title").textContent = copy[0];
  $("blurb").textContent = copy[1];
  $("legend").textContent = copy[2];
  $("out").innerHTML = "";
  if (draftPoll && next !== "draft") { clearInterval(draftPoll); draftPoll = null; }
  refreshGoLabel();
  if (next === "history") renderHistory();
  if (next === "leagues" && leagues.length) renderLeagues();
}

function refreshGoLabel() {
  if (view !== "draft") { $("go").textContent = "load"; return; }
  $("go").textContent = draftPoll ? "pause" : store_get("draftState", null) ? "resume draft" : "start draft";
}

async function loadLeagues() {
  const username = $("username").value.trim();
  if (!username) { $("status").textContent = "type your sleeper username"; return; }
  $("status").textContent = "finding leagues...";
  const user = await api("/user/" + username);
  if (!user || !user.user_id) { $("status").textContent = "no such user"; return; }
  const state = await api("/state/nfl");
  const found = await api("/user/" + user.user_id + "/leagues/nfl/" + state.season);
  const playerMap = await sleeperPlayers();
  leagues = [];

  for (const lg of found ?? []) {
    const [rosters, users] = await Promise.all([
      api("/league/" + lg.league_id + "/rosters"),
      api("/league/" + lg.league_id + "/users"),
    ]);
    const mine = rosters.find((r) => r.owner_id === user.user_id);
    const nameOf = new Map(users.map((u) => [u.user_id, u.display_name]));
    leagues.push({
      leagueId: lg.league_id, name: lg.name, size: lg.total_rosters,
      userId: user.user_id, team: nameOf.get(user.user_id) ?? username,
      myRoster: (mine && mine.players ? mine.players : [])
        .map((id) => playerMap[id]).filter((p) => p && p.n).map((p) => ({ name: p.n, key: norm(p.n) })),
      allRosters: rosters.map((r) => ({
        owner: nameOf.get(r.owner_id) ?? r.owner_id,
        keys: (r.players ?? []).map((id) => playerMap[id]).filter((p) => p && p.n)
          .map((p) => ({ name: p.n, key: norm(p.n), pos: p.p })),
      })),
    });
  }

  store_set("leagues", leagues);
  $("status").textContent = "";
  renderLeagues();
}

function renderLeagues() {
  const out = $("out");
  out.innerHTML = "";

  if (!leagues.length) {
    out.innerHTML = '<div class="empty"><b>Start here.</b>' +
      '<div class="step"><span>1</span><span>Type your Sleeper username above.</span></div>' +
      '<div class="step"><span>2</span><span>Press load. Your leagues appear as cards.</span></div>' +
      '<div class="step"><span>3</span><span>Tap a league, then use draft help, who to start, or who to add.</span></div></div>';
    return;
  }
  const h = document.createElement("h2");
  h.textContent = "your leagues";
  out.appendChild(h);
  const grid = document.createElement("div");
  grid.className = "cards";

  for (const lg of leagues) {
    const div = document.createElement("div");
    div.className = "card league-card" + (active && active.leagueId === lg.leagueId ? " mine" : "");
    div.innerHTML = '<div class="nm">' + lg.name + '</div><div class="sub"><span>' +
      lg.size + ' teams</span><span>you: ' + lg.team + "</span></div>";
    div.addEventListener("click", async () => {
      active = lg;
      store_set("active", active);
      setView(meta.weeks.length ? "start" : "draft");
      if (meta.weeks.length) await renderStart();
      else await renderDraftView();
      refreshGoLabel();
    });
    grid.appendChild(div);
  }

  out.appendChild(grid);
}

function boardLookup(key) {
  if (!boardByKey) return null;
  return boardByKey.get(key) ?? [...boardByKey.entries()].find(([k]) => k.includes(key) || key.includes(k))?.[1] ?? null;
}

function openDetail(p, slatePlayer) {
  const b = boardLookup(p.key) ?? p;
  const sheet = $("sheet");
  const marked = markedKeepers();
  const isKept = !!marked[p.key];
  const weeks = (b.weeks ?? []).map((g) =>
    '<div class="wk"><span>w' + g.w + "</span><span>" + g.opp +
    '</span><span class="bar"><i style="width:' + Math.min(100, (g.pts / 30) * 100) + '%"></i></span><span>' +
    g.pts.toFixed(1) + "</span></div>").join("");
  const plus = (b.plus ?? []).map((f) => '<div class="fact p">' + f + "</div>").join("");
  const minus = (b.minus ?? []).map((f) => '<div class="fact m">' + f + "</div>").join("");
  sheet.innerHTML =
    "<h3>" + (b.name ?? p.name) + '</h3><div class="sub">' + (b.position ?? p.position) +
    " &middot; " + (b.team ?? p.team ?? "") +
    (b.ppg ? " &middot; " + b.ppg.toFixed(1) + " a game projected" : "") +
    (b.adp ? " &middot; adp " + b.adp.toFixed(0) : "") + "</div>" +
    (plus || minus ? "<h2>factors vs past years</h2>" + plus + minus : "") +
    (weeks ? "<h2>week by week</h2>" + weeks : "") +
    '<div class="row"><button class="act" id="keepbtn">' +
    (isKept ? "unmark keeper" : "mark as keeper") + "</button>" +
    '<button class="act" id="closebtn" style="background:var(--chip); color:var(--ink)">close</button></div>';
  $("overlay").classList.add("open");
  $("keepbtn").addEventListener("click", () => {
    const map = markedKeepers();
    if (map[p.key]) delete map[p.key];
    else {
      const owner = ownerOf(p.key);
      const already = Object.entries(map).filter(([k, o]) => o === owner).length;
      if (owner && already >= Number($("keepn").value)) {
        $("status").textContent = owner + " already has " + already + " keepers marked";
        return;
      }
      map[p.key] = owner ?? "unknown";
    }
    saveMarkedKeepers(map);
    $("overlay").classList.remove("open");
    if (view === "draft") renderDraft();
  });
  $("closebtn").addEventListener("click", () => $("overlay").classList.remove("open"));
}

function ownerOf(key) {
  if (!active) return null;
  for (const r of active.allRosters) if (r.keys.some((k) => k.key === key)) return r.owner;
  return null;
}

function card(p, opts = {}) {
  const div = document.createElement("div");
  div.className = "card" + (opts.mine ? " mine" : "") + (opts.kept ? " kept" : "");
  const max = opts.max ?? 40;
  const big = opts.big !== undefined ? opts.big : (p.predicted ?? p.vor);
  const range = p.floor !== undefined
    ? '<div class="range"><span class="span" style="left:' + (p.floor / max) * 100 +
      "%; width:" + ((p.ceiling - p.floor) / max) * 100 + '%"></span><span class="mark" style="left:' +
      (p.predicted / max) * 100 + '%"></span></div>'
    : "";
  const tag = opts.tag ? '<div class="tag' + (opts.warn ? " warn" : "") + '">' + opts.tag + "</div>" : "";
  div.innerHTML = '<div class="top"><span class="nm">' + p.name + '</span><span class="big">' +
    big.toFixed(1) + '</span></div><div class="sub"><span>' + p.position + " &middot; " +
    (p.team ?? "") + (p.opponent ? " &middot; " + p.opponent : "") + "</span><span>" +
    (opts.sub ?? "") + "</span></div>" + range + tag;
  div.addEventListener("click", () => openDetail(p));
  return div;
}

async function slateFor(key) {
  if (!slates[key]) {
    const parts = key.split("|");
    slates[key] = await (await fetch("data/slate-" + parts[0] + "-" + parts[1] + ".json")).json();
  }
  return slates[key];
}

function myKeys() {
  const manual = $("manual").value.trim();
  if (manual && view !== "draft") return new Set(manual.split("\n").map(norm).filter(Boolean));
  if (active) return new Set(active.myRoster.map((p) => p.key));
  return new Set();
}

const isMine = (mine, key) => [...mine].some((k) => key.includes(k) || k.includes(key));

function seasonNotStarted() {
  $("out").innerHTML = '<div class="empty"><b>The season has not kicked off yet.</b> ' +
    "Weekly projections need a few games of this year's snaps and targets, so they turn on once the season is a month old. " +
    "Until then, use <b>draft help</b>.</div>";
}

async function renderStart() {
  if (!meta.weeks.length) return seasonNotStarted();
  const slate = await slateFor($("week").value);
  const mine = myKeys();
  const out = $("out");
  out.innerHTML = "";
  const max = Math.max(...slate.players.map((p) => p.ceiling));
  const starts = [];

  if (mine.size === 0) {
    out.innerHTML = '<div class="empty"><b>Showing the best players in the league.</b> ' +
      'Pick a league on <b>my leagues</b> (or paste your roster above) to see only your players.</div>';
  }

  for (const position of POSITIONS) {
    const rows = slate.players.filter((p) => p.position === position);
    const owned = rows.filter((p) => isMine(mine, p.key));
    const shown = mine.size > 0 ? owned : rows.slice(0, 8);
    const h = document.createElement("h2");
    h.textContent = position;
    out.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "cards";
    for (const p of shown) grid.appendChild(card(p, { mine: mine.size > 0, max, sub: p.snaps + "% snaps" }));
    out.appendChild(grid);
    if (mine.size > 0 && owned[0]) starts.push(position + ": " + owned[0].name + " " + owned[0].predicted.toFixed(1));
  }

  if (starts.length > 0) logHistory("starts: " + starts.join("; "));
}

async function renderWaivers() {
  if (!meta.weeks.length) return seasonNotStarted();
  const slate = await slateFor($("week").value);
  const mine = myKeys();
  const out = $("out");
  out.innerHTML = "";
  const max = Math.max(...slate.players.map((p) => p.ceiling));
  const suggestions = [];

  if (mine.size === 0) {
    out.innerHTML = '<div class="empty"><b>No roster yet.</b>' +
      '<div class="step"><span>1</span><span>Open <b>my leagues</b> and load your Sleeper username.</span></div>' +
      '<div class="step"><span>2</span><span>Tap the league you want.</span></div>' +
      '<div class="step"><span>or</span><span>Paste your roster in the box above, one name per line.</span></div></div>';
    return;
  }

  for (const position of POSITIONS) {
    const rows = slate.players.filter((p) => p.position === position);
    const owned = rows.filter((p) => isMine(mine, p.key));
    const worst = owned.at(-1);
    const outside = rows.filter((p) => !owned.includes(p)).slice(0, 6);
    const h = document.createElement("h2");
    h.textContent = position;
    out.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "cards";
    for (const p of owned) grid.appendChild(card(p, { mine: true, max, sub: p.snaps + "% snaps" }));
    for (const p of outside) {
      const gain = worst ? p.predicted - worst.predicted : 0;
      if (worst && gain > 2) suggestions.push(p.name + " +" + gain.toFixed(1) + " over " + worst.name);
      grid.appendChild(card(p, { max, sub: p.snaps + "% snaps", tag: worst && gain > 2 ? "+" + gain.toFixed(1) + " over " + worst.name : "" }));
    }
    out.appendChild(grid);
  }

  logHistory(suggestions.length ? "waiver ideas: " + suggestions.slice(0, 3).join("; ") : "no waiver moves clear the bar");
}

function needFactor(position, count) {
  const starters = STARTERS[position] ?? 0;
  if (count < starters) return 1;
  if (position === "RB" || position === "WR") return count < starters + 2 ? 0.6 : 0.35;
  return 0.2;
}

async function pollDraft() {
  const playerMap = await sleeperPlayers();
  const marked = markedKeepers();
  const state = { taken: new Set(Object.keys(marked)), teams: {}, mine: new Set(), rosteredBy: {}, grid: null, pickCount: undefined };
  const manual = $("manual").value.trim();
  for (const line of manual ? manual.split("\n") : []) if (line.trim()) state.taken.add(norm(line));

  for (const [key, owner] of Object.entries(marked)) {
    (state.teams[owner] = state.teams[owner] ?? []).push((boardLookup(key)?.name ?? key) + " (keeper)");
    if (active && owner === active.team) state.mine.add(key);
  }

  let draft = null, picks = [];

  if (active) {
    const drafts = await api("/league/" + active.leagueId + "/drafts");
    if (drafts && drafts[0]) {
      draft = await api("/draft/" + drafts[0].draft_id);
      picks = await api("/draft/" + drafts[0].draft_id + "/picks");
    }
  }

  const keeperPicksExist = picks.some((p) => p.is_keeper);

  for (const pick of picks) {
    const p = playerMap[pick.player_id];
    if (!p || !p.n) continue;
    const key = norm(p.n);
    state.taken.add(key);
    const owner = pick.picked_by && active && pick.picked_by === active.userId ? active.team
      : "slot " + pick.draft_slot;
    (state.teams[owner] = state.teams[owner] ?? []).push(p.n + (pick.is_keeper ? " (keeper)" : ""));
    if (active && pick.picked_by === active.userId) state.mine.add(key);
  }

  // who each player sat with last season, shown as a note only; nobody
  // leaves the board without an actual keeper pick or a manual mark
  if (active) {
    for (const r of active.allRosters) {
      for (const k of r.keys) state.rosteredBy[k.key] = r.owner;
    }
  }

  if (draft && picks.length) {
    state.grid = { rounds: draft.settings?.rounds ?? 15, teams: draft.settings?.teams ?? 12, cells: {} , mySlot: draft.draft_order ? draft.draft_order[active.userId] : null };
    for (const pick of picks) {
      const p = playerMap[pick.player_id];
      state.grid.cells[pick.round + "|" + pick.draft_slot] = p ? p.n.split(" ").at(-1) : "?";
    }
    state.pickCount = picks.length;
  }

  draftState = state;
  store_set("draftState", { ...state, taken: [...state.taken], mine: [...state.mine], at: new Date().toISOString().slice(0, 16).replace("T", " ") });
  renderDraft();
}

function renderDraft(staleAt) {
  if (!board) return;
  const out = $("out");
  out.innerHTML = "";
  const s = draftState;
  const counts = { QB: 0, RB: 0, WR: 0, TE: 0 };
  const mineList = [];

  for (const p of board.players) {
    if (s.mine.has(p.key)) { counts[p.position] = (counts[p.position] ?? 0) + 1; mineList.push(p); }
  }

  const h = document.createElement("h2");
  h.textContent = (s.pickCount !== undefined ? "pick " + (s.pickCount + 1) + ", " : "") +
    "best for your roster" + (staleAt ? " as of " + staleAt : "");
  out.appendChild(h);

  const scored = board.players
    .filter((p) => !s.taken.has(p.key))
    .map((p) => ({ p, score: p.vor * needFactor(p.position, counts[p.position] ?? 0) }))
    .sort((a, b) => b.score - a.score);

  const grid = document.createElement("div");
  grid.className = "cards";
  let shown = 0;

  for (const { p, score } of scored) {
    if (shown >= 20) break;
    shown++;
    const lastYear = s.rosteredBy[p.key];
    grid.appendChild(card(p, {
      big: score,
      sub: p.ppg.toFixed(1) + " a game" + (p.adp ? " &middot; adp " + p.adp.toFixed(0) : "") + (p.bye ? " &middot; bye " + p.bye : ""),
      tag: shown <= 3
        ? "fills " + p.position
        : lastYear ? "was on " + lastYear + " last season" : "",
      warn: shown > 3 && !!lastYear,
    }));
  }

  out.appendChild(grid);

  if (s.grid) {
    const gh = document.createElement("h2");
    gh.textContent = "pick grid";
    out.appendChild(gh);
    const table = document.createElement("table");
    table.className = "grid";
    let header = "<tr><th></th>";
    for (let slot = 1; slot <= s.grid.teams; slot++) header += "<th>" + (slot === s.grid.mySlot ? "you" : slot) + "</th>";
    let body = header + "</tr>";
    for (let round = 1; round <= s.grid.rounds; round++) {
      body += "<tr><th>r" + round + "</th>";
      for (let slot = 1; slot <= s.grid.teams; slot++) {
        const cell = s.grid.cells[round + "|" + slot] ?? "";
        body += '<td class="' + (slot === s.grid.mySlot ? "me" : "") + '">' + cell + "</td>";
      }
      body += "</tr>";
    }
    table.innerHTML = body;
    out.appendChild(table);
  }

  const drafted = new Set(mineList.map((p) => p.key));
  const rosterNow = active
    ? active.myRoster
        .map((r) => boardLookup(r.key))
        .filter((p) => p && !drafted.has(p.key))
    : [];

  if (mineList.length === 0) {
    const mh = document.createElement("h2");
    mh.textContent = "your draft roster";
    out.appendChild(mh);
    const note = document.createElement("div");
    note.className = "empty";
    note.innerHTML = "Nothing yet. Mark keepers from <b>my roster</b> or tap a player here, and your picks land here as the draft runs.";
    out.appendChild(note);
  }

  if (mineList.length > 0) {
    const mh = document.createElement("h2");
    mh.textContent = "you drafted (" + Object.entries(counts).filter(([, c]) => c > 0).map(([pos, c]) => c + " " + pos).join(", ") + ")";
    out.appendChild(mh);
    const myGrid = document.createElement("div");
    myGrid.className = "cards";
    for (const p of mineList) myGrid.appendChild(card(p, { mine: true, big: p.vor, sub: p.ppg.toFixed(1) + " a game" }));
    out.appendChild(myGrid);
  }

  if (rosterNow.length > 0) {
    const rh = document.createElement("h2");
    rh.textContent = "on your sleeper roster now (" + rosterNow.length + ")";
    out.appendChild(rh);
    const rGrid = document.createElement("div");
    rGrid.className = "cards";

    for (const p of rosterNow) {
      rGrid.appendChild(card(p, {
        mine: true,
        big: p.vor,
        sub: p.ppg.toFixed(1) + " a game" + (p.bye ? " &middot; bye " + p.bye : ""),
        tag: "tap to mark as a keeper",
      }));
    }

    out.appendChild(rGrid);
  }

  const owners = Object.keys(s.teams);

  if (owners.length > 0) {
    const th = document.createElement("h2");
    th.textContent = "keepers and picks so far";
    out.appendChild(th);
    const teamGrid = document.createElement("div");
    teamGrid.className = "cards";
    for (const owner of owners) {
      const div = document.createElement("div");
      div.className = "card plain" + (active && owner === active.team ? " mine" : "");
      div.innerHTML = '<div class="nm">' + owner + '</div><div class="sub" style="display:block; margin-top:.3rem">' + s.teams[owner].join("<br>") + "</div>";
      teamGrid.appendChild(div);
    }
    out.appendChild(teamGrid);
  }
}

async function renderDraftView() {
  if (!board) {
    board = await (await fetch("data/board-" + meta.boardSeason + ".json")).json();
    boardByKey = new Map(board.players.map((p) => [p.key, p]));
  }

  if (active) {
    $("status").textContent = "watching the draft, refreshing every 5s; pause anytime";
    await pollDraft();
    draftPoll = setInterval(pollDraft, 5000);
  } else {
    const saved = store_get("draftState", null);
    if (saved) {
      draftState = { ...saved, taken: new Set(saved.taken), mine: new Set(saved.mine) };
      renderDraft(saved.at);
      $("status").textContent = "saved state; pick a league on the leagues tab to refresh";
    } else {
      $("status").textContent = "pick a league on the leagues tab, or use the extra names box";
      draftState = { taken: new Set(), teams: {}, mine: new Set(), rosteredBy: {}, grid: null };
      renderDraft();
    }
  }
}

function renderHistory() {
  const out = $("out");
  out.innerHTML = "";
  const history = store_get("history", []);
  if (!history.length) { out.innerHTML = '<p class="hint">nothing yet</p>'; return; }
  for (const entry of history) {
    const div = document.createElement("div");
    div.className = "card plain";
    div.innerHTML = '<div class="sub"><span>' + entry.at + "</span><span>" + entry.view + " &middot; " + (entry.week ?? "") + '</span></div><div style="font-size:.85rem; margin-top:.3rem">' + entry.note + "</div>";
    out.appendChild(div);
  }
}

document.querySelectorAll("#subnav button").forEach((b) =>
  b.addEventListener("click", async () => {
    setView(b.dataset.view);

    try {
      if (view === "start") await renderStart();
      else if (view === "roster") await renderRoster();
      else if (view === "waivers") await renderWaivers();
      else if (view === "history") renderHistory();
      else if (view === "draft") await renderDraftView();
    } catch (error) {
      $("status").textContent = String(error);
    }

    refreshGoLabel();
  }),
);
$("home").addEventListener("click", () => setView("leagues"));
$("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) $("overlay").classList.remove("open"); });

$("go").addEventListener("click", async () => {
  const status = $("status");
  try {
    status.textContent = "";
    if (view === "leagues") await loadLeagues();
    else if (view === "roster") await renderRoster();
    else if (view === "start") await renderStart();
    else if (view === "waivers") await renderWaivers();
    else if (view === "history") renderHistory();
    else if (draftPoll) { clearInterval(draftPoll); draftPoll = null; status.textContent = "paused"; }
    else await renderDraftView();
    refreshGoLabel();
    saveSettings();
  } catch (error) {
    status.textContent = String(error);
    $("prog").hidden = true;
  }
});

boot();
</script>
