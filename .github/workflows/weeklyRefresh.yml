name: weekly refresh

# Scheduled runs have started three and a half to over four hours late,
# and GitHub delays runs set on the hour the most, so both times are set
# a few minutes past. The morning run goes Tuesday through Saturday,
# because waivers clear on Tuesday night or Wednesday and the practice
# reports come out Wednesday to Friday, so a lineup set on any of those
# days sees the news. 11:17 UTC is 07:17 in the summer and 06:17 in the
# winter on the US east coast, after Monday night is scored. Monday is
# left out because its week is still being played. Sunday 09:23 UTC is
# 05:23 and 04:23, early enough that a run four and a half hours late
# still finishes around 10:00 ET, three hours before the early games.
# Actions cron is UTC and does not follow daylight saving, so both sit
# well clear of the boundary.
on:
  schedule:
    - cron: "17 11 * * 2-6"
    - cron: "23 9 * * 0"
  workflow_dispatch:
    inputs:
      season:
        description: "season to refresh, the one being played if empty"
        required: false
      week:
        description: "week to build, the coming one if empty"
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: name this week
        id: stamp
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # The nflverse files are gitignored and about a gigabyte, so they are
      # cached rather than fetched again every run. A new key each week
      # restores the newest copy and saves a fresh one. An unused entry
      # expires after a week, so a quiet fortnight means the fill below
      # downloads the history again, which works but takes far longer.
      - name: the nflverse downloads
        uses: actions/cache@v6
        with:
          path: data/raw
          key: nflverse-raw-v1-${{ steps.stamp.outputs.week }}
          restore-keys: nflverse-raw-v1-

      # Every season from 2016 trains the weekly model, and each of those
      # reads the season before it for a man's points a game last year, so
      # the fill starts at 2015. --no-plays leaves out the per-play files,
      # which are read only for the season being rebuilt, and the step
      # downloads nothing a restored cache already has.
      - name: fill in the seasons the models train on
        run: |
          npx tsx scripts/fetchData.ts \
            --seasons "2015-$(( $(date -u +%Y) - 1 ))" --no-plays

      # week.ts pulls this season's files and Sleeper's projections,
      # counts this season's touches and builds the site. A release
      # nflverse has not published yet leaves the site as it was.
      # Half a point a catch, because the board is public and half PPR is
      # the middle of the three: it is half a point off a standard league
      # and half off a full PPR one, where scoring PPR is a full point
      # wrong for anybody in standard. A private league passes --league.
      - name: refresh the week
        env:
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
        run: |
          args=(--scoring half)
          if [ -n "$SEASON" ]; then
            args+=(--season "$SEASON")
          fi
          if [ -n "$WEEK" ]; then
            args+=(--weeks "$WEEK")
          fi
          npx tsx scripts/week.ts "${args[@]}"

      - name: what the site now shows
        id: built
        run: |
          season=$(jq -r ".boardSeason" docs/data/index.json)
          week=$(jq -r --argjson s "$season" \
            '[.weeks[] | select(.season == $s) | .week] | max // "none"' \
            docs/data/index.json)
          echo "season=$season" >> "$GITHUB_OUTPUT"
          echo "week=$week" >> "$GITHUB_OUTPUT"

      # A machine that fetched nothing still writes a board and a slate
      # that look normal, with nobody in them ever hurt. This fails the
      # run rather than committing a site thinner than the one there.
      - name: is the refresh worth committing
        env:
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
        run: |
          args=()
          if [ -n "$SEASON" ]; then
            args+=(--season "$SEASON")
          fi
          if [ -n "$WEEK" ]; then
            args+=(--week "$WEEK")
          fi
          npx tsx scripts/checkRefresh.ts "${args[@]}"

      # Much of the suite reads the board and the slate the build wrote a
      # step ago, so it is the only thing here that checks the site we are
      # about to publish. The bot once pushed a board that broke a test,
      # because this step was missing. It takes under a minute.
      - name: do the tests pass on the site the build wrote
        run: npm test

      - name: commit the refreshed site
        id: commit
        env:
          SEASON: ${{ steps.built.outputs.season }}
          WEEK: ${{ steps.built.outputs.week }}
        run: |
          git add docs data/curated

          if git diff --cached --quiet; then
            echo "$SEASON week $WEEK was already up to date, nothing to commit" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(site): refresh $SEASON week $WEEK"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Somebody may have pushed while the refresh ran. The tests above ran
      # on the code this run checked out, so if the rebase brings in
      # anything besides another refresh's output, the tests run again on
      # what is about to be pushed.
      - name: rebase onto whatever main has now
        id: rebase
        if: steps.commit.outputs.committed == 'true'
        run: |
          tested=$(git rev-parse HEAD~1)
          git fetch --quiet origin "$GITHUB_REF_NAME"

          if ! git rebase --quiet FETCH_HEAD; then
            git rebase --abort
            echo "The refresh conflicted with a push to $GITHUB_REF_NAME made while it ran, so nothing was pushed. Rerun the workflow." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          changed=$(git diff --name-only "$tested" HEAD -- . ':!docs' ':!data/curated')

          if [ -n "$changed" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "the rebase brought in changes to:"
            echo "$changed"
          fi

          if ! git diff --quiet "$tested" HEAD -- package.json package-lock.json; then
            echo "deps_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: install what the rebased package-lock.json asks for
        if: steps.rebase.outputs.deps_changed == 'true'
        run: npm ci

      - name: do the tests still pass on the rebased code
        if: steps.rebase.outputs.code_changed == 'true'
        run: npm test

      - name: push the refresh
        if: steps.commit.outputs.committed == 'true'
        env:
          SEASON: ${{ steps.built.outputs.season }}
          WEEK: ${{ steps.built.outputs.week }}
        run: |
          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "The push to $GITHUB_REF_NAME failed, most likely because somebody pushed while the tests ran. Nothing was pushed. Rerun the workflow." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "committed the $SEASON week $WEEK refresh" >> "$GITHUB_STEP_SUMMARY"
